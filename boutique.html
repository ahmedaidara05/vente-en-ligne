<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#00A854"/>
<title>IDUS Boutique</title>
<style>
:root{--g:#00A854;--bg:#0f0f1a;--card:#1a1a2e;--text:#eee;--muted:#888;--danger:#ef4444;--border:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.logo{text-align:center;font-size:28px;font-weight:800;color:var(--g);margin:24px 0 8px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.card{background:var(--card);padding:16px;border-radius:12px;margin-bottom:12px}
.card h3{color:var(--g);margin-bottom:12px;font-size:15px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid var(--border);background:#111;color:#fff;font-size:14px}
button.p{width:100%;padding:12px;background:var(--g);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:4px}
button.s{padding:8px 12px;background:#222;color:#fff;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;margin:2px}
button.d{color:var(--danger);border-color:var(--danger)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.nav button{flex:1;min-width:70px;padding:10px 6px;background:var(--card);color:#fff;border:none;border-radius:8px;font-size:11px;cursor:pointer}
.nav button.on{background:var(--g)}
.item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.err{color:var(--danger);font-size:13px;margin:8px 0}
.ok{color:var(--g);font-size:13px}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#222}
.filebtn{display:inline-block;padding:10px 14px;background:var(--g);color:#fff;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.filebtn input{display:none}
.hidden{display:none!important}
.msg-bubble{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:85%;font-size:13px}
.msg-me{background:var(--g);margin-left:auto}
.msg-them{background:#333}
#chatBox{max-height:50vh;overflow-y:auto;padding:8px}
.img-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.img-grid .box{width:72px;height:72px;border-radius:8px;overflow:hidden;position:relative;background:#222;border:1px solid var(--border)}
.img-grid .box img{width:100%;height:100%;object-fit:cover}
.img-grid .box .rm{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app">
<div class="logo">IDUS Boutique</div>
<div class="sub">Espace vendeur</div>
<div id="view-login" class="card">
<h3>Connexion boutique</h3>
<label>Email boutique</label>
<input id="loginEmail" type="email"/>
<div id="stepVerify" class="hidden">
<p class="ok" id="verifyMsg">Vérifiez votre email.</p>
<button type="button" class="p" id="btnCheckVerified">J'ai validé mon email</button>
</div>
<div id="stepPass">
<label>Mot de passe</label>
<input id="loginPass" type="password"/>
<button type="button" class="p" id="btnLogin">Se connecter</button>
</div>
<p id="loginErr" class="err" style="display:none"></p>
</div>
<div id="view-dash" class="hidden">
<div class="row" style="justify-content:space-between;margin-bottom:12px">
<div><b id="shopName">Boutique</b><br/><span class="muted" id="shopEmail"></span></div>
<button type="button" class="s d" id="btnLogout">Déconnexion</button>
</div>
<div class="nav">
<button type="button" class="on" data-t="home">Accueil</button>
<button type="button" data-t="profil">Profil</button>
<button type="button" data-t="produits">Produits</button>
<button type="button" data-t="commandes">Commandes</button>
<button type="button" data-t="messages">Messages</button>
<button type="button" data-t="auto">Auto-réponses</button>
</div>
<div id="tab-home" class="card"><h3>Dashboard</h3><p id="dashStats">…</p></div>
<div id="tab-profil" class="card hidden"></div>
<div id="tab-produits" class="card hidden"></div>
<div id="tab-commandes" class="card hidden"></div>
<div id="tab-messages" class="card hidden"></div>
<div id="tab-auto" class="card hidden"></div>
</div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, updatePassword } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, query, where, orderBy, serverTimestamp, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const MEDIA_WORKER='https://soft-surf-b4e9.ahmedsaidaidara5.workers.dev';
function fixBrokenImg(el){if(!el||!el.src||el.dataset.fixed)return;el.dataset.fixed='1';var src=el.src;fetch(src,{mode:'cors'}).then(function(r){return r.blob()}).then(function(b){if(!b||!b.size)return;var t='image/jpeg';if(/\.png/i.test(src))t='image/png';else if(/\.webp/i.test(src))t='image/webp';else if(/\.gif/i.test(src))t='image/gif';el.src=URL.createObjectURL(new Blob([b],{type:t}))}).catch(function(){})}
document.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='IMG')fixBrokenImg(t)},true);
const firebaseConfig={apiKey:"AIzaSyDkKvnL5_pHGraCFMcfXvueywwujCIG8SE",authDomain:"idus-a87a6.firebaseapp.com",projectId:"idus-a87a6",storageBucket:"idus-a87a6.firebasestorage.app",messagingSenderId:"284785552985",appId:"1:284785552985:web:4cb12a71465a0e167bcb48",measurementId:"G-M0EKXCDV3R"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
let boutique=null,boutiqueId=null,categories=[],products=[],editImages=[],editGroups=[],editVideoUrl='',editVideoKey='';
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML;}
function $(id){return document.getElementById(id);}
function showLogin(){$('view-login').classList.remove('hidden');$('view-dash').classList.add('hidden');}
function showDash(){$('view-login').classList.add('hidden');$('view-dash').classList.remove('hidden');}
async function findBoutiqueByEmail(email){const s=await getDocs(query(collection(db,'boutiques'),where('email','==',email.toLowerCase().trim())));if(s.empty)return null;const d=s.docs[0];return{id:d.id,...d.data()};}
$('btnLogin').addEventListener('click',async()=>{const email=$('loginEmail').value.trim().toLowerCase();const pass=$('loginPass').value;const err=$('loginErr');err.style.display='none';if(!email||!pass){err.textContent='Email et mot de passe requis';err.style.display='block';return;}try{const b=await findBoutiqueByEmail(email);if(!b){err.textContent='Aucune boutique liée';err.style.display='block';return;}const cred=await signInWithEmailAndPassword(auth,email,pass);if(!cred.user.emailVerified){await sendEmailVerification(cred.user);$('stepPass').classList.add('hidden');$('stepVerify').classList.remove('hidden');$('verifyMsg').textContent='Email envoyé à '+email;await signOut(auth);return;}boutique=b;boutiqueId=b.id;enterDash();}catch(e){err.textContent=e.message;err.style.display='block';}});
$('btnCheckVerified').addEventListener('click',async()=>{const email=$('loginEmail').value.trim().toLowerCase();const pass=$('loginPass').value;const err=$('loginErr');try{const cred=await signInWithEmailAndPassword(auth,email,pass);await cred.user.reload();if(!cred.user.emailVerified){err.textContent='Email pas encore validé';err.style.display='block';await signOut(auth);return;}const b=await findBoutiqueByEmail(email);boutique=b;boutiqueId=b.id;$('stepVerify').classList.add('hidden');$('stepPass').classList.remove('hidden');enterDash();}catch(e){err.textContent=e.message;err.style.display='block';}});
$('btnLogout').addEventListener('click',()=>{signOut(auth);boutique=null;boutiqueId=null;showLogin();});
function enterDash(){showDash();$('shopName').textContent=boutique.name||'Boutique';$('shopEmail').textContent=boutique.email||'';loadDashStats();tab('home');}
document.querySelectorAll('.nav button').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab(b.getAttribute('data-t'));});});
function tab(id){['home','profil','produits','commandes','messages','auto'].forEach(t=>{const el=$('tab-'+t);if(el)el.classList.toggle('hidden',t!==id);});if(id==='profil')renderProfil();if(id==='produits')renderProduits();if(id==='commandes')renderCommandes();if(id==='messages')renderMessages();if(id==='auto')renderAuto();if(id==='home')loadDashStats();}
async function loadDashStats(){try{const[ps,os,ms]=await Promise.all([getDocs(query(collection(db,'products'),where('boutiqueId','==',boutiqueId))),getDocs(query(collection(db,'orders'),where('boutiqueId','==',boutiqueId))),getDocs(query(collection(db,'conversations'),where('boutiqueId','==',boutiqueId)))]);$('dashStats').innerHTML='Produits: <b>'+ps.size+'</b><br>Commandes: <b>'+os.size+'</b><br>Conversations: <b>'+ms.size+'</b>';}catch(e){$('dashStats').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
function compressImage(file,maxW,q){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',q));};img.onerror=reject;img.src=r.result;};r.onerror=reject;r.readAsDataURL(file);});}
async function uploadToR2(fileOrBlob,filename,mime){try{const fd=new FormData();const f=(fileOrBlob instanceof File)?fileOrBlob:new File([fileOrBlob],filename||'img.jpg',{type:mime||'image/jpeg'});fd.append('file',f,f.name);const res=await fetch(MEDIA_WORKER+'/upload',{method:'POST',body:fd});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!data||!data.url)throw new Error('no url');return data.url;}catch(e){return null;}}
async function uploadImg(dataUrl){
  const res0=await fetch(dataUrl);
  const blob=await res0.blob();
  const file=new File([blob],'img_'+Date.now()+'.jpg',{type:'image/jpeg'});
  const remote=await uploadToR2(file, file.name, 'image/jpeg');
  if(!remote) throw new Error('Upload R2 échoué — réessaie');
  return remote;
}
async function uploadBlobFile(file,nameHint){
  if(file.type&&file.type.startsWith('image/')){
    const dataUrl=await compressImage(file,480,0.45);
    return {url:await uploadImg(dataUrl),key:''};
  }
  const remote=await uploadToR2(file,nameHint||file.name||'file.bin',file.type||'video/mp4');
  if(remote)return{url:remote,key:''};
  throw new Error('Upload échoué');
}
async function uploadVideoFile(file){
  if(!file||!file.type.startsWith('video/'))throw new Error('Fichier video requis');
  const dur=await new Promise((resolve,reject)=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);resolve(v.duration||0);};v.onerror=()=>reject(new Error('Lecture video impossible'));v.src=URL.createObjectURL(file);});
  if(dur>90)throw new Error('Max 1 min 30');
  if(file.size>20*1024*1024)throw new Error('Max 20 Mo');
  const up=await uploadBlobFile(file,file.name||'video.mp4');
  return {url:up.url,key:up.key||'',size:file.size};
}
async function deleteRemoteVideo(key){if(!key)return;try{await fetch(MEDIA_WORKER+'/file/'+encodeURIComponent(key),{method:'DELETE'});}catch(e){}
try{await fetch(MEDIA_WORKER+'/video/'+encodeURIComponent(key),{method:'DELETE'});}catch(e){}}
function renderProfil(){const el=$('tab-profil');el.innerHTML='<h3>Personnaliser</h3><label>Nom</label><input id="bName" value="'+esc(boutique.name||'')+'"/><label>Description</label><textarea id="bDesc" rows="3">'+esc(boutique.description||'')+'</textarea><label>Logo</label><div class="row">'+(boutique.logo?'<img class="thumb" src="'+esc(boutique.logo)+'" onerror="fixBrokenImg(this)"/>':'')+'<label class="filebtn">Choisir<input type="file" id="bLogo" accept="image/*"/></label></div><label>Bannière</label><div class="row">'+(boutique.banner?'<img class="thumb" src="'+esc(boutique.banner)+'" style="width:120px;height:48px" onerror="fixBrokenImg(this)"/>':'')+'<label class="filebtn">Choisir<input type="file" id="bBanner" accept="image/*"/></label></div><label>Nouveau mot de passe</label><input id="bNewPass" type="password"/><button type="button" class="p" id="btnSaveProfil">Enregistrer</button><p id="profilMsg" class="muted"></p>';$('bLogo').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;boutique.logo=await uploadImg(await compressImage(f,320,0.5));renderProfil();});$('bBanner').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;boutique.banner=await uploadImg(await compressImage(f,800,0.5));renderProfil();});$('btnSaveProfil').addEventListener('click',async()=>{const name=$('bName').value.trim(),description=$('bDesc').value.trim(),newPass=$('bNewPass').value;try{const data={name,description,logo:boutique.logo||'',banner:boutique.banner||'',updatedAt:serverTimestamp()};if(newPass&&newPass.length>=6){await updatePassword(auth.currentUser,newPass);data.passwordChanged=true;data.tempPassword='';}await updateDoc(doc(db,'boutiques',boutiqueId),data);boutique={...boutique,...data};$('shopName').textContent=name;$('profilMsg').textContent='Enregistré';$('profilMsg').className='ok';}catch(e){$('profilMsg').textContent=e.message;$('profilMsg').className='err';}});}async function loadCats(){const s=await getDocs(collection(db,'categories'));categories=s.docs.map(d=>({id:d.id,...d.data()}));}
async function renderProduits(){const el=$('tab-produits');el.innerHTML='<h3>Mes produits</h3><button type="button" class="p" id="btnNewProd">+ Nouveau produit</button><div id="prodList" style="margin-top:12px">…</div>';$('btnNewProd').addEventListener('click',()=>openProdForm(null));try{await loadCats();const s=await getDocs(query(collection(db,'products'),where('boutiqueId','==',boutiqueId)));products=s.docs.map(d=>({id:d.id,...d.data()}));$('prodList').innerHTML=products.map(p=>{const img=(p.images&&p.images[0])||'';return '<div class="item"><div class="row">'+(img?'<img class="thumb" src="'+esc(img)+'" onerror="fixBrokenImg(this)"/>':'')+'<div style="flex:1"><b>'+esc(p.name)+'</b><br/>'+(p.price||0)+' F</div></div><button type="button" class="s" data-edit="'+p.id+'">Modifier</button> <button type="button" class="s d" data-del="'+p.id+'">Suppr</button></div>';}).join('')||'<p class="muted">Aucun produit</p>';el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openProdForm(b.getAttribute('data-edit'))));el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Supprimer?'))return;await deleteDoc(doc(db,'products',b.getAttribute('data-del')));renderProduits();}));}catch(e){$('prodList').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
function openProdForm(id){const p=id?products.find(x=>x.id===id):null;editImages=p&&p.images?p.images.slice():[];editGroups=p&&p.variantGroups?JSON.parse(JSON.stringify(p.variantGroups)):[];editVideoUrl=(p&&p.videoUrl)||'';editVideoKey=(p&&p.videoKey)||'';const el=$('tab-produits');const delivs=['Moins de 24h','2 jours','3 jours','5 jours','2 semaines','3 semaines','1 mois','2 mois','3 mois'];el.innerHTML='<h3>'+(p?'Modifier':'Nouveau')+' produit</h3><label>Nom *</label><input id="pName" value="'+esc(p?p.name:'')+'"/><div class="row"><div style="flex:1"><label>Prix *</label><input id="pPrice" type="number" value="'+(p?p.price:0)+'"/></div><div style="flex:1"><label>Prix promo</label><input id="pPromo" type="number" value="'+(p&&p.promoPrice!=null?p.promoPrice:'')+'"/></div></div><label>Stock</label><input id="pStock" type="number" value="'+(p?p.stock??10:10)+'"/><label><input type="checkbox" id="pShowStock" '+(p&&p.showStock===false?'':'checked')+'/> Afficher le stock</label><label>Livraison</label><select id="pDelivery">'+delivs.map(d=>'<option value="'+d+'" '+(p&&p.deliveryTime===d?'selected':'')+'>'+d+'</option>').join('')+'</select><label>Catégorie</label><select id="pCat"><option value="">—</option>'+categories.map(c=>'<option value="'+c.id+'" '+(p&&p.categoryId===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><label>Description</label><textarea id="pDesc" rows="2">'+esc(p?p.description:'')+'</textarea><label>Images (max 20)</label><div id="imgList" class="img-grid"></div><label class="filebtn">+ Galerie<input type="file" id="fileImg" accept="image/*" multiple/></label><p class="muted" id="imgCount">0 / 20</p><label style="margin-top:12px">Video</label><div id="vidBox"></div><label class="filebtn">+ Video<input type="file" id="fileVid" accept="video/*"/></label> <button type="button" class="s d" id="btnRmVid">Supprimer video</button><p class="muted" id="vidStatus"></p><label style="margin-top:12px">Variantes</label><div id="varList" style="background:#111;padding:10px;border-radius:8px;margin:6px 0"></div><button type="button" class="s" id="btnAddG">+ Groupe</button><label style="margin-top:10px"><input type="checkbox" id="pPub" '+(p&&p.published===false?'':'checked')+'/> Publié</label><button type="button" class="p" id="btnSaveP">Enregistrer</button> <button type="button" class="s" id="btnCancelP">Annuler</button>';function renderImgs(){$('imgList').innerHTML=editImages.map((u,i)=>'<div class="box"><img src="'+esc(u)+'" onerror="fixBrokenImg(this)"/><button type="button" class="rm" data-rm="'+i+'">×</button></div>').join('');$('imgCount').textContent=editImages.length+' / 20';$('imgList').querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{editImages.splice(+b.getAttribute('data-rm'),1);renderImgs();}));}renderImgs();function paintVid(){const box=$('vidBox');if(editVideoUrl)box.innerHTML='<video src="'+esc(editVideoUrl)+'" controls style="width:100%;max-height:180px;border-radius:8px;background:#000"></video>';else box.innerHTML='<span class="muted">Aucune video</span>';}paintVid();$('fileImg').addEventListener('change',async e=>{for(const f of Array.from(e.target.files||[])){if(editImages.length>=20)break;try{editImages.push(await uploadImg(await compressImage(f,480,0.45)));renderImgs();}catch(err){alert(err.message);}}e.target.value='';});$('fileVid').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const up=await uploadVideoFile(f);editVideoUrl=up.url;editVideoKey=up.key||'';paintVid();$('vidStatus').textContent='OK';}catch(err){alert(err.message);}$('vidStatus').textContent='';e.target.value='';});$('btnRmVid').addEventListener('click',async()=>{if(!editVideoUrl)return;await deleteRemoteVideo(editVideoKey);editVideoUrl='';editVideoKey='';paintVid();});function renderVars(){const vl=$('varList');if(!editGroups.length){vl.innerHTML='<p class="muted">Aucun groupe</p>';return;}vl.innerHTML=editGroups.map((g,gi)=>'<div style="border:1px solid #333;padding:8px;margin-bottom:8px;border-radius:8px"><input placeholder="Groupe" value="'+esc(g.name)+'" data-gn="'+gi+'"/><button type="button" class="s d" data-rm-g="'+gi+'">Suppr groupe</button><div id="opts'+gi+'"></div><button type="button" class="s" data-add-o="'+gi+'">+ Option</button></div>').join('');vl.querySelectorAll('[data-gn]').forEach(inp=>inp.addEventListener('input',()=>{editGroups[+inp.getAttribute('data-gn')].name=inp.value;}));vl.querySelectorAll('[data-rm-g]').forEach(b=>b.addEventListener('click',()=>{editGroups.splice(+b.getAttribute('data-rm-g'),1);renderVars();}));vl.querySelectorAll('[data-add-o]').forEach(b=>b.addEventListener('click',()=>{const gi=+b.getAttribute('data-add-o');if(!editGroups[gi].options)editGroups[gi].options=[];editGroups[gi].options.push({label:'Option',priceDelta:0,image:''});renderVars();}));editGroups.forEach((g,gi)=>{const box=$('opts'+gi);if(!box)return;box.innerHTML=(g.options||[]).map((o,oi)=>'<div class="row" style="margin:4px 0"><input style="flex:1" value="'+esc(o.label)+'" data-ol="'+gi+'-'+oi+'"/><input style="width:70px" type="number" value="'+(o.priceDelta||0)+'" data-op="'+gi+'-'+oi+'"/><button type="button" class="s d" data-rm-o="'+gi+'-'+oi+'">×</button></div>').join('');box.querySelectorAll('[data-ol]').forEach(inp=>{const[gi,oi]=inp.getAttribute('data-ol').split('-').map(Number);inp.addEventListener('input',()=>{editGroups[gi].options[oi].label=inp.value;});});box.querySelectorAll('[data-op]').forEach(inp=>{const[gi,oi]=inp.getAttribute('data-op').split('-').map(Number);inp.addEventListener('input',()=>{editGroups[gi].options[oi].priceDelta=parseFloat(inp.value)||0;});});box.querySelectorAll('[data-rm-o]').forEach(b=>{b.addEventListener('click',()=>{const[gi,oi]=b.getAttribute('data-rm-o').split('-').map(Number);editGroups[gi].options.splice(oi,1);renderVars();});});});}$('btnAddG').addEventListener('click',()=>{editGroups.push({name:'Groupe',options:[{label:'Option',priceDelta:0,image:''}]});renderVars();});renderVars();$('btnCancelP').addEventListener('click',()=>renderProduits());$('btnSaveP').addEventListener('click',async()=>{const name=$('pName').value.trim();const price=parseFloat($('pPrice').value)||0;if(!name||!price){alert('Nom et prix requis');return;}const data={name,price,promoPrice:$('pPromo').value?parseFloat($('pPromo').value):null,stock:parseInt($('pStock').value)||0,showStock:$('pShowStock').checked,deliveryTime:$('pDelivery').value,categoryId:$('pCat').value||null,description:$('pDesc').value.trim(),images:editImages,variantGroups:editGroups,videoUrl:editVideoUrl||null,videoKey:editVideoKey||null,published:$('pPub').checked,boutiqueId:boutiqueId,boutiqueName:boutique.name||'',updatedAt:serverTimestamp()};try{if(p){await updateDoc(doc(db,'products',p.id),data);}else{data.createdAt=serverTimestamp();await addDoc(collection(db,'products'),data);}renderProduits();}catch(e){alert(e.message);}});}
async function renderCommandes(){const el=$('tab-commandes');el.innerHTML='<h3>Commandes</h3><div id="ordList">…</div>';try{const s=await getDocs(query(collection(db,'orders'),where('boutiqueId','==',boutiqueId)));const list=s.docs.map(d=>({id:d.id,...d.data()}));list.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));$('ordList').innerHTML=list.length?list.map(o=>'<div class="item"><b>'+esc(o.orderNumber||o.id)+'</b> — '+(o.total||0)+' F<br/><span class="muted">'+esc((o.customer&&o.customer.name)||'')+' · '+esc(o.status||'')+'</span></div>').join(''):'<p class="muted">Aucune commande</p>';}catch(e){$('ordList').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
async function renderMessages(){const el=$('tab-messages');el.innerHTML='<h3>Messages</h3><div id="convList">…</div><div id="chatPanel" class="hidden"><div id="chatBox"></div><div class="row"><input id="chatIn" style="flex:1" placeholder="Message…"/><button type="button" class="s" id="chatSend">Envoyer</button></div></div>';try{const s=await getDocs(query(collection(db,'conversations'),where('boutiqueId','==',boutiqueId)));const list=s.docs.map(d=>({id:d.id,...d.data()}));$('convList').innerHTML=list.length?list.map(c=>'<div class="item" data-cid="'+c.id+'" style="cursor:pointer"><b>'+esc(c.customerName||c.customerEmail||'Client')+'</b><br/><span class="muted">'+esc(c.lastMessage||'')+'</span></div>').join(''):'<p class="muted">Aucun message</p>';el.querySelectorAll('[data-cid]').forEach(row=>row.addEventListener('click',()=>openChat(row.getAttribute('data-cid'))));}catch(e){$('convList').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
let unsubChat=null;
function openChat(cid){$('chatPanel').classList.remove('hidden');if(unsubChat)unsubChat();unsubChat=onSnapshot(query(collection(db,'conversations',cid,'messages'),orderBy('createdAt','asc')),snap=>{const box=$('chatBox');box.innerHTML=snap.docs.map(d=>{const m=d.data();const me=m.from==='boutique';return '<div class="msg-bubble '+(me?'msg-me':'msg-them')+'">'+esc(m.text||'')+'</div>';}).join('');box.scrollTop=box.scrollHeight;});$('chatSend').onclick=async()=>{const text=$('chatIn').value.trim();if(!text)return;await addDoc(collection(db,'conversations',cid,'messages'),{from:'boutique',text,createdAt:serverTimestamp()});await updateDoc(doc(db,'conversations',cid),{lastMessage:text,updatedAt:serverTimestamp()});$('chatIn').value='';};}
function renderAuto(){const el=$('tab-auto');el.innerHTML='<h3>Auto-réponses</h3><p class="muted">Réponses automatiques (optionnel)</p><textarea id="autoText" rows="4" placeholder="Message auto…">'+esc((boutique&&boutique.autoReply)||'')+'</textarea><button type="button" class="p" id="btnSaveAuto">Enregistrer</button>';$('btnSaveAuto').addEventListener('click',async()=>{try{await updateDoc(doc(db,'boutiques',boutiqueId),{autoReply:$('autoText').value.trim()});boutique.autoReply=$('autoText').value.trim();alert('OK');}catch(e){alert(e.message);}});}
onAuthStateChanged(auth,async(u)=>{if(!u){showLogin();return;}try{const b=await findBoutiqueByEmail(u.email||'');if(!b){showLogin();return;}if(!u.emailVerified){showLogin();return;}boutique=b;boutiqueId=b.id;enterDash();}catch(e){showLogin();}});
</script>
