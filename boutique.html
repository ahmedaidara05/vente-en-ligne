<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#00A854"/>
<title>IDUS Boutique</title>
<style>
:root{--g:#00A854;--bg:#0f0f1a;--card:#1a1a2e;--text:#eee;--muted:#888;--danger:#ef4444;--border:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.logo{text-align:center;font-size:28px;font-weight:800;color:var(--g);margin:24px 0 8px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.card{background:var(--card);padding:16px;border-radius:12px;margin-bottom:12px}
.card h3{color:var(--g);margin-bottom:12px;font-size:15px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid var(--border);background:#111;color:#fff;font-size:14px}
button.p{width:100%;padding:12px;background:var(--g);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:4px}
button.s{padding:8px 12px;background:#222;color:#fff;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;margin:2px}
button.d{color:var(--danger);border-color:var(--danger)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.nav button{flex:1;min-width:70px;padding:10px 6px;background:var(--card);color:#fff;border:none;border-radius:8px;font-size:11px;cursor:pointer}
.nav button.on{background:var(--g)}
.item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.err{color:var(--danger);font-size:13px;margin:8px 0}
.ok{color:var(--g);font-size:13px}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#222}
.filebtn{display:inline-block;padding:10px 14px;background:var(--g);color:#fff;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.filebtn input{display:none}
.hidden{display:none!important}
.msg-bubble{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:85%;font-size:13px}
.msg-me{background:var(--g);margin-left:auto}
.msg-them{background:#333}
#chatBox{max-height:50vh;overflow-y:auto;padding:8px}
</style>
</head>
<body>
<div class="wrap" id="app">
<div class="logo">IDUS Boutique</div>
<div class="sub">Espace vendeur</div>
<div id="view-login" class="card">
<h3>Connexion boutique</h3>
<p class="muted" style="margin-bottom:12px">Email fourni par l'admin. Validation email requise au premier accès.</p>
<label>Email boutique</label>
<input id="loginEmail" type="email" placeholder="boutique@email.com"/>
<div id="stepVerify" class="hidden">
<p class="ok" id="verifyMsg">Vérifiez votre email puis continuez.</p>
<button type="button" class="p" id="btnCheckVerified">J'ai validé mon email</button>
<button type="button" class="s" id="btnResendVerify" style="width:100%;margin-top:8px">Renvoyer l'email</button>
</div>
<div id="stepPass">
<label>Mot de passe</label>
<input id="loginPass" type="password"/>
<button type="button" class="p" id="btnLogin">Se connecter</button>
</div>
<p id="loginErr" class="err" style="display:none"></p>
</div>
<div id="view-dash" class="hidden">
<div class="row" style="justify-content:space-between;margin-bottom:12px">
<div><b id="shopName">Boutique</b><br/><span class="muted" id="shopEmail"></span></div>
<button type="button" class="s d" id="btnLogout">Déconnexion</button>
</div>
<div class="nav">
<button type="button" class="on" data-t="home">Accueil</button>
<button type="button" data-t="profil">Profil</button>
<button type="button" data-t="produits">Produits</button>
<button type="button" data-t="commandes">Commandes</button>
<button type="button" data-t="messages">Messages</button>
<button type="button" data-t="auto">Auto-réponses</button>
</div>
<div id="tab-home" class="card"><h3>Tableau de bord</h3><p id="dashStats">…</p></div>
<div id="tab-profil" class="card hidden"></div>
<div id="tab-produits" class="card hidden"></div>
<div id="tab-commandes" class="card hidden"></div>
<div id="tab-messages" class="card hidden"></div>
<div id="tab-auto" class="card hidden"></div>
</div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, updatePassword } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, orderBy, serverTimestamp, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { getStorage, ref, uploadString, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';
const firebaseConfig={apiKey:"AIzaSyDkKvnL5_pHGraCFMcfXvueywwujCIG8SE",authDomain:"idus-a87a6.firebaseapp.com",projectId:"idus-a87a6",storageBucket:"idus-a87a6.firebasestorage.app",messagingSenderId:"284785552985",appId:"1:284785552985:web:4cb12a71465a0e167bcb48",measurementId:"G-M0EKXCDV3R"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);let storage=null;try{storage=getStorage(app);}catch(e){}
setPersistence(auth,browserLocalPersistence).catch(()=>{});
let boutique=null,boutiqueId=null,categories=[],products=[],editImages=[],editGroups=[];
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML;}
function $(id){return document.getElementById(id);}
function showLogin(){$('view-login').classList.remove('hidden');$('view-dash').classList.add('hidden');}
function showDash(){$('view-login').classList.add('hidden');$('view-dash').classList.remove('hidden');}
async function findBoutiqueByEmail(email){const s=await getDocs(query(collection(db,'boutiques'),where('email','==',email.toLowerCase().trim())));if(s.empty)return null;const d=s.docs[0];return{id:d.id,...d.data()};}
$('btnLogin').addEventListener('click',async()=>{const email=$('loginEmail').value.trim().toLowerCase();const pass=$('loginPass').value;const err=$('loginErr');err.style.display='none';if(!email||!pass){err.textContent='Email et mot de passe requis';err.style.display='block';return;}try{const b=await findBoutiqueByEmail(email);if(!b){err.textContent='Aucune boutique liée à cet email';err.style.display='block';return;}const cred=await signInWithEmailAndPassword(auth,email,pass);if(!cred.user.emailVerified){await sendEmailVerification(cred.user);$('stepPass').classList.add('hidden');$('stepVerify').classList.remove('hidden');$('verifyMsg').textContent='Email de validation envoyé à '+email+'. Cliquez le lien puis revenez.';await signOut(auth);return;}boutique=b;boutiqueId=b.id;await updateDoc(doc(db,'boutiques',boutiqueId),{lastLogin:serverTimestamp()});enterDash();}catch(e){err.textContent=e.message;err.style.display='block';}});
$('btnCheckVerified').addEventListener('click',async()=>{const email=$('loginEmail').value.trim().toLowerCase();const pass=$('loginPass').value;const err=$('loginErr');try{const cred=await signInWithEmailAndPassword(auth,email,pass);await cred.user.reload();if(!cred.user.emailVerified){err.textContent='Email pas encore validé';err.style.display='block';await signOut(auth);return;}const b=await findBoutiqueByEmail(email);boutique=b;boutiqueId=b.id;$('stepVerify').classList.add('hidden');$('stepPass').classList.remove('hidden');enterDash();}catch(e){err.textContent=e.message;err.style.display='block';}});
$('btnResendVerify').addEventListener('click',async()=>{const email=$('loginEmail').value.trim().toLowerCase();const pass=$('loginPass').value;try{const cred=await signInWithEmailAndPassword(auth,email,pass);await sendEmailVerification(cred.user);await signOut(auth);alert('Email renvoyé');}catch(e){alert(e.message);}});
$('btnLogout').addEventListener('click',()=>{signOut(auth);boutique=null;boutiqueId=null;showLogin();});
function enterDash(){showDash();$('shopName').textContent=boutique.name||'Boutique';$('shopEmail').textContent=boutique.email||'';loadDashStats();tab('home');}
document.querySelectorAll('.nav button').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab(b.getAttribute('data-t'));});});
function tab(id){['home','profil','produits','commandes','messages','auto'].forEach(t=>{const el=$('tab-'+t);if(el)el.classList.toggle('hidden',t!==id);});if(id==='profil')renderProfil();if(id==='produits')renderProduits();if(id==='commandes')renderCommandes();if(id==='messages')renderMessages();if(id==='auto')renderAuto();if(id==='home')loadDashStats();}
async function loadDashStats(){try{const[ps,os,ms]=await Promise.all([getDocs(query(collection(db,'products'),where('boutiqueId','==',boutiqueId))),getDocs(query(collection(db,'orders'),where('boutiqueId','==',boutiqueId))),getDocs(query(collection(db,'conversations'),where('boutiqueId','==',boutiqueId)))]);$('dashStats').innerHTML='Produits: <b>'+ps.size+'</b><br>Commandes: <b>'+os.size+'</b><br>Conversations: <b>'+ms.size+'</b><br>Abonnés: <b>'+(boutique.followersCount||0)+'</b>';}catch(e){$('dashStats').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
function compressImage(file,maxW,q){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',q));};img.onerror=reject;img.src=r.result;};r.onerror=reject;r.readAsDataURL(file);});}
async function uploadImg(dataUrl){if(storage){try{const path='boutiques/'+boutiqueId+'/'+Date.now()+'.jpg';const r=ref(storage,path);await uploadString(r,dataUrl,'data_url');return await getDownloadURL(r);}catch(e){}}return dataUrl;}
function renderProfil(){const el=$('tab-profil');el.innerHTML='<h3>Personnaliser</h3><label>Nom</label><input id="bName" value="'+esc(boutique.name||'')+'"/><label>Description</label><textarea id="bDesc" rows="3">'+esc(boutique.description||'')+'</textarea><label>Logo</label><div class="row">'+(boutique.logo?'<img class="thumb" src="'+esc(boutique.logo)+'"/>':'')+'<label class="filebtn">Choisir<input type="file" id="bLogo" accept="image/*"/></label></div><label>Bannière</label><div class="row">'+(boutique.banner?'<img class="thumb" src="'+esc(boutique.banner)+'" style="width:120px;height:48px"/>':'')+'<label class="filebtn">Choisir<input type="file" id="bBanner" accept="image/*"/></label></div><label>Nouveau mot de passe</label><input id="bNewPass" type="password" placeholder="Vide = ne pas changer"/><button type="button" class="p" id="btnSaveProfil">Enregistrer</button><p id="profilMsg" class="muted"></p>';$('bLogo').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const d=await compressImage(f,400,0.6);boutique.logo=await uploadImg(d);renderProfil();});$('bBanner').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const d=await compressImage(f,900,0.55);boutique.banner=await uploadImg(d);renderProfil();});$('btnSaveProfil').addEventListener('click',async()=>{const name=$('bName').value.trim(),description=$('bDesc').value.trim(),newPass=$('bNewPass').value;try{const data={name,description,logo:boutique.logo||'',banner:boutique.banner||'',updatedAt:serverTimestamp()};if(newPass&&newPass.length>=6){await updatePassword(auth.currentUser,newPass);data.passwordChanged=true;data.lastPasswordChange=serverTimestamp();data.tempPassword='';}await updateDoc(doc(db,'boutiques',boutiqueId),data);boutique={...boutique,...data};$('shopName').textContent=name;$('profilMsg').textContent='Enregistré';$('profilMsg').className='ok';}catch(e){$('profilMsg').textContent=e.message;$('profilMsg').className='err';}});}async function loadCats(){const s=await getDocs(collection(db,'categories'));categories=s.docs.map(d=>({id:d.id,...d.data()}));}
async function renderProduits(){const el=$('tab-produits');el.innerHTML='<h3>Mes produits</h3><button type="button" class="p" id="btnNewProd">+ Nouveau produit</button><div id="prodList" style="margin-top:12px">…</div>';$('btnNewProd').addEventListener('click',()=>openProdForm(null));try{await loadCats();const s=await getDocs(query(collection(db,'products'),where('boutiqueId','==',boutiqueId)));products=s.docs.map(d=>({id:d.id,...d.data()}));$('prodList').innerHTML=products.map(p=>{const img=(p.images&&p.images[0])||'';return '<div class="item"><div class="row">'+(img?'<img class="thumb" src="'+esc(img)+'"/>':'')+'<div style="flex:1"><b>'+esc(p.name)+'</b><br/>'+(p.price||0)+' F</div></div><button type="button" class="s" data-edit="'+p.id+'">Modifier</button> <button type="button" class="s d" data-del="'+p.id+'">Suppr</button></div>';}).join('')||'<p class="muted">Aucun produit</p>';el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openProdForm(b.getAttribute('data-edit'))));el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Supprimer?'))return;await deleteDoc(doc(db,'products',b.getAttribute('data-del')));renderProduits();}));}catch(e){$('prodList').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
function openProdForm(id){const p=id?products.find(x=>x.id===id):null;editImages=p&&p.images?p.images.slice():[];editGroups=p&&p.variantGroups?JSON.parse(JSON.stringify(p.variantGroups)):[];const catOpts=categories.map(c=>'<option value="'+c.id+'">'+(p&&p.categoryId===c.id?'selected':'')+esc(c.name)+'</option>').join('');const el=$('tab-produits');el.innerHTML='<h3>'+(p?'Modifier':'Nouveau')+'</h3><label>Nom *</label><input id="pName" value="'+esc(p?p.name:'')+'"/><label>Prix *</label><input id="pPrice" type="number" value="'+(p?p.price:0)+'"/><label>Stock</label><input id="pStock" type="number" value="'+(p?p.stock??10:10)+'"/><label>Catégorie</label><select id="pCat"><option value="">—</option>'+categories.map(c=>'<option value="'+c.id+'" '+(p&&p.categoryId===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><label>Description</label><textarea id="pDesc" rows="2">'+esc(p?p.description:'')+'</textarea><label>Images</label><div id="imgList" class="row" style="flex-wrap:wrap"></div><label class="filebtn">+ Images<input type="file" id="fileImg" accept="image/*" multiple/></label><button type="button" class="p" id="btnSaveP">Enregistrer</button> <button type="button" class="s" id="btnCancelP">Annuler</button>';function renderImgs(){$('imgList').innerHTML=editImages.map((u,i)=>'<img class="thumb" src="'+esc(u)+'"/>').join('');}renderImgs();$('fileImg').addEventListener('change',async e=>{for(const f of Array.from(e.target.files||[])){if(editImages.length>=20)break;const d=await compressImage(f,700,0.55);editImages.push(await uploadImg(d));renderImgs();}});$('btnCancelP').addEventListener('click',()=>renderProduits());$('btnSaveP').addEventListener('click',async()=>{const name=$('pName').value.trim(),price=parseFloat($('pPrice').value)||0;if(!name){alert('Nom requis');return;}const data={name,price,stock:parseInt($('pStock').value)||0,categoryId:$('pCat').value||null,description:$('pDesc').value.trim(),images:editImages.slice(0,20),variantGroups:[],published:true,boutiqueId,boutiqueName:boutique.name||'',updatedAt:serverTimestamp()};try{if(id)await updateDoc(doc(db,'products',id),data);else{data.createdAt=serverTimestamp();data.sold=0;await addDoc(collection(db,'products'),data);}alert('Enregistré');renderProduits();}catch(e){alert(e.message);}});}
async function renderCommandes(){const el=$('tab-commandes');el.innerHTML='<h3>Commandes</h3><div id="ordList">…</div>';try{const s=await getDocs(query(collection(db,'orders'),where('boutiqueId','==',boutiqueId)));const list=s.docs.map(d=>({id:d.id,...d.data()}));$('ordList').innerHTML=list.map(o=>{const c=o.customer||{};return '<div class="item"><b>#'+esc(o.orderNumber||o.id.slice(0,8))+'</b> · '+esc(o.status||'pending')+' · <b>'+(o.total||0)+' F</b><br/>'+esc(c.name)+' · '+esc(c.phone)+'<div class="row" style="margin-top:6px"><button type="button" class="s" data-st="'+o.id+'-confirmed">Confirmer</button><button type="button" class="s" data-st="'+o.id+'-shipped">Expédié</button><button type="button" class="s" data-st="'+o.id+'-delivered">Livré</button></div></div>';}).join('')||'<p class="muted">Aucune</p>';el.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',async()=>{const[id,st]=b.getAttribute('data-st').split('-');await updateDoc(doc(db,'orders',id),{status:st});renderCommandes();}));}catch(e){$('ordList').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
async function renderMessages(){const el=$('tab-messages');el.innerHTML='<h3>Messages</h3><div id="convList">…</div><div id="chatArea" class="hidden"></div>';try{const s=await getDocs(query(collection(db,'conversations'),where('boutiqueId','==',boutiqueId)));const list=s.docs.map(d=>({id:d.id,...d.data()}));$('convList').innerHTML=list.map(c=>'<div class="item" data-cid="'+c.id+'" style="cursor:pointer"><b>'+esc(c.customerName||c.customerEmail||'Client')+'</b><br/><span class="muted">'+esc((c.lastMessage||'').slice(0,60))+'</span></div>').join('')||'<p class="muted">Aucun message</p>';el.querySelectorAll('[data-cid]').forEach(b=>b.addEventListener('click',()=>openChat(b.getAttribute('data-cid'),list.find(x=>x.id===b.getAttribute('data-cid')))));}catch(e){$('convList').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
async function openChat(cid,conv){$('convList').classList.add('hidden');const area=$('chatArea');area.classList.remove('hidden');area.innerHTML='<button type="button" class="s" id="backConv">←</button> <b>'+esc(conv.customerName||'Client')+'</b><div id="chatBox"></div><div class="row"><input id="msgIn" placeholder="Répondre…" style="flex:1"/><button type="button" class="p" id="msgSend" style="width:auto;padding:10px 14px">Envoyer</button></div>';$('backConv').addEventListener('click',()=>{area.classList.add('hidden');$('convList').classList.remove('hidden');});const box=$('chatBox');onSnapshot(query(collection(db,'conversations',cid,'messages'),orderBy('createdAt','asc')),snap=>{box.innerHTML=snap.docs.map(d=>{const m=d.data();const me=m.from==='boutique';return '<div class="msg-bubble '+(me?'msg-me':'msg-them')+'">'+esc(m.text||'')+'</div>';}).join('');box.scrollTop=box.scrollHeight;});$('msgSend').addEventListener('click',async()=>{const text=$('msgIn').value.trim();if(!text)return;await addDoc(collection(db,'conversations',cid,'messages'),{from:'boutique',text,createdAt:serverTimestamp()});await updateDoc(doc(db,'conversations',cid),{lastMessage:text,updatedAt:serverTimestamp()});$('msgIn').value='';});}
async function renderAuto(){const el=$('tab-auto');el.innerHTML='<h3>Réponses auto</h3><p class="muted">Si le message contient le mot-clé → réponse automatique.</p><div id="autoList">…</div><label>Mot-clé</label><input id="autoKey" placeholder="caractéristiques"/><label>Réponse</label><textarea id="autoRes" rows="2"></textarea><button type="button" class="p" id="btnAddAuto">Ajouter</button>';async function load(){const s=await getDocs(query(collection(db,'autoReplies'),where('boutiqueId','==',boutiqueId)));$('autoList').innerHTML=s.docs.map(d=>{const a=d.data();return '<div class="item"><b>'+esc(a.keyword)+'</b> → '+esc(a.response)+' <button type="button" class="s d" data-del="'+d.id+'">Suppr</button></div>';}).join('')||'<p class="muted">Aucune</p>';$('autoList').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{await deleteDoc(doc(db,'autoReplies',b.getAttribute('data-del')));load();}));}load();$('btnAddAuto').addEventListener('click',async()=>{const keyword=$('autoKey').value.trim().toLowerCase(),response=$('autoRes').value.trim();if(!keyword||!response)return;await addDoc(collection(db,'autoReplies'),{boutiqueId,keyword,response,createdAt:serverTimestamp()});$('autoKey').value='';$('autoRes').value='';load();});}
onAuthStateChanged(auth,async u=>{if(!u){showLogin();return;}if(!u.emailVerified){showLogin();return;}try{const b=await findBoutiqueByEmail(u.email);if(!b){await signOut(auth);showLogin();return;}boutique=b;boutiqueId=b.id;enterDash();}catch(e){showLogin();}});
</script>
</body>
</html>
