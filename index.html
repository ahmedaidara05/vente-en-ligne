<style>

.page{display:none;min-height:50vh}.page.on{display:block}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px}
.pc{background:#fff;border-radius:6px;overflow:hidden}

.pc .tt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}

.em{text-align:center;padding:48px 20px;color:#888}
.bn{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h)+var(--safe-b));padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}

.to2{position:fixed;left:50%;bottom:calc(var(--nav-h)+20px+var(--safe-b));transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:500;opacity:0;pointer-events:none;transition:opacity .25s}.to2.on{opacity:1}
.pti{font-size:15px;font-weight:700;padding:12px 10px;background:#fff}
.ci{display:flex;gap:10px;padding:12px;background:#fff;border-bottom:1px solid var(--border)}

.cs{background:#fff;padding:12px;border-top:1px solid var(--border);position:sticky;bottom:calc(var(--nav-h)+var(--safe-b))}
.cs .rw{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.cs .tt{font-weight:700;font-size:15px}
.br{background:var(--danger);color:#fff;height:44px;border-radius:22px;width:100%;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}

.ppx{font-size:26px;font-weight:800;color:var(--danger)}

.pd-top{position:fixed;top:0;left:0;right:0;z-index:120;display:flex;justify-content:space-between;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));pointer-events:none}

.vs-banner{padding:12px 16px 8px;text-align:center;font-size:13px;color:#00A854;font-weight:600}
.vs-ship{background:#F0FFF4;padding:8px 16px;font-size:12px;color:#00A854}
.vs-top{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #f0f0f0}
.vs-top img{width:90px;height:90px;object-fit:cover;border-radius:8px;background:#f5f5f5;flex-shrink:0}
.vs-price{color:var(--danger);font-size:20px;font-weight:800}
.vs-price small{font-size:12px;font-weight:700}
.vs-title{font-size:13px;color:#333;margin-top:6px}
.vs-qty{display:flex;align-items:center;margin-top:10px}
.vs-qty button{width:28px;height:28px;border:1px solid #ddd;background:#fafafa;font-size:16px}
.vs-qty span{min-width:36px;text-align:center;font-weight:600;border-top:1px solid #ddd;border-bottom:1px solid #ddd;line-height:26px}
.vs-sec{padding:14px 16px;border-bottom:1px solid #f5f5f5}
.vs-sec h4{font-size:13px;font-weight:600;margin-bottom:10px}
.vs-opts{display:flex;flex-wrap:wrap;gap:8px}
.vs-opt{padding:8px 14px;border-radius:6px;font-size:13px;border:1.5px solid #e0e0e0;background:#fafafa}
.vs-opt.on{border-color:var(--danger);color:var(--danger);background:#FFF5F5}
.vs-foot{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:10px 16px calc(10px + var(--safe-b));background:#fff;border-top:1px solid #eee;z-index:301}
.vs-foot .br{border-radius:24px;height:48px;font-size:16px}
.fs-bg{position:fixed;inset:0;background:#000;z-index:400;display:flex;flex-direction:column}
.fs-top{display:flex;justify-content:space-between;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.fs-top button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:16px}
.fs-img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.fs-img img{max-width:100%;max-height:100%;object-fit:contain}
.fs-overlay{position:absolute;left:12px;right:12px;bottom:80px;background:rgba(0,0,0,.75);color:#fff;padding:12px;border-radius:8px;font-size:13px;display:none}
.fs-overlay.on{display:block}
.fs-bot{padding:10px 12px calc(10px + var(--safe-b));background:#111}
.fs-price{color:#fff;font-size:18px;font-weight:800;margin-bottom:6px}
.fs-desc{color:#ccc;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px;cursor:pointer}
.fs-btns{display:flex;gap:8px}
</style>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, query, where, orderBy, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyDkKvnL5_pHGraCFMcfXvueywwujCIG8SE",authDomain:"idus-a87a6.firebaseapp.com",projectId:"idus-a87a6",storageBucket:"idus-a87a6.firebasestorage.app",messagingSenderId:"284785552985",appId:"1:284785552985:web:4cb12a71465a0e167bcb48",measurementId:"G-M0EKXCDV3R"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
setPersistence(auth,browserLocalPersistence).catch(function(){});
let favorites=JSON.parse(localStorage.getItem('vl_favs')||'[]');
let currentUser=null,cart=JSON.parse(localStorage.getItem('vl_cart')||'[]'),products=[],categories=[],settings={shippingFee:1500},currentProduct=null,selectedVariants={},qty=1,currentCategory=null,searchTerm='',sheetMode='cart',sheetCartIdx=null,pageHistory=[],touchStartX=0;
function $(id){return document.getElementById(id)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2200)}
function formatPrice(n){return new Intl.NumberFormat('fr-FR').format(n||0)}
function escapeHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function saveCart(){localStorage.setItem('vl_cart',JSON.stringify(cart));updateCartBadge()}
function saveFavs(){localStorage.setItem('vl_favs',JSON.stringify(favorites))}
function isFav(id){return favorites.indexOf(id)>=0}
function toggleFav(id){const i=favorites.indexOf(id);if(i>=0)favorites.splice(i,1);else favorites.push(id);saveFavs();toast(i>=0?'Retiré des favoris':'Ajouté aux favoris')}
function loadProductCache(){try{return JSON.parse(localStorage.getItem('vl_products')||'[]')}catch(e){return[]}}
function saveProductCache(list){try{localStorage.setItem('vl_products',JSON.stringify(list.slice(0,80)))}catch(e){}}
function updateCartBadge(){const c=cart.reduce(function(s,i){return s+(i.qty||1)},0);const b=$('cartBadge');if(!b)return;if(c>0){b.style.display='flex';b.textContent=c>99?'99+':c}else b.style.display='none'}
function minProductPrice(p){let base=(p.promoPrice&&p.promoPrice<p.price)?p.promoPrice:(p.price||0);const groups=p.variantGroups||[];for(let i=0;i<groups.length;i++){const opts=groups[i].options||[];if(!opts.length)continue;let mn=Infinity;for(let j=0;j<opts.length;j++){const d=parseFloat(opts[j].priceDelta)||0;if(d<mn)mn=d}if(mn!==Infinity)base+=mn}return base}
function calcVariantPrice(p,sel){let base=(p.promoPrice&&p.promoPrice<p.price)?p.promoPrice:(p.price||0);const groups=p.variantGroups||[];for(let i=0;i<groups.length;i++){const g=groups[i];const lab=sel[g.name];if(!lab)continue;const opts=g.options||[];for(let j=0;j<opts.length;j++){if(opts[j].label===lab){base+=parseFloat(opts[j].priceDelta)||0;break}}}return base}
function variantImage(p,sel){const groups=p.variantGroups||[];for(let i=0;i<groups.length;i++){const g=groups[i];const lab=sel[g.name];if(!lab)continue;const opts=g.options||[];for(let j=0;j<opts.length;j++){if(opts[j].label===lab&&opts[j].image)return opts[j].image}}return(p.images&&p.images[0])||''}
function setChrome(hide){document.body.classList.toggle('hide-chrome',!!hide)}
function showPage(page,data){const prev=document.querySelector('.page.on');if(prev&&prev.id){const name=prev.id.replace('page-','');if(name!==page)pageHistory.push({page:name,data:null})}document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on')});const el=$('page-'+page);if(el)el.classList.add('on');document.querySelectorAll('.bn button').forEach(function(b){b.classList.toggle('on',b.dataset.page===page)});setChrome(page==='product'||page==='boutique'||page==='messages'||page==='chat-thread'||page==='favorites');window.scrollTo(0,0);if(page==='home')renderHome();else if(page==='catalog')renderCatalog();else if(page==='product'&&data)renderProduct(data);else if(page==='cart')renderCart();else if(page==='checkout')renderCheckout();else if(page==='account')renderAccount();else if(page==='auth')renderAuth();else if(page==='chat')$('page-chat').innerHTML='<div class="em"><p>Messages bientôt</p></div>';else if(page==='video')$('page-video').innerHTML='<div class="em"><p>Vidéos bientôt</p></div>';else if(page==='favorites')renderFavorites();else if(page==='boutique'&&data)renderBoutiquePage(data);else if(page==='messages')renderMessagesList();else if(page==='chat-thread'&&data)renderChatThread(data)}
window.showPage=showPage;
function goBack(){const fs=document.getElementById('fsViewer');if(fs){fs.remove();return}const vs=document.getElementById('variantSheet');if(vs){vs.remove();return}if(pageHistory.length){const last=pageHistory.pop();showPage(last.page,last.data)}else{setChrome(false);showPage('home')}}
document.getElementById('logoBtn').addEventListener('click',function(){setChrome(false);showPage('home')});

document.querySelectorAll('.bn button').forEach(function(btn){btn.addEventListener('click',function(){setChrome(false);showPage(btn.dataset.page)})});
document.addEventListener('touchstart',function(e){touchStartX=e.changedTouches[0].screenX},{passive:true});
document.addEventListener('touchend',function(e){const dx=e.changedTouches[0].screenX-touchStartX;if(dx>80&&touchStartX<40)goBack()},{passive:true});
async function loadCategories(){try{const s=await getDocs(collection(db,'categories'));categories=s.docs.map(function(d){return{id:d.id,...d.data()}})}catch(e){categories=[]}}
async function loadProducts(){try{const s=await getDocs(collection(db,'products'));products=s.docs.map(function(d){return{id:d.id,...d.data()}}).filter(function(p){return p.published!==false});saveProductCache(products)}catch(e){if(!products.length)products=loadProductCache()}return products}
function productCard(p){const promo=p.promoPrice&&p.promoPrice<p.price;const price=minProductPrice(p);const img=(p.images&&p.images[0])||'https://via.placeholder.com/400?text=Produit';const deliv=p.deliveryTime||'2 jours';const struck=promo?'<span style="font-size:11px;color:#999;text-decoration:line-through;margin-left:4px">'+formatPrice(p.price)+' F</span>':'';return'<div class="pc" data-pid="'+p.id+'"><div class="im"><img src="'+escapeHtml(img)+'" loading="lazy" onerror="this.src=\'https://via.placeholder.com/400\'"/></div><div class="bd"><div class="tt">'+escapeHtml(p.name)+'</div><div class="tg">Livraison: '+escapeHtml(deliv)+'</div><div><span class="px">'+formatPrice(price)+'</span> <span class="cu">F</span>'+struck+'</div></div></div>'}

async function renderHome(){renderCatTabs(null);const cached=loadProductCache();if(cached.length&&!products.length)products=cached;function paint(){const g=$('homeProducts');if(!g)return;if(!products.length){g.innerHTML='<div class="em" style="grid-column:1/-1"><p>Aucun produit</p></div>';return}g.innerHTML=products.map(productCard).join('');g.querySelectorAll('[data-pid]').forEach(function(el){el.addEventListener('click',function(){showPage('product',el.getAttribute('data-pid'))})})}$('page-home').innerHTML='<div class="pg" id="homeProducts"></div>';paint();await loadProducts();paint()}

async function renderBoutiquePage(id){try{const s=await getDoc(doc(db,'boutiques',id));if(!s.exists()){$('page-boutique').innerHTML='<div class="em"><p>Boutique introuvable</p></div>';return}const b={id:s.id,...s.data()};const prods=products.filter(function(p){return p.boutiqueId===id});const showFollowers=(b.followersCount||0)>=100;$('page-boutique').innerHTML=(b.banner?'<img src="'+escapeHtml(b.banner)+'" style="width:100%;max-height:140px;object-fit:cover"/>':'<div style="height:80px;background:#00A854"></div>')+'<div style="background:#fff;padding:12px;margin-bottom:6px"><div style="display:flex;gap:10px;align-items:center">'+(b.logo?'<img src="'+escapeHtml(b.logo)+'" style="width:56px;height:56px;border-radius:50%;object-fit:cover"/>':'')+'<div style="flex:1"><div style="font-weight:700;font-size:16px">'+escapeHtml(b.name||'Boutique')+'</div>'+(showFollowers?'<div style="font-size:12px;color:#888">'+(b.followersCount||0)+' abonnés</div>':'')+'</div></div><p style="font-size:13px;color:#555;margin:8px 0">'+escapeHtml(b.description||'')+'</p><div style="display:flex;gap:8px"><button type="button" class="ba" style="flex:1" id="btnFollow">Suivre</button><button type="button" class="br" style="flex:1;height:40px;border-radius:20px;margin:0" id="btnMsgBout">Message</button></div><div style="margin-top:12px;font-size:12px">Note: '+(b.ratingAvg?b.ratingAvg.toFixed(1):'—')+'/5 ('+(b.ratingCount||0)+')</div><div style="margin-top:8px"><input id="revStars" type="number" min="1" max="5" value="5" style="width:60px;padding:6px;border:1px solid #ddd;border-radius:6px"/> <input id="revText" placeholder="Commentaire…" style="padding:6px;border:1px solid #ddd;border-radius:6px;width:55%"/> <button type="button" id="btnRev" style="padding:6px 10px;background:#00A854;color:#fff;border-radius:6px">Noter</button></div></div><div class="pti">Produits</div><div class="pg">'+(prods.length?prods.map(productCard).join(''):'<div class="em" style="grid-column:1/-1"><p>Aucun produit</p></div>')+'</div>';document.getElementById('btnFollow').addEventListener('click',async function(){if(!currentUser){toast('Connectez-vous pour suivre');showPage('auth');return}try{await addDoc(collection(db,'follows'),{userId:currentUser.uid,boutiqueId:id,createdAt:serverTimestamp()});await updateDoc(doc(db,'boutiques',id),{followersCount:(b.followersCount||0)+1});toast('Abonné !')}catch(e){toast(e.message)}});document.getElementById('btnMsgBout').addEventListener('click',async function(){if(!currentUser){toast('Connectez-vous');showPage('auth');return}try{const qy=await getDocs(query(collection(db,'conversations'),where('boutiqueId','==',id),where('userId','==',currentUser.uid)));let cid;if(!qy.empty)cid=qy.docs[0].id;else{const ref=await addDoc(collection(db,'conversations'),{boutiqueId:id,userId:currentUser.uid,customerEmail:currentUser.email,customerName:currentUser.email,boutiqueName:b.name||'',lastMessage:'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});cid=ref.id}showPage('chat-thread',cid)}catch(e){toast(e.message)}});document.getElementById('btnRev').addEventListener('click',async function(){if(!currentUser){toast('Connectez-vous');return}const stars=parseInt(document.getElementById('revStars').value)||5;const comment=document.getElementById('revText').value.trim();try{await addDoc(collection(db,'boutiqueReviews'),{boutiqueId:id,userId:currentUser.uid,stars,comment,createdAt:serverTimestamp()});const newCount=(b.ratingCount||0)+1;const newAvg=(((b.ratingAvg||0)*(b.ratingCount||0))+stars)/newCount;await updateDoc(doc(db,'boutiques',id),{ratingCount:newCount,ratingAvg:newAvg});toast('Merci pour votre avis')}catch(e){toast(e.message)}});$('page-boutique').querySelectorAll('[data-pid]').forEach(function(el){el.addEventListener('click',function(){showPage('product',el.getAttribute('data-pid'))})})}catch(e){$('page-boutique').innerHTML='<div class="em"><p>'+escapeHtml(e.message)+'</p></div>'}}
async function renderMessagesList(){if(!currentUser){$('page-messages').innerHTML='<div class="em"><p>Connectez-vous</p><button type="button" class="br" style="max-width:180px;margin:12px auto" id="goA">Connexion</button></div>';document.getElementById('goA').addEventListener('click',function(){showPage('auth')});return}$('page-messages').innerHTML='<div class="pti">Messages</div><div id="msgList"><p class="em">Chargement…</p></div>';try{const s=await getDocs(query(collection(db,'conversations'),where('userId','==',currentUser.uid)));const list=s.docs.map(function(d){return{id:d.id,...d.data()}});document.getElementById('msgList').innerHTML=list.map(function(c){return'<div class="ci" data-cid="'+c.id+'" style="cursor:pointer"><div style="flex:1"><b>'+escapeHtml(c.boutiqueName||'Boutique')+'</b><br/><span style="font-size:12px;color:#888">'+escapeHtml((c.lastMessage||'').slice(0,50))+'</span></div></div>'}).join('')||'<div class="em"><p>Aucun message</p></div>';document.querySelectorAll('[data-cid]').forEach(function(el){el.addEventListener('click',function(){showPage('chat-thread',el.getAttribute('data-cid'))})})}catch(e){document.getElementById('msgList').innerHTML='<div class="em"><p>'+escapeHtml(e.message)+'</p></div>'}}
async function renderChatThread(cid){$('page-chat-thread').innerHTML='<div class="pti" style="display:flex;align-items:center;gap:8px"><button type="button" id="ctBack">←</button><span style="flex:1" id="ctTitle">Chat</span><button type="button" id="ctShop"><i class="fa-solid fa-store"></i></button><button type="button" id="ctSettings"><i class="fa-solid fa-ellipsis"></i></button></div><div id="ctBox" style="padding:12px;min-height:50vh;padding-bottom:80px"></div><div style="position:fixed;left:0;right:0;bottom:0;background:#fff;padding:8px 12px;border-top:1px solid #eee;display:flex;gap:8px"><input id="ctIn" placeholder="Message…" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:20px"/><button type="button" class="br" style="width:auto;padding:0 16px;height:40px;border-radius:20px;margin:0" id="ctSend">Envoyer</button></div>';document.getElementById('ctBack').addEventListener('click',function(){showPage('messages')});try{const cdoc=await getDoc(doc(db,'conversations',cid));const conv=cdoc.exists()?cdoc.data():{};document.getElementById('ctTitle').textContent=conv.boutiqueName||'Chat';document.getElementById('ctShop').addEventListener('click',function(){if(conv.boutiqueId)showPage('boutique',conv.boutiqueId)});document.getElementById('ctSettings').addEventListener('click',function(){alert('Notifications:\n- Nouveaux articles\n- Messages\n- Pubs email')});const box=document.getElementById('ctBox');onSnapshot(query(collection(db,'conversations',cid,'messages'),orderBy('createdAt','asc')),function(snap){box.innerHTML=snap.docs.map(function(d){const m=d.data();const me=m.from==='user';return'<div style="margin:6px 0;text-align:'+(me?'right':'left')+'"><span style="display:inline-block;padding:8px 12px;border-radius:12px;background:'+(me?'#00A854':'#eee')+';color:'+(me?'#fff':'#333')+';font-size:13px;max-width:80%">'+escapeHtml(m.text||'')+'</span></div>'}).join('');box.scrollTop=box.scrollHeight});document.getElementById('ctSend').addEventListener('click',async function(){const text=document.getElementById('ctIn').value.trim();if(!text)return;await addDoc(collection(db,'conversations',cid,'messages'),{from:'user',text,createdAt:serverTimestamp()});await updateDoc(doc(db,'conversations',cid),{lastMessage:text,updatedAt:serverTimestamp()});try{if(conv.boutiqueId){const ar=await getDocs(query(collection(db,'autoReplies'),where('boutiqueId','==',conv.boutiqueId)));const low=text.toLowerCase();for(const d of ar.docs){const a=d.data();if(a.keyword&&low.indexOf(a.keyword)>=0){await addDoc(collection(db,'conversations',cid,'messages'),{from:'boutique',text:a.response,auto:true,createdAt:serverTimestamp()});await updateDoc(doc(db,'conversations',cid),{lastMessage:a.response,updatedAt:serverTimestamp()})}}}}catch(e){}document.getElementById('ctIn').value=''})}catch(e){toast(e.message)}}
$('searchInput').addEventListener('input',function(e){clearTimeout(window._st);window._st=setTimeout(function(){searchTerm=e.target.value.trim();if(searchTerm){currentCategory=null;showPage('catalog')}},300)});
onAuthStateChanged(auth,function(u){currentUser=u});
if(location.hash.indexOf('#product=')===0){const pid=location.hash.replace('#product=','');if(pid)setTimeout(function(){showPage('product',pid)},500)}
async function init(){updateCartBadge();const cached=loadProductCache();if(cached.length)products=cached;await loadCategories();await loadProducts();renderHome()}
init();
</script>
