<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00A854"/>
<title>IDA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--red:#00A854;--danger:#E02E24;--bg:#F4F4F4;--border:#EBEBEB;--nav-h:52px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,sans-serif;background:var(--bg);color:#1a1a1a;overflow-x:hidden}
body{padding-bottom:calc(var(--nav-h)+var(--safe-b))}
body.hide-chrome{padding-bottom:0}
body.hide-chrome .header,body.hide-chrome .bn{display:none!important}
  /* Masque logo + recherche + panier uniquement sur la page Compte */
body.page-account-active .logo,
body.page-account-active .sp,
body.page-account-active #cartBtn {
  display: none !important;
}
img{max-width:100%;display:block}
button,input,textarea{font-family:inherit;font-size:16px;border:none;background:none}
  body.hide-chrome #page-chat.on ~ .bn,body.hide-chrome #page-messages.on ~ .bn{display:flex!important}
button{cursor:pointer} 
.header{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 1px 0 var(--border)}
.hi{padding:8px 10px 0}.sr{display:flex;align-items:center;gap:8px}
.logo{cursor:pointer;display:flex;align-items:center}
.logo-img{height:32px;width:auto;max-width:110px;object-fit:contain;display:block}
.sp{flex:1;display:flex;align-items:center;gap:8px;background:#F0F0F0;border-radius:999px;padding:0 12px;height:36px}
.sp input{flex:1;outline:none;background:transparent;font-size:13px;min-width:0}
.hi2{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.hi2 .bdg{position:absolute;top:2px;right:0;background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.ct{display:flex;overflow-x:auto;padding:0 4px;scrollbar-width:none;border-bottom:1px solid var(--border)}
.ctb{flex-shrink:0;padding:10px 14px 8px;font-size:13px;color:#666;position:relative;white-space:nowrap}
.ctb.on{color:#1a1a1a;font-weight:700}
.page{display:none;min-height:50vh}.page.on{display:block}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px}
.pc{background:#fff;border-radius:6px;overflow:hidden}
.pc .im{aspect-ratio:1;background:#f0f0f0}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:6px 8px 8px}
.pc .tt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .px{font-size:17px;font-weight:800;color:var(--danger)}
.free-deliv{display:inline-block;background:#E02E24;color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:3px;transform:skewX(-12deg);margin-right:4px;letter-spacing:.3px;text-transform:uppercase;line-height:1.4}
  /* === BADGES LIVRAISON PANIER PRODUIT (Lot 1) === */
.vs-deliv-row{
  display:flex;
  flex-wrap:wrap;           /* passe à la ligne si pas de place */
  align-items:center;
  justify-content:flex-end; /* aligné à droite */
  gap:6px;
  margin-top:6px;
}
.vs-deliv-text{
  font-size:12px;
  color:#555;
  margin-right:auto; /* pousse les badges à droite */
}
.vs-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  color:#444;
  background:#F5F5F5;
  border:1px solid #E0E0E0;
  white-space:nowrap;
  line-height:1.3;
}
.vs-badge i{font-size:10px;color:#666}
  /* === FORMULAIRE ADRESSE (Lot 2A) === */
.addr-box{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:350;display:flex;align-items:center;justify-content:center;padding:16px}
.addr-card{background:#fff;border-radius:12px;width:100%;max-width:380px;max-height:90vh;overflow:auto;padding:16px}
.addr-title{font-size:15px;font-weight:700;display:block;margin-bottom:4px}
.addr-sub{font-size:12px;color:#666;margin-bottom:12px}
.addr-saved-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.addr-saved-item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fafafa}
.addr-saved-item:hover{background:#f0fff7;border-color:#A7F3D0}
.addr-saved-item .asi-body{flex:1;min-width:0}
.addr-saved-item .asi-line1{font-size:12px;font-weight:700;color:#333}
.addr-saved-item .asi-line2{font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr-saved-item .asi-x{color:#E02E24;font-size:14px;padding:4px 8px;background:none}
.addr-sep{height:1px;background:#eee;margin:12px 0}
.addr-field{margin-bottom:10px}
.addr-field label{display:block;font-size:12px;font-weight:600;color:#333;margin-bottom:4px}
.addr-field select,.addr-field textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
.addr-field textarea{min-height:70px;resize:vertical}
.addr-actions{display:flex;gap:8px;margin-top:12px}
.addr-actions button{flex:1;height:42px;border-radius:21px;font-weight:700}
.addr-cancel{background:#eee;color:#333}
.addr-save{background:#00A854;color:#fff}
  /* === CHECKOUT + COMMANDES (Lot 2B) === */
.chk-page{padding:12px;max-width:760px;margin:0 auto}
.chk-section{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #eee}
.chk-section-title{font-size:13px;font-weight:800;color:#1a1a1a;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.chk-section-title i{color:#00A854;font-size:14px}
.chk-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed #f0f0f0}
.chk-row:last-child{border-bottom:none}
.chk-row .lbl{color:#777}
.chk-row .val{font-weight:600;color:#1a1a1a;text-align:right;max-width:60%;overflow-wrap:anywhere}
.chk-field{margin-bottom:10px}
.chk-field label{display:block;font-size:12px;font-weight:600;color:#333;margin-bottom:4px}
.chk-field input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.chk-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;background:#E8FFF0;color:#0a7a3e;border:1px solid #A7F3D0}
.chk-badge.warn{background:#FFF7E6;color:#92400E;border-color:#FCD34D}
.chk-badge.info{background:#F5F5F5;color:#444;border-color:#E0E0E0}
.chk-total{display:flex;justify-content:space-between;font-size:15px;font-weight:800;padding-top:8px;margin-top:6px;border-top:2px solid #f0f0f0}
.chk-total .val{color:#E02E24}
.chk-btn{width:100%;height:48px;border-radius:24px;background:#00A854;color:#fff;font-weight:800;font-size:15px;margin-top:12px}
.chk-btn:disabled{opacity:.5}
.chk-empty{text-align:center;padding:40px 20px;color:#888}

/* === Commandes passées === */
.ord-head{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #eee}
.ord-head button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#333}
.ord-head b{font-size:16px}
  

/* === Filtres horizontaux compacts === */
.ord-status-filters{
  display:flex;
  align-items:center;
  gap:4px;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  padding:6px 10px;
  background:#fff;
  border-bottom:1px solid #eee;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.ord-status-filters::-webkit-scrollbar{
  display:none;
}
.ord-filter-btn{
  flex-shrink:0;
  padding:6px 10px;
  border-radius:4px;
  background:#f1f1f1;
  color:#555;
  border:none;
  outline:none;
  font-size:11px;
  font-weight:400;
  cursor:pointer;
}
.ord-filter-btn.active{
  background:#00A854;
  color:#fff;
  border:none;
}
.ord-filter-empty{
  text-align:center;
  padding:25px 12px;
  color:#888;
  font-size:12px;
}


.ord-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:8px;margin:6px;cursor:pointer}
.ord-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.ord-num{font-size:13px;font-weight:800;color:#1a1a1a}
.ord-date{font-size:11px;color:#999}
.ord-status{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:#FFF7E6;color:#92400E}
.ord-status.paid{background:#E8FFF0;color:#0a7a3e}
.ord-status.shipped{background:#E0F2FE;color:#075985}
.ord-status.cancelled{background:#FEE2E2;color:#991B1B}
.ord-prods{font-size:12px;color:#666;margin:6px 0}
.ord-total{font-size:14px;font-weight:800;color:#E02E24;text-align:right}
.ord-detail{padding:12px}
.ord-detail-section{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:10px}
.ord-detail-title{font-size:13px;font-weight:800;margin-bottom:8px;color:#1a1a1a}
.ord-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #f0f0f0}
.ord-item:last-child{border-bottom:none}
.ord-item img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#eee}
.ord-item .oi-body{flex:1;min-width:0}
.ord-item .oi-name{font-size:12px;font-weight:700}
.ord-item .oi-var{font-size:11px;color:#888}
.ord-item .oi-price{font-size:12px;font-weight:700;color:#E02E24;margin-top:2px}
  /* === POINTS RELAIS + PICKUP (Lot 2C) === */
.pr-section{margin-top:18px}
.pr-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.pr-section-head h3{font-size:14px;font-weight:800;color:#1a1a1a}
.pr-section-head span{font-size:11px;color:#888}
.pr-list{padding:0 4px}
.pr-card{display:flex;gap:10px;padding:12px;background:#fff;border:1px solid #eee;border-radius:12px;margin-bottom:8px}
.pr-card.selected{border-color:#00A854;background:#F0FFF7}
.pr-card .pr-ico{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:#E8FFF0;color:#00A854;display:flex;align-items:center;justify-content:center;font-size:16px}
.pr-card .pr-body{flex:1;min-width:0}
.pr-card .pr-city{font-size:11px;font-weight:800;color:#00A854;text-transform:uppercase;letter-spacing:.5px}
.pr-card .pr-addr{font-size:13px;font-weight:600;color:#1a1a1a;margin-top:2px}
.pr-card .pr-hours{font-size:11px;color:#888;margin-top:3px}
.pr-card .pr-pick{background:#00A854;color:#fff;padding:0 14px;height:34px;border-radius:17px;font-size:12px;font-weight:700;align-self:center}
.pr-card.selected .pr-pick{background:#E02E24}
.pr-empty{padding:20px;text-align:center;font-size:12px;color:#999;border:1px dashed #ddd;border-radius:12px;margin-bottom:8px}
.chk-pickup-list{margin-top:8px}
.chk-pickup-title{font-size:12px;font-weight:700;color:#333;margin-bottom:6px}
  /* === PAIEMENT (Paiement) === */
.pay-box{margin-top:10px;padding:10px;background:#F0FFF7;border:1px solid #A7F3D0;border-radius:10px}
.pay-box-title{font-size:11px;font-weight:800;color:#0a7a3e;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.pay-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.pay-row .lbl{color:#555}
.pay-row .val{font-weight:800;color:#0a7a3e}
.pay-row .val.red{color:#E02E24}
.pay-mobile{margin-top:6px;padding:8px;background:#fff;border-radius:6px;font-size:12px;text-align:center;font-weight:700;color:#0a7a3e;border:1px dashed #A7F3D0}
.pay-status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800}
.pay-status-badge.pending{background:#FCD34D22;color:#92400E;border:1px solid #FCD34D}
.pay-status-badge.declared{background:#3B82F622;color:#075985;border:1px solid #3B82F6}
.pay-status-badge.paid{background:#E8FFF0;color:#0a7a3e;border:1px solid #A7F3D0}
.pay-btn{width:100%;height:44px;border-radius:22px;font-weight:800;font-size:14px;margin-top:10px;background:#00A854;color:#fff}
.pay-btn.secondary{background:#fff;color:#00A854;border:2px solid #00A854}
  /* === Masquer recherche + panier + nav sur Checkout === */
/* === Masquer seulement la 1ère ligne du header (logo + recherche + panier) + nav du bas sur Checkout === */
body.page-checkout-active .hi,
body.page-checkout-active .bn {
  display: none !important;
}

/* === Idem sur Mes commandes / Détail / Paniers sauvegardés === */
/* === Sur Mes commandes : garder la nav basse, cacher seulement le header === */
body.page-orders-active .hi {
  display: none !important;
}
/* Sur Détail commande et Paniers sauvegardés : cacher header + nav */
body.page-orders-active.page-orders-detail-active .bn,
body.page-orders-active.page-saved-active .bn {
  display: none !important;
}

/* === Cacher aussi les onglets catégories sur checkout (car pas utiles) === */
body.page-checkout-active .ct {
  display: none !important;
}
  /* === Checkout header + sauvegardes === */
.chk-topbar{position:sticky;top:0;z-index:110;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
.chk-topbar button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#333;background:#f5f5f5}
.chk-topbar .chk-logo{font-size:20px;font-weight:800;color:#00A854;flex:1;text-align:center}
.chk-topbar .chk-fav{background:#FFF7E6;color:#E02E24}
.chk-topbar .chk-fav.saved{background:#E02E24;color:#fff}
  .chk-logo img{height:30px;width:auto;max-width:110px;object-fit:contain;display:inline-block;vertical-align:middle}
/* === Boutons checkout fixes en bas === */
.chk-fixed-actions{
  position:fixed;
  left:0;right:0;bottom:0;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  gap:8px;
  z-index:115;
  box-shadow:0 -2px 10px rgba(0,0,0,.05);
}
.chk-fixed-actions button{
  flex:1;height:46px;border-radius:23px;font-weight:800;font-size:14px;
}
.chk-fixed-actions .sv-cancel{background:#fff;color:#E02E24;border:2px solid #E02E24}
.chk-fixed-actions .sv-validate{background:#00A854;color:#fff;border:2px solid #00A854}

/* Compense la hauteur des boutons fixes pour ne rien cacher */
body.page-checkout-active .chk-page{padding-bottom:90px}
  /* === Masquer le header + nav sur le panier === */
body.page-cart-active .hi,
body.page-cart-active .ct,
body.page-cart-active .bn {
  display: none !important;
}

/* === Header personnalisé panier === */
.cart-topbar{
  position:sticky;top:0;z-index:110;background:#fff;border-bottom:1px solid #eee;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;gap:8px;
}
.cart-topbar button{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#333;background:#f5f5f5;
}
.cart-topbar .cart-logo{
  font-size:20px;font-weight:800;color:#00A854;flex:1;text-align:center;
}
.cart-search-bar{
  display:none;padding:8px 12px;background:#fff;border-bottom:1px solid #eee;
}
.cart-search-bar.on{display:flex;gap:8px;align-items:center}
.cart-search-bar input{
  flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:20px;font-size:14px;
}
.cart-search-bar .cs-close{
  width:34px;height:34px;border-radius:50%;background:#eee;font-size:16px;color:#333;
  display:flex;align-items:center;justify-content:center;
}
/* === Liste checkouts sauvegardés === */
.sv-list{padding:0}
.sv-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:12px;margin:10px;display:flex;gap:10px;align-items:flex-start;position:relative}
.sv-card img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:#eee;flex-shrink:0}
.sv-card .sv-body{flex:1;min-width:0}
.sv-card .sv-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-card .sv-meta{font-size:11px;color:#888;margin-top:2px}
.sv-card .sv-total{font-size:13px;font-weight:800;color:#E02E24;margin-top:4px}
.sv-card .sv-del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:#FFF0F1;color:#E02E24;font-size:14px;display:flex;align-items:center;justify-content:center}
.sv-actions{display:flex;gap:8px;margin-top:10px}
.sv-actions button{flex:1;height:38px;border-radius:19px;font-weight:700;font-size:12px}
.sv-actions .sv-cancel{background:#fff;color:#E02E24;border:2px solid #E02E24}
.sv-actions .sv-validate{background:#00A854;color:#fff;border:2px solid #00A854}
.free-deliv span{display:inline-block;transform:skewX(12deg)}
.chat-prod-float{position:fixed;right:12px;bottom:calc(var(--nav-h) + 20px + var(--safe-b));z-index:250;width:150px;background:#fff;border:2px solid #00A854;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.chat-prod-float .cpf-x{position:absolute;top:4px;right:4px;width:22px;height:22px;background:none;color:#E02E24;font-size:18px;font-weight:800;line-height:1;z-index:2}
.chat-prod-float .cpf-img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee;display:block}
.chat-prod-float .cpf-body{padding:6px 8px 8px}
.chat-prod-float .cpf-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-prod-float .cpf-desc{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-prod-float .cpf-price{font-size:12px;font-weight:800;color:#E02E24;margin-top:3px}
.em{text-align:center;padding:48px 20px;color:#888}
.bn{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h)+var(--safe-b));padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#666;height:var(--nav-h)}
.bn button{position:relative}
.bn button i{font-size:20px}
.bn button.on{color:var(--red)}
.tracking-notif-badge{
  position:absolute;
  top:3px;
  left:calc(50% + 7px);
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:10px;
  background:#E02E24;
  color:#fff;
  font-size:10px;
  font-weight:800;
  display:none;
  align-items:center;
  justify-content:center;
  line-height:17px;
  border:2px solid #fff;
}
.to2{position:fixed;left:50%;bottom:calc(var(--nav-h)+20px+var(--safe-b));transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:500;opacity:0;pointer-events:none;transition:opacity .25s}.to2.on{opacity:1}
.br{background:var(--danger);color:#fff;height:44px;border-radius:22px;width:100%;font-weight:700;display:flex;align-items:center;justify-content:center}
.ba{background:#E8FFF0;color:var(--red);border:1px solid #A7F3D0;height:40px;border-radius:20px;flex:1;font-weight:700}
.pd-actions{position:fixed;left:0;right:0;bottom:0;z-index:120;padding:8px 10px calc(8px + var(--safe-b));background:#fff;border-top:1px solid var(--border);display:flex;gap:6px;align-items:center}
.pd-ico{width:42px;height:42px;border-radius:10px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:18px}
.pd-top{position:fixed;top:0;left:0;right:0;z-index:120;display:flex;justify-content:space-between;padding:10px 12px;pointer-events:none}
.pd-top button{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff}

  display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  padding:4px 12px;border-bottom:1px solid #eee;
}
.cart-pro-topbar button{
  width:40px;height:40px;border-radius:50%;background:#f5f5f5;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:#333;
}
.cart-pro-topbar .cp-logo{
  text-align:center;font-size:20px;font-weight:800;color:#00A854;
}
  .cart-pro-topbar .cp-logo img{height:30px;width:auto;max-width:110px;object-fit:contain;display:inline-block;vertical-align:middle}
  .cp-logo img{height:30px;width:auto;max-width:110px;object-fit:contain;display:inline-block;vertical-align:middle}
.cart-pro-list{padding:10px 12px 130px}
.cart-pro-item{
  display:flex;gap:8px;background:transparent;border:none;
  border-radius:0;padding:8px 4px;margin-bottom:0;position:relative;
  border-bottom:1px solid #f0f0f0;
}
.cart-pro-item .cpi-img{
  width:64px;height:64px;flex-shrink:0;border-radius:8px;object-fit:cover;background:#eee;
}
.cart-pro-item .cpi-body{flex:1;min-width:0}
.cart-pro-item .cpi-title{
  font-size:12px;font-weight:700;color:#1a1a1a;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cart-pro-item .cpi-desc{
  font-size:10px;color:#888;margin-top:1px;

}
.cart-pro-item .cpi-variants{font-size:10px;color:#666;margin-top:2px}
.cart-pro-item .cpi-price-row{

}
.cart-pro-item .cpi-price{font-size:14px;font-weight:800;color:#E02E24}
.cart-pro-item .cpi-old{

}
.cart-pro-item .cpi-promo-pct{
  font-size:9px;font-weight:800;color:#fff;background:#E02E24;

}
.cart-pro-item .cpi-bottom{
  display:flex;align-items:center;justify-content:space-between;

}
.cart-pro-item .cpi-line-total{

}
.cart-pro-item .cpi-qty{
  display:flex;align-items:center;gap:4px;
}
.cart-pro-item .cpi-qty button{
  width:24px;height:24px;border-radius:6px;background:#f0f0f0;
  font-weight:800;font-size:14px;color:#333;
}
.cart-pro-item .cpi-qty span{
  min-width:20px;text-align:center;font-weight:700;font-size:13px;
}
.cart-pro-item .cpi-actions{
  position:absolute;top:6px;right:6px;
  display:flex;gap:10px;align-items:center;
}
.cart-pro-item .cpi-edit,
.cart-pro-item .cpi-del{
  background:none;border:none;padding:0;
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;cursor:pointer;
}
.cart-pro-item .cpi-edit{color:#00A854}
.cart-pro-item .cpi-del{color:#E02E24}
.cart-pro-summary{
  background:#fff;padding:14px 16px;
  border-top:1px solid #eee;
  margin:0 0 54px 0;
}
.cart-pro-summary .cps-row{
  display:flex;justify-content:space-between;font-size:13px;padding:5px 0;
}
.cart-pro-summary .cps-row .lbl{color:#777}
.cart-pro-summary .cps-row .val{font-weight:700;color:#1a1a1a}
.cart-pro-summary .cps-row.promo .val{color:#E02E24}
.cart-pro-summary .cps-total{
  display:flex;justify-content:space-between;font-size:16px;font-weight:800;
  padding-top:10px;margin-top:8px;border-top:2px solid #f0f0f0;
}
.cart-pro-summary .cps-total .val{color:#E02E24}

 /* === Panier vide : hero + barre reco === */
.cart-empty-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  grid-column: 1 / -1;
  flex: 1 1 100%;
  min-height: 45vh;
  padding: 24px 20px;
  text-align: center; /* Centre le texte en cas de retour à la ligne */
  background: #fff;
  margin: 0 auto;
  box-sizing: border-box;
}

/* === Panier vide : hero + barre reco === */
.cart-empty-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  grid-column: 1 / -1;
  flex: 1 1 100%;
  min-height: 45vh;
  padding: 24px 20px;
  text-align: center;
  background: #fff;
  margin: 0 auto;
  box-sizing: border-box;
}

.cart-empty-ico {
  /* Suppression du fond et de la forme circulaire */
  background: transparent;
  color: #00A854;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 56px; /* Agrandit un peu l'icône puisqu'il n'y a plus le cercle */
  margin: 0 auto 16px auto; /* Centré explicitement */
}

.cart-empty-msg {
  font-size: 17px;
  font-weight: 800;
  color: #1a1a1a;
  margin: 0 auto 6px auto;
  text-align: center;
  width: 100%;
}

.cart-empty-sub {
  font-size: 13px;
  color: #8a958e;
  margin: 0 auto;
  max-width: 260px;
  line-height: 1.4;

}
/* === Barre "Articles que vous pourriez aimer" === */

}

}

}
.cart-pro-empty{

}

  /* ============================================================
   === CARTE CLIENT PVC — design fidèle (CSS pur, sans Tailwind)
   ============================================================ */
.ida-card-wrap{
  width:100%;
  max-width:720px;
  margin:0 auto 6px;
  position:relative;
}
.ida-pvc-card{
  aspect-ratio:85.6 / 53.98;
  width:100%;
  border-radius:3.8% / 6%;
  box-shadow:
    0 25px 50px -12px rgba(15,76,41,.25),
    0 10px 20px -8px rgba(15,76,41,.14),
    inset 0 0 0 1px rgba(255,255,255,.9),
    inset 0 1px 2px rgba(255,255,255,.95);
  position:relative;
  overflow:hidden;
  background:#fff;
  user-select:none;
  font-family:'Inter',system-ui,sans-serif;
}
.ida-pvc-card .pvc-gloss{
  background:linear-gradient(125deg,
    rgba(255,255,255,.36) 0%,
    rgba(255,255,255,.05) 35%,
    rgba(255,255,255,0) 50%,
    rgba(255,255,255,.08) 100%);
  pointer-events:none;
}
.ida-pvc-card .card-serif{
  font-family:'PT Serif','Times New Roman',Georgia,serif;
}
.ida-pvc-card .curved-badge-text{
  font-family:'PT Serif','Times New Roman',serif;
  font-weight:700;
  letter-spacing:.06em;
  fill:#fff;
}
/* Bande dorée verticale */
.ida-pvc-card .pvc-gold-band{
  position:absolute;top:0;left:6.8%;width:16.5%;height:78%;
  background:linear-gradient(180deg,#C9A24B 0%,#d4af5a 55%,#C9A24B 100%);
}
/* En-tête */
.ida-pvc-card .pvc-head{
  position:absolute;top:11%;left:32.5%;right:24%;
}
.ida-pvc-card .pvc-title{
  color:#0F4C29;font-weight:400;letter-spacing:.04em;text-transform:uppercase;line-height:1;
  font-size:clamp(16px,3.4vw,31px);
}
.ida-pvc-card .pvc-subtitle{
  color:#0F4C29;font-weight:700;text-transform:uppercase;letter-spacing:.015em;line-height:1.35;margin-top:2.2%;
  font-size:clamp(7.5px,1.24vw,11.5px);
}
/* Logo fixe en haut à droite */
.ida-pvc-card .pvc-logo{
  position:absolute;top:5.5%;right:3.5%;width:18.5%;aspect-ratio:1;
  border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.ida-pvc-card .pvc-logo img{
  width:100%;height:100%;object-fit:contain;padding:2px;
}
/* Médaillon circulaire */
.ida-pvc-card .pvc-medallion{
  position:absolute;left:1.6%;top:27.5%;width:27.2%;aspect-ratio:1;border-radius:50%;
}
.ida-pvc-card .pvc-medallion svg{
  width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.06));
}
.ida-pvc-card .pvc-photo-inner{
  position:absolute;inset:12%;border-radius:50%;overflow:hidden;
  background:#f1f5f9;border:1px solid rgba(201,162,75,.4);
  display:flex;align-items:center;justify-content:center;
}
.ida-pvc-card .pvc-photo-inner img{
  width:100%;height:100%;object-fit:cover;
}
.ida-pvc-card .pvc-photo-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#94a3b8;text-align:center;padding:4px;
}
.ida-pvc-card .pvc-photo-empty i{
  font-size:clamp(12px,2.2vw,20px);margin-bottom:2px;color:rgba(148,163,184,.8);
}
.ida-pvc-card .pvc-photo-empty span{
  font-weight:500;text-transform:uppercase;letter-spacing:.05em;line-height:1.1;
  font-size:clamp(6px,.9vw,8.5px);
}
/* Séparateur vertical doré */
.ida-pvc-card .pvc-sep{
  position:absolute;left:33.8%;top:34.5%;width:1.5px;height:35.5%;background:#C9A24B;
}
/* Bloc infos */
.ida-pvc-card .pvc-infos{
  position:absolute;left:36.8%;top:36%;right:21%;
  display:flex;flex-direction:column;justify-content:space-between;height:32.5%;
  color:#0F4C29;
  font-size:clamp(10px,1.85vw,17px);
}
.ida-pvc-card .pvc-info-line{
  line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ida-pvc-card .pvc-info-line .k{font-weight:400;color:#254434}
.ida-pvc-card .pvc-info-line .v{font-weight:700;color:#0F4C29}
/* Vague décorative */
.ida-pvc-card .pvc-wave{
  position:absolute;bottom:0;left:0;width:100%;height:27.5%;pointer-events:none;
}
/* QR fixe en bas à droite */
.ida-pvc-card .pvc-qr{
  position:absolute;bottom:4.5%;right:4%;width:14.2%;aspect-ratio:1;
  border-radius:8px;overflow:hidden;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.ida-pvc-card .pvc-qr img{
  width:100%;height:100%;object-fit:contain;background:#fff;border-radius:8px;
  padding:4px;border:1px solid #C9A24B;
}
/* === Carte floutée (mode confidentialité) === */
.ida-pvc-card.is-blurred .pvc-gloss,
.ida-pvc-card.is-blurred .pvc-gold-band,
.ida-pvc-card.is-blurred .pvc-head,
.ida-pvc-card.is-blurred .pvc-logo,
.ida-pvc-card.is-blurred .pvc-medallion,
.ida-pvc-card.is-blurred .pvc-sep,
.ida-pvc-card.is-blurred .pvc-infos,
.ida-pvc-card.is-blurred .pvc-wave,
.ida-pvc-card.is-blurred .pvc-qr{
  filter:blur(14px);
  transition:filter .25s ease;
}
.ida-pvc-card .pvc-blur-overlay{
  position:absolute;inset:0;z-index:20;
  display:none;align-items:center;justify-content:center;
  background:rgba(15,76,41,.08);
  pointer-events:none;
}
.ida-pvc-card.is-blurred .pvc-blur-overlay{display:flex}
.ida-pvc-card .pvc-blur-logo{
  width:26%;aspect-ratio:1;border-radius:50%;
  background:#fff;border:4px solid #C9A24B;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.ida-pvc-card .pvc-blur-logo img{
  width:100%;height:100%;object-fit:contain;padding:6px;background:#fff;
}
/* Bouton crayon (caché à l'export) */
/* === Icônes crayon + télécharger : juste l'icône, sans fond === */
.ida-card-tools{
  display:flex;align-items:center;gap:16px;flex-shrink:0;
}
.ida-card-tools button{
  width:auto!important;height:auto!important;
  padding:0!important;
  background:transparent!important;
  border:none!important;
  box-shadow:none!important;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  color:#0F4C29;
  transition:transform .15s,color .15s;
}
.ida-card-tools button:active{transform:scale(.9)}
.ida-card-tools .tool-edit{color:#0F4C29}
.ida-card-tools .tool-dl{color:#0F4C29}
.ida-card-tools .tool-dl:hover{color:#C9A24B}
/* Modale d'édition */
.ida-edit-modal{

  /* === Fenêtre Politique de confidentialité (design propre) === */
.pv-modal{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:600;display:flex;align-items:center;justify-content:center;padding:16px;
}
.pv-box{
  background:#fff;width:100%;max-width:440px;border-radius:18px;
  box-shadow:0 25px 60px rgba(0,0,0,.28);overflow:hidden;
  display:flex;flex-direction:column;max-height:88vh;
  animation:pvIn .22s cubic-bezier(.16,1,.3,1) both;
}
@keyframes pvIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

  function getRecommendedProducts(max,excludeIds){
  max=max||8;
  excludeIds=excludeIds||[];
  var list=products.filter(function(p){return excludeIds.indexOf(p.id)<0});
  if(!list.length)return[];

  // Catégories des produits vus récemment
  var viewedCats={};
  viewedProducts.forEach(function(id){
    var p=products.find(function(x){return x.id===id});
    if(p&&p.categoryId)viewedCats[p.categoryId]=true;
  });

  // Catégories issues des recherches
  var searchCats={};
  searchHistory.forEach(function(term){
    products.forEach(function(p){
      var txt=((p.name||'')+' '+(p.description||'')+' '+(p.categoryId||'')).toLowerCase();
      if(txt.indexOf(term)>=0&&p.categoryId)searchCats[p.categoryId]=true;
    });
  });

  var scored=list.map(function(p){
    var s=0;
    if(viewedCats[p.categoryId])s+=10;
    if(searchCats[p.categoryId])s+=6;
    var ts=(p.createdAt&&p.createdAt.seconds)?p.createdAt.seconds*1000:0;
    s+=(ts/1e12);
    return {p:p,s:s};
  });

  scored.sort(function(a,b){return b.s-a.s});

  var result=[];
  var seenCat={};
  scored.forEach(function(x){
    var c=x.p.categoryId||'_';
    if(!seenCat[c]&&result.length<max){result.push(x.p);seenCat[c]=true}
  });
  scored.forEach(function(x){
    if(result.length<max&&result.indexOf(x.p)<0)result.push(x.p);
  });

  return result.slice(0,max);
}

function getPaymentModeLabel(mode){
  return {cod:'Paiement à la livraison',deposit30:'Acompte 30% avant',deposit50:'Acompte 50% avant',full:'Paiement total avant livraison'}[mode]||'Paiement à la livraison';
}
function getPaymentRatio(mode){
  if(mode==='deposit30')return 0.30;
  if(mode==='deposit50')return 0.50;
  if(mode==='full')return 1.0;
  return 0; // cod
}
function computePaymentForItem(it){
  var p = products.find(function(x){return x.id===it.productId});
  if(!p){
    return {mode:'cod', label:'Paiement à la livraison', payNow:0, payLater:it.price*it.qty, mobileMoney:''};
  }

  // === Détermine le mode transport effectif ===
  var mode = p.transportMode || 'avion';
  var transportFee = 0;
  var transportLabel = '';
  if(mode === 'both'){
    var choice = {};
    try{ choice = JSON.parse(localStorage.getItem('vl_transport_choice')||'{}'); }catch(e){}
    var chosen = choice[it.productId] || 'avion';
    if(chosen === 'bateau'){
      transportFee = p.bateauPaid ? (p.bateauFee||0) : 0;
      transportLabel = p.bateauPaid ? 'Bateau payant' : 'Bateau gratuit';
    }else{
      transportFee = p.avionPaid ? (p.avionFee||0) : 0;
      transportLabel = p.avionPaid ? 'Avion payant' : 'Avion gratuit';
    }
  }else if(mode === 'bateau'){
    transportFee = p.bateauPaid ? (p.bateauFee||0) : 0;
    transportLabel = p.bateauPaid ? 'Bateau payant' : 'Bateau gratuit';
  }else{
    transportFee = p.avionPaid ? (p.avionFee||0) : 0;
    transportLabel = p.avionPaid ? 'Avion payant' : 'Avion gratuit';
  }

  var base = it.price * it.qty + transportFee * it.qty;
  var pm = p.paymentMode || 'cod';
  var mobile = p.mobileMoney || '';
  var label = '';

  if(pm === 'deposit30'){ return {mode:'deposit30', label:'Acompte 30% — '+transportLabel, payNow:Math.round(base*0.3), payLater:base-Math.round(base*0.3), mobileMoney:mobile, transportFee:transportFee*it.qty, transportLabel:transportLabel}; }
  if(pm === 'deposit50'){ return {mode:'deposit50', label:'Acompte 50% — '+transportLabel, payNow:Math.round(base*0.5), payLater:base-Math.round(base*0.5), mobileMoney:mobile, transportFee:transportFee*it.qty, transportLabel:transportLabel}; }
  if(pm === 'full'){ return {mode:'full', label:'Paiement total — '+transportLabel, payNow:base, payLater:0, mobileMoney:mobile, transportFee:transportFee*it.qty, transportLabel:transportLabel}; }
  return {mode:'cod', label:'Paiement à la livraison — '+transportLabel, payNow:0, payLater:base, mobileMoney:mobile, transportFee:transportFee*it.qty, transportLabel:transportLabel};
}

  var list=loadSavedCheckouts();
  var sig=JSON.stringify(cart.map(function(i){return{id:i.productId,price:i.price,qty:i.qty,v:i.variants}}));
  return list.some(function(c){return c.sig===sig});
}
function saveCurrentCheckout(){
  if(!cart.length){toast('Panier vide');return}
  var list=loadSavedCheckouts();
  var prof=loadLocalProfile();
  var sig=JSON.stringify(cart.map(function(i){return{id:i.productId,price:i.price,qty:i.qty,v:i.variants}}));
  // Evite doublons
  list=list.filter(function(c){return c.sig!==sig});
  list.unshift({
    id:'sv_'+Date.now(),
    sig:sig,
    items:JSON.parse(JSON.stringify(cart)),
    profile:{name:prof.name||'',phone:prof.phone||'',address:prof.address||''},
    pickup:window._selectedPickup?JSON.parse(JSON.stringify(window._selectedPickup)):null,
    total:cart.reduce(function(s,i){return s+i.price*i.qty},0),
    savedAt:Date.now()
  });
  saveSavedCheckouts(list);
}
function deleteSavedCheckout(id){
  var list=loadSavedCheckouts();
  list=list.filter(function(c){return c.id!==id});
  saveSavedCheckouts(list);
}
function restoreSavedCheckout(id){
  var list=loadSavedCheckouts();
  var c=list.find(function(x){return x.id===id});
  if(!c)return;
  cart=JSON.parse(JSON.stringify(c.items));
  saveCart();
  // Restaure profil
  saveLocalProfile(c.profile||{});
  // Restaure point relais
  window._selectedPickup=c.pickup||null;
  try{
    if(window._selectedPickup)localStorage.setItem('vl_selected_pickup',JSON.stringify(window._selectedPickup));
    else localStorage.removeItem('vl_selected_pickup');
  }catch(e){}
  // Supprime de la liste (il a été restauré)
  deleteSavedCheckout(id);
  showPage('checkout');
  toast('Panier restauré');
}

          return '<div class="pr-card'+(isSel?' selected':'')+'" data-prid="'+p.id+'">'
            +'<div class="pr-ico"><i class="fa-solid fa-location-dot"></i></div>'

          +'</div>';
        }).join('')
      +'</div>'
      +'<div class="pr-modal-foot">'
        +(current?'<button type="button" class="pr-clear" id="prModalClear">Ne plus sélectionner</button>':'')
        +'<button type="button" class="pr-close" id="prModalOk">Fermer</button>'
      +'</div>'
    +'</div>';
  document.body.appendChild(modal);

  function close(){modal.remove()}
  document.getElementById('prModalClose').addEventListener('click',close);
  document.getElementById('prModalOk').addEventListener('click',close);
  modal.addEventListener('click',function(e){if(e.target===modal)close()});

  // Sélection d'un point
  modal.querySelectorAll('[data-pick]').forEach(function(b){
    b.addEventListener('click',function(){
      var pid=b.getAttribute('data-pick');
      var pt=pts.find(function(x){return x.id===pid});
      if(!pt)return;
      window._selectedPickup=window._selectedPickup||{};
      window._selectedPickup[bid]={id:pt.id,address:(pt.city||'')+', '+(pt.address||'')};
      try{localStorage.setItem('vl_selected_pickup',JSON.stringify(window._selectedPickup));}catch(e){}
      close();
      toast('Point relais sélectionné');
      renderCheckout();
    });
  });

  // Désélectionner
  var clr=document.getElementById('prModalClear');
  if(clr)clr.addEventListener('click',function(){
    if(window._selectedPickup)delete window._selectedPickup[bid];
    try{
      if(window._selectedPickup&&Object.keys(window._selectedPickup).length){
        localStorage.setItem('vl_selected_pickup',JSON.stringify(window._selectedPickup));
      }else{
        localStorage.removeItem('vl_selected_pickup');
      }
    }catch(e){}
    close();
    toast('Point relais retiré');
    renderCheckout();
  });
}

async function placeOrder(){
  var prof = loadLocalProfile();

  var name = String(prof.name || '').trim();
  var phone = String(prof.phone || '').trim();
  var email = String((currentUser && currentUser.email) || prof.email || '').trim();
  var address = String(prof.address || '').trim();

  if(!name){toast('Renseignez votre nom dans votre profil');return}
  if(!phone){toast('Renseignez votre téléphone dans votre profil');return}
  if(!email){toast('Email du compte introuvable');return}
  if(!address){toast('Adresse de livraison requise');return}
  if(!cart.length){toast('Panier vide');return}
  if(!currentUser){toast('Connectez-vous avant de commander');return}

  var btn = $('btnPlace');

  if(btn){
    btn.disabled = true;
    btn.textContent = 'Envoi en cours…';
  }

  try{
    saveLocalProfile({name:name,phone:phone});

    var transportChoices = {};

    try{
      transportChoices = JSON.parse(
        localStorage.getItem('vl_transport_choice') || '{}'
      );
    }catch(e){}

    var submittedItems = cart.map(function(it){
      return {
        productId: it.productId,
        qty: Number(it.qty || 1),
        variants: it.variants || {},
        image: it.image || '',
        deliveryAddress: it.deliveryAddress || '',
        transportChoice: transportChoices[it.productId] || 'avion'
      };
    });

    var pickupPoints = window._selectedPickup || {};

    var idToken = await currentUser.getIdToken(true);

    var response = await fetch(
      'https://soft-surf-b4e9.ahmedsaidaidara5.workers.dev/orders/create',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + idToken
        },
        body: JSON.stringify({
          customer: {
            name: name,
            phone: phone,
            address: address
          },
          country: prof.country || 'Sénégal',
          items: submittedItems,
          pickupPoints: pickupPoints
        })
      }
    );

    var result = await response.json();

    if(!response.ok || !result.ok){
      throw new Error(result.error || 'Impossible de créer la commande');
    }

    if(!Array.isArray(result.orders) || !result.orders.length){
      throw new Error('Aucune commande retournée par le serveur');
    }

    try{
      var cachedList = loadOrdersCache();

      result.orders.forEach(function(order){
        cachedList.unshift(order);
      });

      saveOrdersCache(cachedList);
    }catch(e){}

    cart = [];
    saveCart();

    window._selectedPickup = null;

    try{
      localStorage.removeItem('vl_selected_pickup');
    }catch(e){}

    toast('Commande confirmée !');
    showPage('orders');

  }catch(e){
    console.error('Erreur commande:', e);
    toast(e.message || 'Erreur pendant la commande');

    if(btn){
      btn.disabled = false;
      btn.textContent = 'Confirmer la commande';
    }
  }
}

var _ordersBoutiqueInfoCache = {};

async function refreshOrdersBoutiqueInfo(orders){
  var ids=[];

  orders.forEach(function(o){
    var id=o.boutiqueId;
    if(id && ids.indexOf(id)<0)ids.push(id);
  });

  if(!ids.length)return;

  var changed=false;

  await Promise.all(ids.map(async function(id){
    try{
      if(!_ordersBoutiqueInfoCache[id]){
        _ordersBoutiqueInfoCache[id]=getDoc(doc(db,'boutiques',id))
          .then(function(s){
            return s.exists()?s.data():null;
          })
          .catch(function(){
            return null;
          });
      }

      var b=await _ordersBoutiqueInfoCache[id];
      if(!b)return;

      orders.forEach(function(o){
        if(o.boutiqueId===id){
          o.boutiqueName=b.name||'Boutique';
          o.boutiqueLogo=b.logo||'';
          changed=true;
        }
      });
    }catch(e){}
  }));

  if(changed){
    saveOrdersCache(orders);
    paintOrdersList(orders);
  }
}

    /* Tronque un texte à 27 caractères max, avec … si dépassement */
function trunc27(s){
  s = String(s == null ? '' : s);
  if (s.length <= 27) return s;
  return s.slice(0, 27) + '…';
}

function loadLocalProfile(){
  try{return JSON.parse(localStorage.getItem('vl_profile')||'{}')}catch(e){return{}}
}
function saveLocalProfile(data){
  try{
    var p=loadLocalProfile();
    if(data.name)p.name=data.name;
    if(data.phone)p.phone=data.phone;
    if(data.address)p.address=data.address;
    if(data.country)p.country=data.country;
    if(data.region)p.region=data.region;
    if(data.citation)p.citation=data.citation;
    if(data.photo!==undefined)p.photo=data.photo;
    localStorage.setItem('vl_profile',JSON.stringify(p));
  }catch(e){}
}

function loadAddresses(){try{return JSON.parse(localStorage.getItem('vl_addresses')||'[]')}catch(e){return[]}}
function saveAddresses(list){try{localStorage.setItem('vl_addresses',JSON.stringify(list.slice(0,20)))}catch(e){}}
function addAddressToList(addr){
  if(!addr||!addr.fullAddress)return;
  var list=loadAddresses();
  // évite doublons (même pays + région + adresse)
  list=list.filter(function(a){return !(a.country===addr.country&&a.region===addr.region&&a.fullAddress===addr.fullAddress)});
  list.unshift(addr);
  saveAddresses(list);
}
function removeAddressFromList(idx){
  var list=loadAddresses();
  if(idx>=0&&idx<list.length){list.splice(idx,1);saveAddresses(list)}
}

var trackingNotifications = [];
var trackingNotifUnsubscribe = null;


/* === COMPTEUR DES NOTIFICATIONS NON LUES === */

function updateTrackingNotifBadge(){

  var badge = document.getElementById('trackingNotifBadge');
  if(!badge)return;

  var unread = trackingNotifications.filter(function(n){
    return n.read !== true;
  }).length;

  if(unread > 0){
    badge.style.display = 'flex';
    badge.textContent = unread > 99 ? '99+' : String(unread);
  }else{
    badge.style.display = 'none';
    badge.textContent = '0';
  }
}


/* === ÉCOUTE FIRESTORE === */

function startTrackingNotifications(){

  if(trackingNotifUnsubscribe){
    trackingNotifUnsubscribe();
    trackingNotifUnsubscribe = null;
  }

  if(!currentUser || !currentUser.uid){
    trackingNotifications = [];
    updateTrackingNotifBadge();
    return;
  }

  var notifQuery = query(
    collection(db,'notifications'),
    where('userId','==',currentUser.uid)
  );

  trackingNotifUnsubscribe = onSnapshot(
    notifQuery,
    function(snapshot){

      trackingNotifications = snapshot.docs.map(function(d){

        var data = d.data();

        return Object.assign(
          {id:d.id},
          data,
          {
            createdAtMs:
              data.createdAt && data.createdAt.toMillis
                ? data.createdAt.toMillis()
                : 0
          }
        );

      });

      trackingNotifications.sort(function(a,b){
        return (b.createdAtMs || 0) - (a.createdAtMs || 0);
      });

      updateTrackingNotifBadge();

      var active = document.querySelector('.page.on');

      if(active && (
        active.id === 'page-chat' ||
        active.id === 'page-messages'
      )){
        renderTrackingNotifications();
      }

      if(active && active.id === 'page-notifications'){
        renderTrackingNotificationHistory();
      }

    },
    function(error){
      console.error('Erreur notifications :',error);
    }
  );
}


/* === ARRÊTER L'ÉCOUTE === */

function stopTrackingNotifications(){

  if(trackingNotifUnsubscribe){
    trackingNotifUnsubscribe();
    trackingNotifUnsubscribe = null;
  }

  trackingNotifications = [];
  updateTrackingNotifBadge();
}


/* === CARTE D'UNE NOTIFICATION === */

function trackingNotifCardHtml(n){

  var dateText = '';

  var notificationDate = n.createdAtMs
    ? new Date(n.createdAtMs)
    : (n.createdAt && n.createdAt.toDate
        ? n.createdAt.toDate()
        : null);

  if(notificationDate && !isNaN(notificationDate.getTime())){
    dateText = notificationDate.toLocaleString('fr-FR',{
      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    });
  }

  var orderNumber = n.orderNumber || n.orderId || 'Commande';
  var boutiqueName = n.boutiqueName || 'Boutique';
  var status = n.status || '';

  var html = '';

  html += '<div data-tracking-notif="'+escapeHtml(n.id)+'"';
  html += ' style="display:flex;width:100%;box-sizing:border-box;';
  html += 'align-items:flex-start;gap:11px;padding:13px 14px;';
  html += 'border-bottom:1px solid #eee;cursor:pointer">';

  html += '<div style="width:42px;height:42px;flex:0 0 42px;';
  html += 'border-radius:50%;overflow:hidden">';

  html += '<img src="'+escapeHtml(getSiteLogo())+'" alt="IDA" ';
  html += 'style="width:100%;height:100%;object-fit:cover">';

  html += '</div>';

  html += '<div style="flex:1;min-width:0">';

  html += '<div style="display:flex;align-items:center;';
  html += 'justify-content:space-between;gap:7px;margin-bottom:6px">';

  html += '<b style="font-size:12px;color:#222;min-width:0;';
  html += 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap">';

  html += escapeHtml(orderNumber)+'</b>';

  html += '<span data-boutique-link="'+escapeHtml(n.boutiqueId || '')+'"';
  html += ' style="flex-shrink:0;padding:3px 7px;';
  html += 'border:1px solid #C49A35;border-radius:5px;';
  html += 'color:#C49A35;font-size:10px;font-weight:700;';
  html += 'white-space:nowrap;cursor:pointer">';

  html += escapeHtml(boutiqueName)+'</span></div>';

  if(status){

    html += '<div style="font-size:11px;color:#555;margin-bottom:3px">';
    html += 'Votre commande est maintenant :</div>';

    html += '<div style="font-size:12px;font-weight:800;';
    html += 'color:#00A854">'+escapeHtml(status)+'</div>';

  }else{

    html += '<div style="font-size:12px;color:#00A854">';
    html += escapeHtml(n.message || '')+'</div>';

  }

  // Date + petite poubelle rouge sur la même ligne

  html += '<div style="display:flex;align-items:center;';
  html += 'justify-content:space-between;gap:8px;margin-top:7px">';

  html += '<span style="font-size:10px;color:#999">';
  html += escapeHtml(dateText)+'</span>';

  html += '<button type="button" data-delete-notif="'+escapeHtml(n.id)+'"';
  html += ' title="Supprimer cette notification"';
  html += ' style="border:0;background:transparent;color:#E02E24;';
  html += 'padding:2px 4px;font-size:12px;line-height:1;cursor:pointer">';
  html += '<i class="fa-solid fa-trash"></i></button>';

  html += '</div>';

  html += '</div>';

  if(n.read !== true){
    html += '<span style="width:7px;height:7px;flex:0 0 7px;';
    html += 'border-radius:50%;background:#00A854;margin-top:5px"></span>';
  }

  html += '</div>';

  return html;
}


/* === AFFICHAGE ET GESTION DES NOTIFICATIONS === */

function renderTrackingNotificationList(box,historyMode){

  if(!box)return;

  var list = trackingNotifications.slice();

  if(!historyMode){
    list = list.filter(function(n){
      return n.read !== true;
    });
  }

  list.sort(function(a,b){
    return (b.createdAtMs || 0) - (a.createdAtMs || 0);
  });

  if(!list.length){

    box.innerHTML = historyMode
      ? '<div class="notif-history-empty"><i class="fa-solid fa-box-open"></i><p>Aucune notification de commande</p></div>'
      : '';

    return;
  }

  box.innerHTML = list.map(function(n){
    return trackingNotifCardHtml(n);
  }).join('');


  // Ouverture d'une notification

  box.querySelectorAll('[data-tracking-notif]').forEach(function(card){

    card.addEventListener('click',async function(e){

      if(e.target.closest('[data-delete-notif]'))return;
      if(e.target.closest('[data-boutique-link]'))return;

      var notifId = card.getAttribute('data-tracking-notif');

      var notif = trackingNotifications.find(function(n){
        return n.id === notifId;
      });

      if(!notif)return;

      try{

        // Marquer comme lue dans Firestore.
        // NE PAS SUPPRIMER LE DOCUMENT.

        if(notif.read !== true){

          await updateDoc(doc(db,'notifications',notifId),{
            read:true,
            readAt:serverTimestamp()
          });

          notif.read = true;
          updateTrackingNotifBadge();
        }

        if(!notif.orderId){
          toast('Commande introuvable dans cette notification');
          return;
        }

        showPage('order-detail',notif.orderId);

      }catch(e){
        toast('Erreur : '+e.message);
      }

    });

  });


  // Suppression individuelle avec confirmation

  box.querySelectorAll('[data-delete-notif]').forEach(function(btn){

    btn.addEventListener('click',function(e){

      e.stopPropagation();

      var notifId = btn.getAttribute('data-delete-notif');

      confirmAction(
        'Supprimer cette notification ?',
        'Cette notification sera définitivement supprimée.',
        async function(){

          try{

            await deleteDoc(doc(db,'notifications',notifId));

            toast('Notification supprimée');

          }catch(e){

            toast('Erreur : '+e.message);

          }

        }
      );

    });

  });


  // Clic sur le nom de la boutique

  box.querySelectorAll('[data-boutique-link]').forEach(function(link){

    link.addEventListener('click',function(e){

      e.stopPropagation();

      var boutiqueId = link.getAttribute('data-boutique-link');

      if(!boutiqueId){
        toast('Page de cette boutique introuvable');
        return;
      }

      showPage('boutique',boutiqueId);

    });

  });

}

  },{passive:true});
  el.addEventListener('touchmove',function(e){
    if(!drag)return;
    el.style.left=(e.touches[0].clientX-ox)+'px';
    el.style.top=(e.touches[0].clientY-oy)+'px';
    el.style.right='auto';
    el.style.bottom='auto';
  },{passive:true});
  el.addEventListener('touchend',function(){drag=false});

  var mdrag=false,mox=0,moy=0;
  el.addEventListener('mousedown',function(e){
    if(e.target.id==='cpfX'||e.target.tagName==='BUTTON')return;
    mdrag=true;
    mox=e.clientX-el.offsetLeft;
    moy=e.clientY-el.offsetTop;

  });

    if(!mdrag)return;
    el.style.left=(e.clientX-mox)+'px';
    el.style.top=(e.clientY-moy)+'px';
    el.style.right='auto';
    el.style.bottom='auto';
  });
  document.addEventListener('mouseup',function(){mdrag=false});
}

  currentUser=u;

  if(u){
    startTrackingNotifications();
  }else{
    stopTrackingNotifications();
  }

  // === Sauvegarde locale de la session à la connexion ===
  if(u){
    try{
      localStorage.setItem('vl_user',JSON.stringify({
        uid:u.uid,
        email:u.email||'',
        displayName:u.displayName||'',
        photoURL:u.photoURL||'',
        savedAt:Date.now()
      }));
    }catch(e){}
    try{
      var p=loadLocalProfile();
      if(!p.email)p.email=u.email;
      if(!p.uid)p.uid=u.uid;
      localStorage.setItem('vl_profile',JSON.stringify(p));
    }catch(e){}
  }else{
    // Déconnexion → nettoie la session locale
    try{localStorage.removeItem('vl_user')}catch(e){}
  }
});

/* === Restauration immédiate de l'UI depuis le cache (avant Firebase) === */
(function restoreFromCache(){
  try{
    var cached=JSON.parse(localStorage.getItem('vl_user')||'null');
    if(!cached)return;
    // Hydrate currentUser immédiatement pour que les pages s'affichent instantanément
    if(!currentUser){
      currentUser={uid:cached.uid,email:cached.email,displayName:cached.displayName,photoURL:cached.photoURL};
    }
    // Si l'utilisateur est sur une page qui nécessite une connexion au chargement,
    // on re-render après le DOMContentLoaded
    setTimeout(function(){
      var activePage=document.querySelector('.page.on');
      if(!activePage)return;
      var id=activePage.id.replace('page-','');
      if(id==='account'&&typeof renderAccount==='function')renderAccount();
      if(id==='orders'&&typeof renderOrders==='function')renderOrders();
      if(id==='messages'&&typeof renderMessagesList==='function')renderMessagesList();
      if(id==='chat'&&typeof renderMessagesList==='function')renderMessagesList();
    },50);
  }catch(e){}
})();
async function init(){
  updateCartBadge();
  // Attend 1 frame que Firebase restaure la session
  await new Promise(function(r){setTimeout(r,150)});
  // Si profil local existe, on l'utilise pour l'affichage immédiat 
  var prof=loadLocalProfile();
  if(prof.uid&&!currentUser)console.log('Session en cours de restauration…');
  renderHome();
  loadCategories();
  loadProducts().then(function(){
    var g=$('homeProducts');
    if(g)paintHomeProducts(g,diversifyProducts(products)); 
  }).catch(function(){});
  loadAds();
}

  /* === Force la classe page-checkout-active dès que #page-checkout.on est visible === */
(function(){
  function syncCheckoutClass(){
    var isCheckout = !!document.querySelector('#page-checkout.on');
    document.body.classList.toggle('page-checkout-active', isCheckout);
  }
  // Sync initial
  syncCheckoutClass();
  // Sync à chaque changement de classe sur le body ou les pages
  var mo = new MutationObserver(syncCheckoutClass);
  mo.observe(document.body, { attributes:true, attributeFilter:['class'], subtree:true, childList:true });
  // Sync aussi sur clics nav (au cas où)
  window.addEventListener('popstate', syncCheckoutClass);
})();
