<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#00A854"/>
<title>IDUS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
<style>
:root{--red:#00A854;--danger:#E02E24;--bg:#F4F4F4;--border:#EBEBEB;--nav-h:52px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,sans-serif;background:var(--bg);color:#1a1a1a;overflow-x:hidden}
body{padding-bottom:calc(var(--nav-h)+var(--safe-b))}
body.hide-chrome{padding-bottom:0}
body.hide-chrome .header,body.hide-chrome .bn{display:none!important}
img{max-width:100%;display:block}
button,input,textarea{font-family:inherit;font-size:16px;border:none;background:none}
button{cursor:pointer}
.header{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 1px 0 var(--border)}
.hi{padding:8px 10px 0}.sr{display:flex;align-items:center;gap:8px}
.logo{font-size:20px;font-weight:800;color:var(--red);cursor:pointer}
.sp{flex:1;display:flex;align-items:center;gap:8px;background:#F0F0F0;border-radius:999px;padding:0 12px;height:36px}
.sp input{flex:1;outline:none;background:transparent;font-size:13px;min-width:0}
.hi2{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.hi2 .bdg{position:absolute;top:2px;right:0;background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.ct{display:flex;overflow-x:auto;padding:0 4px;scrollbar-width:none;border-bottom:1px solid var(--border)}
.ctb{flex-shrink:0;padding:10px 14px 8px;font-size:13px;color:#666;position:relative;white-space:nowrap}
.ctb.on{color:#1a1a1a;font-weight:700}
.page{display:none;min-height:50vh}.page.on{display:block}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px}
.pc{background:#fff;border-radius:6px;overflow:hidden}
.pc .im{aspect-ratio:1;background:#f0f0f0}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:6px 8px 8px}
.pc .tt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .px{font-size:17px;font-weight:800;color:var(--danger)}
.em{text-align:center;padding:48px 20px;color:#888}
.bn{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h)+var(--safe-b));padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#666;height:var(--nav-h)}
.bn button i{font-size:20px}.bn button.on{color:var(--red)}
.to2{position:fixed;left:50%;bottom:calc(var(--nav-h)+20px+var(--safe-b));transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:500;opacity:0;pointer-events:none;transition:opacity .25s}.to2.on{opacity:1}
.br{background:var(--danger);color:#fff;height:44px;border-radius:22px;width:100%;font-weight:700;display:flex;align-items:center;justify-content:center}
.ba{background:#E8FFF0;color:var(--red);border:1px solid #A7F3D0;height:40px;border-radius:20px;flex:1;font-weight:700}
.pd-actions{position:fixed;left:0;right:0;bottom:0;z-index:120;padding:8px 10px calc(8px + var(--safe-b));background:#fff;border-top:1px solid var(--border);display:flex;gap:6px;align-items:center}
.pd-ico{width:42px;height:42px;border-radius:10px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:18px}
.pd-top{position:fixed;top:0;left:0;right:0;z-index:120;display:flex;justify-content:space-between;padding:10px 12px;pointer-events:none}
.pd-top button{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex-shrink:0;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:start;background:#f0f0f0}
.bout-hero{position:relative;height:160px;overflow:hidden;background:#222}
.bout-banner-blur{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(18px) brightness(.75);transform:scale(1.15)}
.bout-banner-sharp{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}
.bout-logo-wrap{position:absolute;right:16px;bottom:-28px;z-index:3;width:72px;height:72px;border-radius:50%;border:3px solid #fff;background:#eee;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.bout-logo-wrap img{width:100%;height:100%;object-fit:cover}
.bout-info{background:#fff;padding:36px 14px 14px;margin-bottom:6px}
.bout-info .bout-name{font-size:18px;font-weight:800}
.bout-info .bout-desc{font-size:13px;color:#666;margin:6px 0 12px}
.bout-actions{display:flex;gap:8px}
.btn-follow{flex:1;height:40px;border-radius:20px;font-weight:700;font-size:14px;border:none}
.btn-follow.off{background:#E02E24;color:#fff}
.btn-follow.on{background:#e5e5e5;color:#555}
.btn-msg{flex:1;height:40px;border-radius:20px;font-weight:700;font-size:14px;background:#E8FFF0;color:#00A854;border:1px solid #A7F3D0}
.ad-banner{background:#fff;overflow:hidden;position:relative}
.ad-banner-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ad-banner-track::-webkit-scrollbar{display:none}
.ad-banner-track .ad-slide{flex-shrink:0;width:100%;scroll-snap-align:start}
.ad-banner-track img{width:100%;height:100px;object-fit:cover;display:block}
.ad-banner .ad-x{position:absolute;top:6px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:14px;z-index:2;border:none}
.ad-popup{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:450;display:flex;align-items:center;justify-content:center;padding:20px}
.ad-popup-box{background:#fff;border-radius:12px;max-width:340px;width:100%;overflow:hidden;position:relative}
.ad-popup-box img{width:100%;max-height:360px;object-fit:cover;display:block}
.ad-popup-box .ad-x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:16px;border:none}
.acc-row{display:flex;align-items:center;gap:12px;padding:14px 12px;background:#fff;border-bottom:1px solid #eee;cursor:pointer}
.acc-row i{width:28px;text-align:center;color:#00A854;font-size:18px}
.acc-row span{flex:1;font-weight:600;font-size:14px}
.msg-item{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-bottom:1px solid #eee;cursor:pointer}
.msg-item .av{width:48px;height:48px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:800;color:#00A854}
.msg-item .meta{flex:1;min-width:0}
.msg-item .meta b{display:block;font-size:14px}
.msg-item .meta span{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.vid-page{position:fixed;inset:0;background:#000;z-index:90}
.vid-stage{position:absolute;inset:0}
.vid-stage video{width:100%;height:100%;object-fit:contain}
.vid-card{position:absolute;left:12px;right:12px;bottom:24px;background:rgba(255,255,255,.92);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;z-index:5}
.vid-card .title{font-size:13px;font-weight:700}
.vid-card .price{color:#E02E24;font-weight:800}
.vid-card .cta .buy{background:#E02E24;color:#fff;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700}
.vid-top{position:absolute;top:0;left:0;right:0;z-index:6;padding:12px}
.vid-top button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff}
</style>
</head>
<body>
<div id="app">
<header class="header"><div class="hi"><div class="sr">
<div class="logo" id="logoBtn">IDUS</div>
<div class="sp"><i class="fa-solid fa-magnifying-glass" style="color:#999;font-size:14px"></i>
<input type="search" id="searchInput" placeholder="Rechercher…"/></div>
<button class="hi2" type="button" id="cartBtn"><i class="fa-solid fa-cart-shopping"></i><span class="bdg" id="cartBadge" style="display:none">0</span></button>
</div></div><div class="ct" id="catTabs"></div></header>
<div id="adBanner" class="ad-banner" style="display:none"></div>

<div id="page-catalog" class="page"></div>
<div id="page-product" class="page"></div>
<div id="page-cart" class="page"></div>
<div id="page-checkout" class="page"></div>
<div id="page-account" class="page"></div>
<div id="page-auth" class="page"></div>
<div id="page-chat" class="page"></div>
<div id="page-video" class="page"></div>
<div id="page-favorites" class="page"></div>
<div id="page-following" class="page"></div>

<button type="button" data-page="video"><i class="fa-solid fa-play"></i>Video</button>

<div class="to2" id="toast"></div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyDkKvnL5_pHGraCFMcfXvueywwujCIG8SE",authDomain:"idus-a87a6.firebaseapp.com",projectId:"idus-a87a6",storageBucket:"idus-a87a6.firebasestorage.app",messagingSenderId:"284785552985",appId:"1:284785552985:web:4cb12a71465a0e167bcb48",measurementId:"G-M0EKXCDV3R"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
setPersistence(auth,browserLocalPersistence).catch(function(){});
let favorites=JSON.parse(localStorage.getItem('vl_favs')||'[]');
let currentUser=null,cart=JSON.parse(localStorage.getItem('vl_cart')||'[]'),products=[],categories=[],settings={shippingFee:1500},currentProduct=null,selectedVariants={},qty=1,searchTerm='',sheetMode='cart',sheetCartIdx=null,pageHistory=[];
let videoFeed=[],videoFeedIdx=0,videoHideTimer=null;
function $(id){return document.getElementById(id)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2200)}
function formatPrice(n){return new Intl.NumberFormat('fr-FR').format(n||0)}
function escapeHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function saveCart(){localStorage.setItem('vl_cart',JSON.stringify(cart));updateCartBadge()}
function saveFavs(){localStorage.setItem('vl_favs',JSON.stringify(favorites))}
function isFav(id){return favorites.indexOf(id)>=0}
function toggleFav(id){const i=favorites.indexOf(id);if(i>=0)favorites.splice(i,1);else favorites.push(id);saveFavs();toast(i>=0?'Retiré des favoris':'Ajouté aux favoris')}
function loadProductCache(){try{return JSON.parse(localStorage.getItem('vl_products')||'[]')}catch(e){return[]}}
function saveProductCache(list){try{localStorage.setItem('vl_products',JSON.stringify(list.slice(0,80)))}catch(e){}}
function updateCartBadge(){const c=cart.reduce(function(s,i){return s+(i.qty||1)},0);const b=$('cartBadge');if(!b)return;if(c>0){b.style.display='flex';b.textContent=c>99?'99+':c}else b.style.display='none'}
function minProductPrice(p){return (p.promoPrice&&p.promoPrice<p.price)?p.promoPrice:(p.price||0)}
function calcVariantPrice(p,sel){let base=minProductPrice(p);(p.variantGroups||[]).forEach(function(g){const lab=sel[g.name];(g.options||[]).forEach(function(o){if(o.label===lab)base+=parseFloat(o.priceDelta)||0})});return base}
function variantImage(p,sel){var groups=p.variantGroups||[];for(var i=0;i<groups.length;i++){var lab=sel[groups[i].name];var opts=groups[i].options||[];for(var j=0;j<opts.length;j++){if(opts[j].label===lab&&opts[j].image)return opts[j].image}}return(p.images&&p.images[0])||''}
function setChrome(hide){document.body.classList.toggle('hide-chrome',!!hide)}
let lastPageArgs={};
function showPage(page,data){var prev=document.querySelector('.page.on');if(prev&&prev.id){var name=prev.id.replace('page-','');if(name!==page)pageHistory.push({page:name,data:lastPageArgs[name]!=null?lastPageArgs[name]:null})}if(arguments.length>1)lastPageArgs[page]=data;document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on')});var el=$('page-'+page);if(el)el.classList.add('on');document.querySelectorAll('.bn button').forEach(function(b){b.classList.toggle('on',b.dataset.page===page)});setChrome(page==='product'||page==='boutique'||page==='messages'||page==='chat-thread'||page==='favorites'||page==='video'||page==='following'||page==='chat');if(page!=='product'){var vf=document.getElementById('vidFloat');if(vf)vf.remove()}window.scrollTo(0,0);if(page==='home')renderHome();else if(page==='catalog')renderCatalog();else if(page==='product'&&data)renderProduct(data);else if(page==='cart')renderCart();else if(page==='checkout')renderCheckout();else if(page==='account')renderAccount();else if(page==='auth')renderAuth();else if(page==='video')renderVideos();else if(page==='favorites')renderFavorites();else if(page==='boutique'&&data)renderBoutiquePage(data);else if(page==='messages')renderMessagesList();else if(page==='chat-thread'&&data)renderChatThread(data);else if(page==='chat')renderMessagesList('page-chat');else if(page==='following')renderFollowingList()}
function goBack(){var fs=document.getElementById('fsViewer');if(fs){fs.remove();return}var vs=document.getElementById('variantSheet');if(vs){vs.remove();return}if(pageHistory.length){var last=pageHistory.pop();showPage(last.page,last.data)}else{setChrome(false);showPage('home')}}
document.getElementById('logoBtn').addEventListener('click',function(){setChrome(false);showPage('home')});
document.getElementById('cartBtn').addEventListener('click',function(){setChrome(false);showPage('cart')});
document.querySelectorAll('.bn button').forEach(function(btn){btn.addEventListener('click',function(){setChrome(false);showPage(btn.dataset.page)})});
async function loadCategories(){try{var s=await getDocs(collection(db,'categories'));categories=s.docs.map(function(d){return{id:d.id,...d.data()}})}catch(e){categories=[]}}
async function loadProducts(){try{var s=await getDocs(collection(db,'products'));products=s.docs.map(function(d){return{id:d.id,...d.data()}}).filter(function(p){return p.published!==false});saveProductCache(products)}catch(e){if(!products.length)products=loadProductCache()}return products}
function productCard(p){var promo=p.promoPrice&&p.promoPrice<p.price;var price=minProductPrice(p);var img=(p.images&&p.images[0])||'';var deliv=p.deliveryTime||'2 jours';var showStock=p.showStock!==false;var struck=promo?' <span style="text-decoration:line-through;color:#999;font-size:11px">'+formatPrice(p.price)+' F</span>':'';var stockLine=showStock?'<div style="font-size:10px;color:#888">Stock: '+(p.stock!=null?p.stock:0)+'</div>':'';return'<div class="pc" data-pid="'+p.id+'"><div class="im">'+(img?'<img src="'+escapeHtml(img)+'" loading="lazy" onerror="this.onerror=null;this.style.background=\'#eee\'"/>':'')+'</div><div class="bd"><div class="tt">'+escapeHtml(p.name)+'</div><div style="font-size:11px;color:#00A854;margin-bottom:4px">Livraison: '+escapeHtml(deliv)+'</div>'+stockLine+'<div><span class="px">'+formatPrice(price)+' F</span>'+struck+'</div></div></div>'}
async function renderHome(){var cached=loadProductCache();if(cached.length&&!products.length)products=cached;$('page-home').innerHTML='<div class="pg" id="homeProducts"></div>';function paint(){var g=$('homeProducts');if(!g)return;g.innerHTML=products.length?products.map(productCard).join(''):'<div class="em" style="grid-column:1/-1"><p>Aucun produit</p></div>';g.querySelectorAll('[data-pid]').forEach(function(el){el.addEventListener('click',function(){showPage('product',el.getAttribute('data-pid'))})})}paint();await loadProducts();paint()}
async function renderCatalog(){await loadProducts();var list=products.slice();if(searchTerm){var t=searchTerm.toLowerCase();list=list.filter(function(p){return((p.name||'')+(p.description||'')).toLowerCase().includes(t)})}$('page-catalog').innerHTML='<div class="pg">'+(list.length?list.map(productCard).join(''):'<div class="em" style="grid-column:1/-1"><p>Aucun</p></div>')+'</div>';$('page-catalog').querySelectorAll('[data-pid]').forEach(function(el){el.addEventListener('click',function(){showPage('product',el.getAttribute('data-pid'))})})}
async function isFollowingBoutique(boutiqueId){if(!currentUser)return false;try{var s=await getDocs(query(collection(db,'follows'),where('userId','==',currentUser.uid),where('boutiqueId','==',boutiqueId)));return !s.empty}catch(e){return false}}
async function followBoutique(boutiqueId,boutiqueName){if(!currentUser)throw new Error('Connecte-toi');await addDoc(collection(db,'follows'),{userId:currentUser.uid,boutiqueId:boutiqueId,boutiqueName:boutiqueName||'',createdAt:serverTimestamp()});try{var ref=doc(db,'boutiques',boutiqueId);var snap=await getDoc(ref);var c=(snap.exists()&&snap.data().followersCount)||0;await updateDoc(ref,{followersCount:c+1})}catch(e){}}
async function unfollowBoutique(boutiqueId){if(!currentUser)return;var s=await getDocs(query(collection(db,'follows'),where('userId','==',currentUser.uid),where('boutiqueId','==',boutiqueId)));for(var i=0;i<s.docs.length;i++)await deleteDoc(s.docs[i].ref);try{var ref=doc(db,'boutiques',boutiqueId);var snap=await getDoc(ref);var c=(snap.exists()&&snap.data().followersCount)||0;await updateDoc(ref,{followersCount:Math.max(0,c-1)})}catch(e){}}
async function getOrCreateConversation(boutiqueId,boutiqueName){var qy=await getDocs(query(collection(db,'conversations'),where('boutiqueId','==',boutiqueId),where('userId','==',currentUser.uid)));if(!qy.empty)return qy.docs[0].id;var ref=await addDoc(collection(db,'conversations'),{boutiqueId:boutiqueId,userId:currentUser.uid,customerEmail:currentUser.email||'',customerName:currentUser.email||'',boutiqueName:boutiqueName||'',lastMessage:'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});return ref.id}

async function renderProduct(id){try{var p=products.find(function(x){return x.id===id});if(!p){var s=await getDoc(doc(db,'products',id));if(!s.exists()){$('page-product').innerHTML='<div class="em"><p>Introuvable</p></div>';return}p={id:s.id,...s.data()}}currentProduct=p;selectedVariants={};qty=1;(p.variantGroups||[]).forEach(function(g){if(g.options&&g.options.length)selectedVariants[g.name]=g.options[0].label});var price=minProductPrice(p);var images=(p.images&&p.images.length)?p.images.filter(Boolean):[];var imgHtml=images.length?'<div class="gal">'+images.map(function(im){return'<img src="'+escapeHtml(im)+'" style="width:100%;aspect-ratio:1;object-fit:cover"/>'}).join('')+'</div>':'';$('page-product').innerHTML='<div class="pd-top"><button type="button" id="pdBack"><i class="fa-solid fa-arrow-left"></i></button></div>'+imgHtml+'<div style="background:#fff;padding:12px;margin-bottom:70px"><div style="font-size:26px;font-weight:800;color:#E02E24">'+formatPrice(price)+' F</div><div style="font-weight:600;margin:8px 0">'+escapeHtml(p.name)+'</div><div style="font-size:13px">'+escapeHtml(p.description||'')+'</div></div><div class="pd-actions"><button type="button" class="ba" id="btnAddCart" style="flex:1">Panier</button><button type="button" class="br" style="flex:1.2;margin:0;height:40px;border-radius:20px" id="btnBuy">Acheter</button></div>';document.getElementById('pdBack').addEventListener('click',goBack);document.getElementById('btnAddCart').addEventListener('click',function(){openVariantSheet('cart')});document.getElementById('btnBuy').addEventListener('click',function(){openVariantSheet('buy')})}catch(e){$('page-product').innerHTML='<div class="em"><p>'+escapeHtml(e.message)+'</p></div>'}}
