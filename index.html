async function placeOrder(){var name=$('chkName').value.trim(),phone=$('chkPhone').value.trim(),address=$('chkAddr').value.trim();if(!name||!phone||!address){toast('Remplis les champs');return}if(!cart.length){toast('Panier vide');return}try{var byBout={};cart.forEach(function(it){var bid=it.boutiqueId||null;if(!bid){var pr=products.find(function(x){return x.id===it.productId});if(pr)bid=pr.boutiqueId||null}var key=bid||'_none';if(!byBout[key])byBout[key]=[];byBout[key].push(it)});var keys=Object.keys(byBout);for(var k=0;k<keys.length;k++){var key=keys[k];var items=byBout[key];var subB=items.reduce(function(s,i){return s+i.price*i.qty},0);var bid=key==='_none'?null:key;await addDoc(collection(db,'orders'),{orderNumber:'CMD-'+Date.now().toString(36).toUpperCase(),userId:currentUser?currentUser.uid:null,boutiqueId:bid,customer:{name:name,phone:phone,address:address,email:currentUser?currentUser.email:''},items:items,subtotal:subB,shipping:k===0?(settings.shippingFee||0):0,total:subB+(k===0?(settings.shippingFee||0):0),status:'pending',createdAt:serverTimestamp()})}cart=[];saveCart();toast('Commande envoyée !');showPage('home')}catch(e){toast(e.message)}}

async function renderBoutiquePage(id){try{var s=await getDoc(doc(db,'boutiques',id));if(!s.exists()){$('page-boutique').innerHTML='<div class="em"><p>Introuvable</p></div>';return}var b={id:s.id,...s.data()};var prods=products.filter(function(p){return p.boutiqueId===id});$('page-boutique').innerHTML=(b.banner?'<img src="'+escapeHtml(b.banner)+'" style="width:100%;max-height:140px;object-fit:cover"/>':'')+'<div style="background:#fff;padding:12px"><b style="font-size:16px">'+escapeHtml(b.name||'')+'</b><p style="font-size:13px;color:#555">'+escapeHtml(b.description||'')+'</p><button type="button" class="ba" id="btnMsgBout">Message</button></div><div class="pg">'+prods.map(productCard).join('')+'</div>';document.getElementById('btnMsgBout').addEventListener('click',async function(){if(!currentUser){showPage('auth');return}var qy=await getDocs(query(collection(db,'conversations'),where('boutiqueId','==',id),where('userId','==',currentUser.uid)));var cid;if(!qy.empty)cid=qy.docs[0].id;else{var ref=await addDoc(collection(db,'conversations'),{boutiqueId:id,userId:currentUser.uid,customerEmail:currentUser.email,customerName:currentUser.email,boutiqueName:b.name||'',lastMessage:'',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});cid=ref.id}showPage('chat-thread',cid)});$('page-boutique').querySelectorAll('[data-pid]').forEach(function(el){el.addEventListener('click',function(){showPage('product',el.getAttribute('data-pid'))})})}catch(e){$('page-boutique').innerHTML='<div class="em"><p>'+escapeHtml(e.message)+'</p></div>'}}

async function renderChatThread(cid){$('page-chat-thread').innerHTML='<div style="padding:12px;background:#fff;display:flex;gap:8px;align-items:center"><button type="button" id="ctBack">←</button><span style="flex:1" id="ctTitle">Chat</span></div><div id="ctBox" style="padding:12px;min-height:50vh"></div><div style="position:fixed;left:0;right:0;bottom:0;background:#fff;padding:8px;display:flex;gap:8px"><input id="ctIn" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:20px"/><button type="button" class="br" style="width:auto;padding:0 16px;height:40px;border-radius:20px" id="ctSend">Envoyer</button></div>';document.getElementById('ctBack').addEventListener('click',function(){showPage('messages')});try{var cdoc=await getDoc(doc(db,'conversations',cid));var conv=cdoc.exists()?cdoc.data():{};document.getElementById('ctTitle').textContent=conv.boutiqueName||'Chat';onSnapshot(query(collection(db,'conversations',cid,'messages'),orderBy('createdAt','asc')),function(snap){var box=document.getElementById('ctBox');box.innerHTML=snap.docs.map(function(d){var m=d.data();var me=m.from==='user';return'<div style="text-align:'+(me?'right':'left')+';margin:6px 0"><span style="display:inline-block;padding:8px 12px;border-radius:12px;background:'+(me?'#00A854':'#eee')+';color:'+(me?'#fff':'#333')+';font-size:13px">'+escapeHtml(m.text||'')+'</span></div>'}).join('')});document.getElementById('ctSend').addEventListener('click',async function(){var text=document.getElementById('ctIn').value.trim();if(!text)return;await addDoc(collection(db,'conversations',cid,'messages'),{from:'user',text:text,createdAt:serverTimestamp()});await updateDoc(doc(db,'conversations',cid),{lastMessage:text,updatedAt:serverTimestamp()});document.getElementById('ctIn').value=''})}catch(e){toast(e.message)}}
function productVideoList(){return products.filter(function(p){return!!p.videoUrl&&p.published!==false})}

function openVideoPlayer(productId,feed){setChrome(true);videoFeed=feed||productVideoList();videoFeedIdx=Math.max(0,videoFeed.findIndex(function(p){return p.id===productId}));if(videoFeedIdx<0)videoFeedIdx=0;var p=videoFeed[videoFeedIdx];if(!p||!p.videoUrl){toast('Vidéo introuvable');return}document.querySelectorAll('.page').forEach(function(pg){pg.classList.remove('on')});$('page-video').classList.add('on');paintVideoPlayer(p)}
function paintVideoPlayer(p){var price=minProductPrice(p);var img=(p.images&&p.images[0])||'';$('page-video').innerHTML='<div class="vid-page" id="vidPage"><div class="vid-top"><button type="button" id="vidBack"><i class="fa-solid fa-arrow-left"></i></button></div><div class="vid-stage"><video id="vidEl" src="'+escapeHtml(p.videoUrl)+'" playsinline loop autoplay></video><div class="vid-side"><button type="button"><i class="fa-regular fa-thumbs-up"></i><span>0</span></button><button type="button"><i class="fa-regular fa-comment"></i><span>0</span></button><button type="button" id="vidShare"><i class="fa-solid fa-share"></i></button></div><div class="vid-card" id="vidCard">'+(img?'<img src="'+escapeHtml(img)+'"/>':'')+'<div style="flex:1;min-width:0"><span class="badge">Offre exclusive</span><div class="title">'+escapeHtml(p.name)+'</div><div class="price">'+formatPrice(price)+' F</div></div><div class="cta"><button type="button" class="buy" id="vidBuy">Acheter</button><button type="button" class="cart" id="vidCart">Panier</button></div></div></div></div>';var page=$('vidPage'),video=$('vidEl');video.play().catch(function(){});video.addEventListener('play',function(){clearTimeout(videoHideTimer);videoHideTimer=setTimeout(function(){page.classList.add('vid-hide-ui')},15000)});page.addEventListener('click',function(e){if(e.target.closest('.vid-card,.vid-side,.vid-top'))return;if(page.classList.contains('vid-hide-ui')){page.classList.remove('vid-hide-ui');clearTimeout(videoHideTimer);videoHideTimer=setTimeout(function(){page.classList.add('vid-hide-ui')},15000)}else{if(video.paused)video.play();else video.pause()}});document.getElementById('vidBack').addEventListener('click',function(e){e.stopPropagation();clearTimeout(videoHideTimer);goBack()});document.getElementById('vidCard').addEventListener('click',function(e){e.stopPropagation();if(e.target.closest('#vidBuy,#vidCart'))return;currentProduct=p;showPage('product',p.id)});document.getElementById('vidBuy').addEventListener('click',function(e){e.stopPropagation();currentProduct=p;openVariantSheet('buy')});document.getElementById('vidCart').addEventListener('click',function(e){e.stopPropagation();currentProduct=p;openVariantSheet('cart')});document.getElementById('vidShare').addEventListener('click',function(e){e.stopPropagation();toast('Partage bientôt')});var sy=0;page.addEventListener('touchstart',function(e){sy=e.changedTouches[0].screenY},{passive:true});page.addEventListener('touchend',function(e){var dy=e.changedTouches[0].screenY-sy;if(dy<-60&&videoFeedIdx<videoFeed.length-1){videoFeedIdx++;paintVideoPlayer(videoFeed[videoFeedIdx])}if(dy>60&&videoFeedIdx>0){videoFeedIdx--;paintVideoPlayer(videoFeed[videoFeedIdx])}},{passive:true})}
function showFloatingVideo(p){if(!p||!p.videoUrl)return;var old=document.getElementById('vidFloat');if(old)old.remove();var el=document.createElement('div');el.className='vid-float';el.id='vidFloat';el.innerHTML='<video src="'+escapeHtml(p.videoUrl)+'" muted autoplay loop playsinline></video><button type="button" class="vf-x" id="vfClose">×</button>';document.body.appendChild(el);var dragging=false,ox=0,oy=0;el.addEventListener('touchstart',function(e){if(e.target.id==='vfClose')return;dragging=true;var t=e.touches[0],r=el.getBoundingClientRect();ox=t.clientX-r.left;oy=t.clientY-r.top},{passive:true});el.addEventListener('touchmove',function(e){if(!dragging)return;var t=e.touches[0];el.style.left=Math.max(0,Math.min(window.innerWidth-el.offsetWidth,t.clientX-ox))+'px';el.style.top=Math.max(0,Math.min(window.innerHeight-el.offsetHeight,t.clientY-oy))+'px';el.style.right='auto';el.style.bottom='auto'},{passive:true});el.addEventListener('touchend',function(){dragging=false});document.getElementById('vfClose').addEventListener('click',function(e){e.stopPropagation();el.remove()});el.addEventListener('click',function(e){if(e.target.id==='vfClose')return;el.remove();openVideoPlayer(p.id)})}
