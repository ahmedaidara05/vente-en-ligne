<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#00A854"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="icons/icon-192.png"/>
<title>IDUS</title>
<!-- v2-fix -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
<style>
:root{--red:#00A854;--green:#00A854;--bg:#F4F4F4;--white:#fff;--text:#1A1A1A;--muted:#888;--border:#EBEBEB;--search-bg:#F0F0F0;--nav-h:52px;--safe-b:env(safe-area-inset-bottom,0px);--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}
body{padding-bottom:calc(var(--nav-h)+var(--safe-b))}
img{max-width:100%;display:block}
button,input{font-family:inherit;font-size:16px;border:none;background:none;cursor:pointer}
.header{position:sticky;top:0;z-index:100;background:var(--white);box-shadow:0 1px 0 var(--border)}
.hi{padding:8px 10px 0}.sr{display:flex;align-items:center;gap:8px}
.logo{font-size:20px;font-weight:800;color:var(--red);cursor:pointer}
.sp{flex:1;display:flex;align-items:center;gap:8px;background:var(--search-bg);border-radius:999px;padding:0 12px;height:36px}
.sp input{flex:1;outline:none;background:transparent;font-size:13px;min-width:0}
.hi2{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.hi2 .bdg{position:absolute;top:2px;right:0;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.ct{display:flex;overflow-x:auto;padding:0 4px;scrollbar-width:none;border-bottom:1px solid var(--border)}
.ctb{flex-shrink:0;padding:10px 14px 8px;font-size:13px;color:#666;position:relative;white-space:nowrap}
.ctb.on{color:var(--text);font-weight:700}
.ctb.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--red);border-radius:2px 2px 0 0}
.page{display:none;min-height:60vh}.page.on{display:block}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px}
.pc{background:var(--white);border-radius:6px;overflow:hidden}
.pc .im{aspect-ratio:1;background:#f0f0f0;position:relative}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:6px 8px 8px}
.pc .tt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.pc .tg{font-size:11px;color:var(--green);margin-bottom:4px}
.pc .px{font-size:17px;font-weight:800;color:var(--red)}
.pc .cu{font-size:11px;font-weight:700;color:var(--red)}
.em{text-align:center;padding:48px 20px;color:var(--muted)}
.bn{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h)+var(--safe-b));padding-bottom:var(--safe-b);background:var(--white);border-top:1px solid var(--border);display:flex;z-index:100}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#666;height:var(--nav-h)}
.bn button i{font-size:20px}.bn button.on{color:var(--red)}
.to2{position:fixed;left:50%;bottom:calc(var(--nav-h)+20px+var(--safe-b));transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}.to2.on{opacity:1}
.pti{font-size:15px;font-weight:700;padding:12px 10px;background:var(--white)}
.ci{display:flex;gap:10px;padding:12px;background:var(--white);border-bottom:1px solid var(--border)}
.ci img{width:72px;height:72px;object-fit:cover;border-radius:4px}
.cs{background:var(--white);padding:12px;border-top:1px solid var(--border)}
.cs .rw{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.cs .tt{font-weight:700;font-size:15px}
.br{background:var(--red);color:#fff;height:44px;border-radius:22px;width:100%;font-weight:700;margin-top:10px;display:flex;align-items:center;justify-content:center}
.ba{background:#E8FFF0;color:var(--red);border:1px solid #A7F3D0;height:40px;border-radius:20px;flex:1;font-weight:700}
.pda{position:fixed;left:0;right:0;bottom:calc(var(--nav-h)+var(--safe-b));background:var(--white);padding:8px 12px;display:flex;gap:8px;border-top:1px solid var(--border);z-index:50}
.pdg img{width:100%;aspect-ratio:1;object-fit:cover}
.pdb,.pds{background:var(--white);padding:12px;margin-bottom:6px}
.ppx{font-size:26px;font-weight:800;color:var(--red)}
.pcu{font-size:14px;font-weight:700;color:var(--red)}
.ptt{font-size:15px;font-weight:600;margin:8px 0}
.fm{background:var(--white);padding:16px;margin:8px;border-radius:8px}
.fm input,.fm textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;background:#fafafa}
</style>
</head>
<body>
<div id="app">
<header class="header">
<div class="hi"><div class="sr">
<div class="logo" onclick="showPage('home')">IDUS</div>
<div class="sp"><i class="fa-solid fa-magnifying-glass"></i>
<input type="search" id="searchInput" placeholder="Rechercher…"/>
</div>
<button class="hi2" onclick="showPage('cart')"><i class="fa-solid fa-cart-shopping"></i><span class="bdg" id="cartBadge" style="display:none">0</span></button>
</div></div>
<div class="ct" id="catTabs"></div>
</header>
<div id="page-home" class="page on"></div>
<div id="page-catalog" class="page"></div>
<div id="page-product" class="page"></div>
<div id="page-cart" class="page"></div>
<div id="page-checkout" class="page"></div>
<div id="page-account" class="page"></div>
<div id="page-auth" class="page"></div>
<div id="page-chat" class="page"></div>
<div id="page-video" class="page"></div>
<nav class="bn">
<button data-page="home" class="on" onclick="showPage('home')"><i class="fa-solid fa-house"></i>Accueil</button>
<button data-page="video" onclick="showPage('video')"><i class="fa-solid fa-play"></i>Video</button>
<button data-page="catalog" onclick="showPage('catalog')"><i class="fa-solid fa-tags"></i>Promotion</button>
<button data-page="chat" onclick="showPage('chat')"><i class="fa-regular fa-comment-dots"></i>Chat</button>
<button data-page="account" onclick="showPage('account')"><i class="fa-regular fa-user"></i>Compte</button>
</nav>
<div class="to2" id="toast"></div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, query, where, orderBy, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyDkKvnL5_pHGraCFMcfXvueywwujCIG8SE",authDomain:"idus-a87a6.firebaseapp.com",projectId:"idus-a87a6",storageBucket:"idus-a87a6.firebasestorage.app",messagingSenderId:"284785552985",appId:"1:284785552985:web:4cb12a71465a0e167bcb48",measurementId:"G-M0EKXCDV3R"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
let currentUser=null,cart=JSON.parse(localStorage.getItem('vl_cart')||'[]'),products=[],categories=[],settings={currency:'XOF',shippingFee:1500},currentProduct=null,currentCategory=null,searchTerm='';
function $(id){return document.getElementById(id)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}
function formatPrice(n){return new Intl.NumberFormat('fr-FR').format(n||0)}
function saveCart(){localStorage.setItem('vl_cart',JSON.stringify(cart));updateCartBadge()}
function updateCartBadge(){const c=cart.reduce((s,i)=>s+(i.qty||1),0);const b=$('cartBadge');if(!b)return;if(c>0){b.style.display='flex';b.textContent=c}else b.style.display='none'}
function escapeHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
window.showPage=function(page,data){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  const el=$('page-'+page);if(el)el.classList.add('on');
  document.querySelectorAll('.bn button').forEach(b=>b.classList.toggle('on',b.dataset.page===page));
  window.scrollTo(0,0);
  if(page==='home')renderHome();
  else if(page==='catalog')renderCatalog();
  else if(page==='product'&&data)renderProduct(data);
  else if(page==='cart')renderCart();
  else if(page==='checkout')renderCheckout();
  else if(page==='account')renderAccount();
  else if(page==='auth')renderAuth();
  else if(page==='chat')$('page-chat').innerHTML='<div class="em"><p>Messages bientôt</p></div>';
  else if(page==='video')$('page-video').innerHTML='<div class="em"><p>Vidéos bientôt</p></div>';
};
async function loadCategories(){try{const s=await getDocs(collection(db,'categories'));categories=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){categories=[]}}
async function loadProducts(){try{const s=await getDocs(collection(db,'products'));products=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.published!==false)}catch(e){products=[]}return products}
function productCard(p){
  const price=(p.promoPrice&&p.promoPrice<p.price)?p.promoPrice:p.price;
  const img=(p.images&&p.images[0])||'https://via.placeholder.com/400?text=Produit';
  return `<div class="pc" onclick="showPage('product','${p.id}')"><div class="im"><img src="${img}" loading="lazy" onerror="this.src='https://via.placeholder.com/400'"/></div><div class="bd"><div class="tt">${escapeHtml(p.name)}</div><div class="tg">Livraison 2-4 j</div><div class="pr"><span class="cu">F</span> <span class="px">${formatPrice(price)}</span></div></div></div>`;
}
function renderCatTabs(active){
  const el=$('catTabs');if(!el)return;
  el.innerHTML=`<button class="ctb ${!active?'on':''}" onclick="filterCategory(null)">Tous</button>`+categories.map(c=>`<button class="ctb ${active===c.id?'on':''}" onclick="filterCategory('${c.id}')">${escapeHtml(c.name)}</button>`).join('');
}
window.filterCategory=function(id){currentCategory=id;showPage('catalog')}
async function renderHome(){
  renderCatTabs(null);
  $('page-home').innerHTML='<div class="pg" id="homeProducts"><div class="em" style="grid-column:1/-1"><p>Chargement…</p></div></div>';
  await loadProducts();
  const g=$('homeProducts');
  g.innerHTML=products.length?products.map(productCard).join(''):'<div class="em" style="grid-column:1/-1"><p>Aucun produit</p></div>';
}
async function renderCatalog(){
  renderCatTabs(currentCategory);
  await loadProducts();
  let list=products.slice();
  if(currentCategory)list=list.filter(p=>p.categoryId===currentCategory);
  if(searchTerm){const t=searchTerm.toLowerCase();list=list.filter(p=>((p.name||'')+(p.description||'')).toLowerCase().includes(t))}
  $('page-catalog').innerHTML='<div class="pg">'+(list.length?list.map(productCard).join(''):'<div class="em" style="grid-column:1/-1"><p>Aucun résultat</p></div>')+'</div>';
}
async function renderProduct(id){
  try{
    const s=await getDoc(doc(db,'products',id));
    if(!s.exists()){$('page-product').innerHTML='<div class="em"><p>Introuvable</p></div>';return}
    const p={id:s.id,...s.data()};currentProduct=p;
    const price=(p.promoPrice&&p.promoPrice<p.price)?p.promoPrice:p.price;
    const img=(p.images&&p.images[0])||'https://via.placeholder.com/600';
    $('page-product').innerHTML=`<div class="pdg"><img src="${img}"/></div><div class="pdb"><div><span class="pcu">F</span> <span class="ppx">${formatPrice(price)}</span></div><div class="ptt">${escapeHtml(p.name)}</div><div style="font-size:12px;color:#888">Stock: ${p.stock??0}</div></div><div class="pds"><h4 style="margin-bottom:8px">Description</h4><div>${escapeHtml(p.description||'—')}</div></div><div class="pda"><button class="ba" onclick="addToCart()">Panier</button><button class="br" style="flex:1;margin:0;height:40px" onclick="buyNow()">Acheter</button></div>`;
  }catch(e){$('page-product').innerHTML='<div class="em"><p>'+e.message+'</p></div>'}
}
window.addToCart=function(){if(!currentProduct)return;const p=currentProduct;const price=(p.promoPrice&&p.promoPrice<p.price)?p.promoPrice:p.price;cart.push({productId:p.id,name:p.name,price,image:(p.images&&p.images[0])||'',qty:1});saveCart();toast('Ajouté au panier')};
window.buyNow=function(){addToCart();showPage('checkout')};
function renderCart(){
  if(!cart.length){$('page-cart').innerHTML='<div class="em"><p>Panier vide</p><button class="br" style="max-width:200px;margin:12px auto" onclick="showPage(\'home\')">Continuer</button></div>';return}
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);const ship=settings.shippingFee||0;
  $('page-cart').innerHTML=`<div class="pti">Panier</div>${cart.map((item,idx)=>`<div class="ci"><img src="${item.image||'https://via.placeholder.com/80'}"/><div class="inf"><div>${escapeHtml(item.name)}</div><div style="color:var(--red);font-weight:700">${formatPrice(item.price)} F × ${item.qty}</div><button onclick="cart.splice(${idx},1);saveCart();renderCart()" style="font-size:12px;color:#888;margin-top:4px">Supprimer</button></div></div>`).join('')}<div class="cs"><div class="rw"><span>Sous-total</span><span>${formatPrice(sub)} F</span></div><div class="rw"><span>Livraison</span><span>${formatPrice(ship)} F</span></div><div class="rw tt"><span>Total</span><span>${formatPrice(sub+ship)} F</span></div><button class="br" onclick="goCheckout()">Commander</button></div>`;
}
window.goCheckout=function(){if(!currentUser){showPage('auth');return}showPage('checkout')};
function renderCheckout(){$('page-checkout').innerHTML=`<div class="pti">Commande</div><div class="fm"><label>Nom</label><input id="chkName"/><label>Téléphone</label><input id="chkPhone"/><label>Adresse</label><textarea id="chkAddr"></textarea><button class="br" onclick="placeOrder()">Confirmer</button></div>`}
window.placeOrder=async function(){
  const name=$('chkName').value.trim(),phone=$('chkPhone').value.trim(),address=$('chkAddr').value.trim();
  if(!name||!phone||!address){toast('Remplissez les champs');return}
  try{
    const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);const ship=settings.shippingFee||0;
    await addDoc(collection(db,'orders'),{orderNumber:'CMD-'+Date.now().toString(36).toUpperCase(),userId:currentUser?.uid||null,customer:{name,phone,address},items:cart.map(i=>({productId:i.productId,name:i.name,price:i.price,qty:i.qty,image:i.image})),subtotal:sub,shipping:ship,total:sub+ship,status:'pending',createdAt:serverTimestamp()});
    cart=[];saveCart();toast('Commande envoyée !');showPage('home');
  }catch(e){toast(e.message)}
};
function renderAccount(){
  if(!currentUser){$('page-account').innerHTML='<div class="em"><p>Non connecté</p><button class="br" style="max-width:180px;margin:12px auto" onclick="showPage(\'auth\')">Connexion</button></div>';return}
  $('page-account').innerHTML=`<div class="fm"><h3>${escapeHtml(currentUser.email)}</h3><button class="br" onclick="signOut(auth);showPage('home')">Déconnexion</button></div>`;
}
function renderAuth(){$('page-auth').innerHTML=`<div class="fm"><h3>Connexion</h3><label>Email</label><input id="authEmail" type="email"/><label>Mot de passe</label><input id="authPass" type="password"/><button class="br" onclick="doLogin()">Se connecter</button><button class="ba" style="width:100%;margin-top:8px" onclick="doRegister()">Créer un compte</button></div>`}
window.doLogin=async function(){try{await signInWithEmailAndPassword(auth,$('authEmail').value.trim(),$('authPass').value);toast('OK');showPage('account')}catch(e){toast(e.message)}};
window.doRegister=async function(){try{const cred=await createUserWithEmailAndPassword(auth,$('authEmail').value.trim(),$('authPass').value);await setDoc(doc(db,'users',cred.user.uid),{email:cred.user.email,role:'customer',createdAt:serverTimestamp()});toast('Compte créé');showPage('account')}catch(e){toast(e.message)}};
$('searchInput').addEventListener('input',e=>{clearTimeout(window._st);window._st=setTimeout(()=>{searchTerm=e.target.value.trim();if(searchTerm){currentCategory=null;showPage('catalog')}},300)});
onAuthStateChanged(auth,u=>{currentUser=u});
async function init(){updateCartBadge();await loadCategories();await loadProducts();renderHome()}
init();
</script>
</body>
</html>
