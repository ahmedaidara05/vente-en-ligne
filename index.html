<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#00A854"/>
<title>IDA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
<style>
:root{--red:#00A854;--danger:#E02E24;--bg:#F4F4F4;--border:#EBEBEB;--nav-h:52px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,sans-serif;background:var(--bg);color:#1a1a1a;overflow-x:hidden}
body{padding-bottom:calc(var(--nav-h)+var(--safe-b))}
body.hide-chrome{padding-bottom:0}
body.hide-chrome .header,body.hide-chrome .bn{display:none!important}
img{max-width:100%;display:block}
button,input,textarea{font-family:inherit;font-size:16px;border:none;background:none}
button{cursor:pointer}
.header{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 1px 0 var(--border)}
.hi{padding:8px 10px 0}.sr{display:flex;align-items:center;gap:8px}
.logo{font-size:20px;font-weight:800;color:var(--red);cursor:pointer}
.sp{flex:1;display:flex;align-items:center;gap:8px;background:#F0F0F0;border-radius:999px;padding:0 12px;height:36px}
.sp input{flex:1;outline:none;background:transparent;font-size:13px;min-width:0}
.hi2{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.hi2 .bdg{position:absolute;top:2px;right:0;background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.ct{display:flex;overflow-x:auto;padding:0 4px;scrollbar-width:none;border-bottom:1px solid var(--border)}
.ctb{flex-shrink:0;padding:10px 14px 8px;font-size:13px;color:#666;position:relative;white-space:nowrap}
.ctb.on{color:#1a1a1a;font-weight:700}
.page{display:none;min-height:50vh}.page.on{display:block}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px}
.pc{background:#fff;border-radius:6px;overflow:hidden}
.pc .im{aspect-ratio:1;background:#f0f0f0}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:6px 8px 8px}
.pc .tt{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .px{font-size:17px;font-weight:800;color:var(--danger)}
.free-deliv{display:inline-block;background:#E02E24;color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:3px;transform:skewX(-12deg);margin-right:4px;letter-spacing:.3px;text-transform:uppercase;line-height:1.4}
.free-deliv span{display:inline-block;transform:skewX(12deg)}
.em{text-align:center;padding:48px 20px;color:#888}
.bn{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h)+var(--safe-b));padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#666;height:var(--nav-h)}
.bn button i{font-size:20px}.bn button.on{color:var(--red)}
.to2{position:fixed;left:50%;bottom:calc(var(--nav-h)+20px+var(--safe-b));transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:500;opacity:0;pointer-events:none;transition:opacity .25s}.to2.on{opacity:1}
.br{background:var(--danger);color:#fff;height:44px;border-radius:22px;width:100%;font-weight:700;display:flex;align-items:center;justify-content:center}
.ba{background:#E8FFF0;color:var(--red);border:1px solid #A7F3D0;height:40px;border-radius:20px;flex:1;font-weight:700}
.pd-actions{position:fixed;left:0;right:0;bottom:0;z-index:120;padding:8px 10px calc(8px + var(--safe-b));background:#fff;border-top:1px solid var(--border);display:flex;gap:6px;align-items:center}
.pd-ico{width:42px;height:42px;border-radius:10px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:18px}
.pd-top{position:fixed;top:0;left:0;right:0;z-index:120;display:flex;justify-content:space-between;padding:10px 12px;pointer-events:none}
.pd-top button{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex-shrink:0;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:start;background:#f0f0f0}
.fs-view{position:fixed;inset:0;background:#000;z-index:400;display:flex;flex-direction:column}
.fs-view .fs-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.fs-view img{max-width:100%;max-height:100%;object-fit:contain}
.fs-view .fs-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:2}
.fs-view .fs-top button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff}
.fs-view .fs-bot{background:rgba(0,0,0,.75);color:#fff;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.fs-view .fs-bot .fs-price{font-size:20px;font-weight:800;color:#E02E24;background:#fff;display:inline-block;padding:4px 12px;border-radius:8px}
.fs-view .fs-bot .fs-desc{font-size:13px;margin-top:8px;opacity:.9}
.fs-view .fs-actions{display:flex;gap:8px;margin-top:10px}
.vid-page{position:fixed;inset:0;background:#000;z-index:90}
.vid-stage{position:absolute;inset:0}
.vid-stage video{width:100%;height:100%;object-fit:contain}
.vid-side{position:absolute;right:10px;bottom:160px;display:flex;flex-direction:column;gap:16px;align-items:center;z-index:5}
.vid-side button{background:none;color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.vid-side i{font-size:24px;display:block}
.vid-follow{position:absolute;bottom:-8px;right:-8px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;border:2px solid #fff;z-index:6;background:#E02E24;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);overflow:hidden}
.vid-follow.following{background:#eee;color:#000}
.vid-follow svg{width:18px;height:18px;display:block}
.vid-logo-wrap{position:relative;width:46px;height:46px}
.vid-card{position:absolute;left:12px;right:64px;bottom:24px;background:rgba(255,255,255,.92);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;z-index:5;cursor:pointer}
.vid-card img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.vid-card .badge{background:#E02E24;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.vid-card .title{font-size:13px;font-weight:700}
.vid-card .price{color:#E02E24;font-weight:800}
.vid-card .cta{margin-left:auto;display:flex;flex-direction:column;gap:4px}
.vid-card .cta button{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700}
.vid-card .cta .buy{background:#E02E24;color:#fff}
.vid-card .cta .cart{background:#fff;color:#E02E24;border:1px solid #E02E24}
.vid-top{position:absolute;top:0;left:0;right:0;z-index:6;padding:12px}
.vid-top button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff}
.vid-hide-ui .vid-top,.vid-hide-ui .vid-card,.vid-hide-ui .vid-side{opacity:0;pointer-events:none;transition:opacity .3s}
.vid-float{position:fixed;width:110px;height:180px;border-radius:12px;overflow:hidden;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.35);background:#000;border:2px solid #fff;right:12px;bottom:90px;touch-action:none}
.vid-float video{width:100%;height:100%;object-fit:cover}
.vid-float .vf-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff}
.ad-banner{background:#fff;overflow:hidden;position:relative}
.ad-banner-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ad-banner-track::-webkit-scrollbar{display:none}
.ad-banner-track a,.ad-banner-track .ad-slide{flex-shrink:0;width:100%;scroll-snap-align:start}
.ad-banner-track img{width:100%;height:100px;object-fit:cover;display:block}
.ad-banner .ad-x{position:absolute;top:6px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:14px;z-index:2}
.ad-popup{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:450;display:flex;align-items:center;justify-content:center;padding:20px}
.ad-popup-box{background:#fff;border-radius:12px;max-width:340px;width:100%;overflow:hidden;position:relative}
.ad-popup-box img{width:100%;max-height:360px;object-fit:cover;display:block}
.ad-popup-box .ad-x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:16px}
.bq-hero{position:relative;height:160px;background:#e9e9e9;overflow:visible}
.bq-hero-clip{position:absolute;inset:0;overflow:hidden}
.bq-hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 100%);mask-image:linear-gradient(to bottom,#000 60%,transparent 100%)}
.bq-hero-frost{position:absolute;left:0;right:0;bottom:0;height:70%;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(to top,#000 0%,#000 40%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,#000 40%,transparent 100%)}
.bq-logo-wrap{position:absolute;right:14px;bottom:-42px;width:104px;height:104px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.2);overflow:hidden;display:flex;align-items:center;justify-content:center;z-index:5}
.bq-logo-wrap img{width:100%;height:100%;object-fit:contain;background:#fff}
.bq-logo-fallback{font-size:38px;font-weight:800;color:var(--red)}
.bq-head{padding:32px 16px 12px 16px;text-align:left;background:#fff}
.bq-name{font-size:26px;font-weight:800;line-height:1.2}
.bq-desc{font-size:13px;color:#555;margin-top:12px}
.bq-head{padding:40px 16px 0 16px;text-align:left;background:#fff}
.bq-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:0;padding:14px 16px 16px;background:#fff}
.bq-btn-follow{height:36px;padding:0 20px;border-radius:18px;font-weight:700;color:#fff;background:var(--danger);border:1px solid var(--danger)}
.bq-btn-follow.following{background:#eee;color:#444;border-color:#ddd}
.bq-btn-msg{height:36px;padding:0 20px;border-radius:18px;font-weight:700;color:var(--red);background:#fff;border:1.5px solid #A7F3D0}
.follow-row{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-bottom:1px solid #eee}
.follow-row .fr-ava{width:48px;height:48px;border-radius:50%;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--red)}
.follow-row .fr-ava img{width:100%;height:100%;object-fit:cover}
.follow-row .fr-name{flex:1;font-weight:600}
.follow-row button{padding:6px 12px;border-radius:16px;background:#eee;color:#444;font-size:12px;font-weight:700}
.msg-row{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-bottom:1px solid #eee;cursor:pointer}
.msg-row .mr-ava{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--red)}
.msg-row .mr-ava img{width:100%;height:100%;object-fit:cover}
.msg-row .mr-body{flex:1;min-width:0}
.msg-row .mr-name{font-weight:700;font-size:14px}
.msg-row .mr-last{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-side button.liked{color:#E02E24}
.vid-side button.liked i{color:#E02E24}
.vid-comments{position:fixed;left:0;right:0;bottom:0;height:70vh;background:#fff;border-radius:16px 16px 0 0;z-index:250;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s}
.vid-comments.open{transform:translateY(0)}
.vid-comments-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;font-weight:700}
.vid-comments-list{flex:1;overflow-y:auto;padding:12px}
.vid-comment{display:flex;gap:8px;margin-bottom:12px}
.vid-comment .vc-ava{width:32px;height:32px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:700;color:#00A854;flex-shrink:0}
.vid-comment .vc-body{flex:1;font-size:13px}
.vid-comment .vc-name{font-weight:400;font-size:11px;color:#999}
.vid-comment .vc-text{margin-top:2px;font-weight:700;color:#1a1a1a}
.vid-comments-in{padding:8px;border-top:1px solid #eee;display:flex;gap:8px}
.vid-comments-in input{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;font-size:14px}
.vid-comments-in button{padding:0 16px;height:40px;border-radius:20px;background:#E02E24;color:#fff;font-weight:700}
  /* === Messages : menu, sélection, épinglé, archives === */
.msg-head{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px;background:#fff;border-bottom:1px solid #eee}
.msg-head .mh-spacer{width:36px;height:36px;flex-shrink:0}
.msg-head b{flex:1;text-align:center;font-size:16px;font-weight:700}
.msg-head button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#333;font-weight:700}
.msg-menu{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:420;display:flex;align-items:flex-start;justify-content:flex-end;padding:50px 12px 0}
.msg-menu-box{background:#fff;border-radius:12px;min-width:200px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.msg-menu-box button{width:100%;padding:14px 16px;display:flex;gap:12px;align-items:center;text-align:left;border-bottom:1px solid #eee;font-size:14px}
.msg-menu-box button:last-child{border-bottom:none}
.msg-menu-box button i{width:20px;color:#00A854}
.msg-menu-box button.danger i,.msg-menu-box button.danger{color:#E02E24}
.msg-select-bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #eee;display:flex;gap:8px;z-index:110}
.msg-select-bar .count{flex:1;font-size:13px;color:#555;display:flex;align-items:center}
.msg-select-bar button{height:40px;padding:0 20px;border-radius:20px;font-weight:700}
.msg-select-bar .ok{background:#00A854;color:#fff}
.msg-select-bar .cancel{background:#eee;color:#333}
.msg-row .mr-check{width:22px;height:22px;border-radius:50%;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg-row .mr-check.on{background:#00A854;border-color:#00A854;color:#fff}
.msg-row .mr-check.on i{font-size:12px}
.msg-row.pinned{background:#F0FFF7}
.msg-row .mr-pin{color:#00A854;font-size:12px;margin-left:6px}
  body.hide-header .header{display:none!important}
  body.hide-search-cart .sp,body.hide-search-cart .hi2{display:none!important}
  /* En-tête de conversation : IDA à gauche, Message centré, menu à droite */
  .ct-header{
  width:100%;
  height:56px;
  min-height:56px;
  padding:0 16px;
  background:#fff;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:100;
  white-space:nowrap;
}

.ct-logo{
  grid-column:1;
  justify-self:start;
  display:block;
  font-size:21px;
  line-height:1;
  font-weight:800;
  color:#00A854;
  white-space:nowrap;
}

.ct-heading{
  grid-column:2;
  justify-self:center;
  display:block;
  margin:0;
  font-size:17px;
  line-height:1;
  font-weight:700;
  color:#1a1a1a;
  white-space:nowrap;
}

.ct-more{
  grid-column:3;
  justify-self:end;
  width:36px;
  min-width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  line-height:1;
  color:#333;
}

/* === Espace Compte IDA === */
.account-page{max-width:760px;margin:0 auto;padding:22px 16px 30px;color:#17211b}
.account-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 18px}
.account-eyebrow{font-size:10px;letter-spacing:1.6px;font-weight:800;color:#00A854;margin-bottom:6px}
.account-intro h1{font-size:25px;line-height:1.15;font-weight:850;letter-spacing:-.6px}
.account-intro p{font-size:13px;color:#7a8580;margin-top:6px}
.account-brand-mark{width:48px;height:48px;border-radius:15px;background:#E8FFF1;color:#00A854;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;box-shadow:inset 0 0 0 1px #d2f5df}
.account-profile{position:relative;display:flex;align-items:center;gap:13px;padding:17px;background:linear-gradient(120deg,#073d27,#087b45);border-radius:18px;color:#fff;box-shadow:0 8px 22px rgba(0,110,57,.14);overflow:hidden}
.account-profile:after{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(255,255,255,.11);border-radius:50%;right:-52px;top:-78px;box-shadow:0 0 0 18px rgba(255,255,255,.035),0 0 0 38px rgba(255,255,255,.025)}
.account-avatar{width:54px;height:54px;flex:0 0 54px;border-radius:17px;background:#fff;color:#008c4b;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:850;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.account-profile-info{min-width:0;position:relative;z-index:1;flex:1}
.account-profile-name{font-size:15px;font-weight:800;margin-bottom:4px}
.account-email{font-size:12px;color:rgba(255,255,255,.82);overflow-wrap:anywhere}
.account-status{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,.13);font-size:10px;color:#fff}
.account-status span{width:6px;height:6px;border-radius:50%;background:#7ff0ae}
.account-profile-shield{position:relative;z-index:1;color:rgba(255,255,255,.72);font-size:18px;margin-right:2px}
.account-section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 11px}
.account-section-head h2{font-size:15px;font-weight:800;color:#1b2921}
.account-section-head>span{font-size:11px;color:#8b9690}
.account-shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.account-shortcut{position:relative;min-width:0;min-height:126px;padding:13px 10px 12px;background:#fff;border:1px solid #edf0ed;border-radius:15px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;box-shadow:0 3px 12px rgba(25,55,37,.035);transition:transform .15s,border-color .15s}
.account-shortcut:active{transform:scale(.98)}
.account-shortcut-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:11px}
.account-shortcut-icon.messages{background:#e9f4ff;color:#2876c7}
.account-shortcut-icon.favorites{background:#fff0f1;color:#e45a70}
.account-shortcut-icon.follows{background:#e8fff1;color:#00A854}
.account-shortcut strong{font-size:12px;color:#1d2922;line-height:1.25}
.account-shortcut small{font-size:10px;color:#89938d;margin-top:5px;line-height:1.3}
.account-chevron{position:absolute;right:10px;top:17px;font-size:10px;color:#aab3ad}
.account-options-head{margin-top:24px}
.account-options{background:#fff;border:1px solid #edf0ed;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px rgba(25,55,37,.035)}
.account-option-row{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:65px}
.account-option-row+.account-option-row{border-top:1px solid #f0f2f0}
.account-option-icon{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:#f1f8f3;color:#16864e;display:flex;align-items:center;justify-content:center;font-size:14px}
.account-option-copy{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.account-option-copy strong{font-size:12px;color:#27332c}

function adLinkHandler(a){if(a.linkType==='url'&&a.linkUrl)return function(){location.href=a.linkUrl};if(a.linkType==='product'&&a.linkId)return function(){showPage('product',a.linkId)};if(a.linkType==='boutique'&&a.linkId)return function(){showPage('boutique',a.linkId)};return null}
async function loadAds(){try{var s=await getDocs(query(collection(db,'ads'),where('active','==',true)));ads=s.docs.map(function(d){return{id:d.id,...d.data()}});renderBannerAds();renderInappAds()}catch(e){}}
function renderBannerAds(){var banner=$('adBanner');if(!banner)return;var list=ads.filter(function(a){return a.type==='banner'&&!adSeen(a.id)});if(!list.length){banner.style.display='none';banner.innerHTML='';return}banner.style.display='block';banner.innerHTML='<button type="button" class="ad-x" id="adBannerX">×</button><div class="ad-banner-track" id="adTrack">'+list.map(function(a){return'<div class="ad-slide" data-adid="'+a.id+'"><img src="'+escapeHtml(a.image||'')+'" onerror="this.style.display=\'none\'"/></div>'}).join('')+'</div>';list.forEach(function(a){markAdSeen(a.id)});document.getElementById('adBannerX').addEventListener('click',function(){banner.style.display='none'});banner.querySelectorAll('.ad-slide').forEach(function(sl){sl.addEventListener('click',function(){var a=list.find(function(x){return x.id===sl.getAttribute('data-adid')});var fn=adLinkHandler(a);if(fn)fn()})})}
function renderInappAds(){var list=ads.filter(function(a){return a.type==='inapp'&&!adSeen(a.id)});if(!list.length)return;var a=list[0];var el=document.createElement('div');el.className='ad-popup';el.id='adPopup';el.innerHTML='<div class="ad-popup-box"><button type="button" class="ad-x" id="adPopX">×</button><img src="'+escapeHtml(a.image||'')+'" onerror="this.style.display=\'none\'" id="adPopImg"/></div>';document.body.appendChild(el);markAdSeen(a.id);var fn=adLinkHandler(a);if(fn)document.getElementById('adPopImg').addEventListener('click',fn);document.getElementById('adPopX').addEventListener('click',function(){el.remove()})}
$('searchInput').addEventListener('input',function(e){clearTimeout(window._st);window._st=setTimeout(function(){searchTerm=e.target.value.trim();if(searchTerm)showPage('catalog')},300)});
onAuthStateChanged(auth,function(u){currentUser=u;updateCartBadge()});
async function init(){updateCartBadge();renderHome();loadCategories();loadProducts().then(function(){var g=$('homeProducts');if(g)paintHomeProducts(g,diversifyProducts(products))}).catch(function(){});loadAds()}
init();
</script>
