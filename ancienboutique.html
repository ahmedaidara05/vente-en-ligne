<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#00A854"/>
<title>IDUS Boutique</title>
<style>

/* ==========================================================
   IDUS BOUTIQUE — NOUVELLE IDENTITÉ VISUELLE
   Interface vendeur professionnelle, claire et responsive.
   Le HTML fonctionnel et le JavaScript métier sont conservés.
   ========================================================== */
:root{
  color-scheme:light;
  --brand:#087f5b;
  --brand-dark:#066447;
  --brand-soft:#e8f5ef;
  --brand-pale:#f2faf6;
  --ink:#17231f;
  --muted:#718078;
  --surface:#ffffff;
  --surface-2:#f7f9f8;
  --page:#f2f5f3;
  --line:#e3eae6;
  --danger:#d94848;
  --warning:#a66a13;
  --shadow:0 8px 28px rgba(20,48,35,.055);
  --shadow-lg:0 18px 50px rgba(20,48,35,.10);
  --radius:16px;
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;scroll-behavior:smooth}
body{
  min-height:100vh;
  background:var(--page);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(8,127,91,.18);
  outline-offset:2px;
}
#app.wrap{
  width:100%;
  max-width:100%;
  min-height:100vh;
  margin:0 auto;
  padding:28px clamp(18px,3vw,52px) 48px;
}
.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  color:var(--brand);
  font-size:25px;
  font-weight:850;
  letter-spacing:-.8px;
  margin:2px 0 2px;
}
.logo:before{
  content:"ID";
  display:grid;
  place-items:center;
  width:38px;height:38px;
  border-radius:12px;
  color:#fff;
  background:linear-gradient(145deg,#0b9a6d,#066447);
  font-size:14px;
  letter-spacing:-.5px;
  box-shadow:0 6px 14px rgba(8,127,91,.2);
}
.sub{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin:0 0 28px;
}

.hidden{display:none!important}
#loginLogo:before{display:none}
#loginBrand{display:block;width:150px;height:auto;max-height:90px;object-fit:contain;margin:0 auto 14px}
.product-settings{border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0;background:#fbfdfb}
.product-settings>summary{cursor:pointer;font-weight:800;color:var(--brand-dark);padding:4px}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}.settings-grid label{margin:5px 0 4px}.settings-grid input,.settings-grid select{margin-bottom:5px}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chart-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;min-width:0}
.chart-card canvas{width:100%;height:220px}
@media(max-width:700px){.settings-grid,.chart-grid{grid-template-columns:1fr}}


/* Connexion */
#view-login.card{
  width:min(100%,440px);
  margin:clamp(30px,7vh,84px) auto;
  padding:34px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow-lg);
}
#view-login:before{
  content:"Espace professionnel";
  display:block;
  color:var(--brand);
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:9px;
}
#view-login h3{
  color:var(--ink);
  font-size:23px;
  letter-spacing:-.6px;
  margin-bottom:24px;
}
.card{
  min-width:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.card h3{
  color:var(--ink);
  font-size:19px;
  font-weight:780;
  letter-spacing:-.4px;
  margin-bottom:18px;
}
label{
  display:block;
  color:#52635a;
  font-size:12px;
  font-weight:700;
  margin:13px 0 6px;
}
input,select,textarea{
  display:block;
  width:100%;
  min-width:0;
  min-height:44px;
  padding:11px 13px;
  margin:0 0 12px;
  color:var(--ink);
  background:#fbfcfb;
  border:1px solid #dce5df;
  border-radius:10px;
  font-size:14px;
  line-height:1.4;
  box-shadow:inset 0 1px 2px rgba(20,48,35,.025);
  transition:border-color .18s,box-shadow .18s,background .18s;
}
input::placeholder,textarea::placeholder{color:#9aa79f}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--brand);
  background:#fff;
  box-shadow:0 0 0 3px rgba(8,127,91,.10);
}
input[type=checkbox],input[type=radio]{
  display:inline-block;
  width:17px;height:17px;
  min-height:0;
  padding:0;margin:0 7px 0 0;
  accent-color:var(--brand);
  vertical-align:middle;
  box-shadow:none;
}
textarea{min-height:90px;resize:vertical}
button.p{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:44px;
  width:100%;
  padding:12px 18px;
  color:#fff;
  background:var(--brand);
  border:1px solid var(--brand);
  border-radius:10px;
  font-size:13px;
  font-weight:750;
  letter-spacing:.01em;
  box-shadow:0 5px 12px rgba(8,127,91,.14);
}
button.p:hover{background:var(--brand-dark);border-color:var(--brand-dark);transform:translateY(-1px);box-shadow:0 8px 18px rgba(8,127,91,.19)}
button.s{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:7px 12px;
  margin:3px 4px 3px 0;
  color:#42544a;
  background:#f5f8f6;
  border:1px solid #dce6df;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
}
button.s:hover{background:var(--brand-soft);border-color:#b7d9c8;color:var(--brand-dark)}
button.d{color:var(--danger)!important;background:#fff7f6!important;border-color:#f2d4d1!important}
button.d:hover{background:#ffedeb!important;border-color:#e9aaa4!important}
.filebtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 14px;
  color:var(--brand-dark);
  background:var(--brand-soft);
  border:1px dashed #9bcbb4;
  border-radius:9px;
  font-size:12px;
  font-weight:750;
  cursor:pointer;
}
.filebtn:hover{background:#dff1e7}
.filebtn input{display:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.err{display:block;color:var(--danger);font-size:12px;margin:9px 0}
.ok{color:var(--brand);font-size:12px;font-weight:700}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.item{
  padding:15px 0;
  border-bottom:1px solid var(--line);
  color:var(--ink);
  font-size:13px;
}
.item:last-child{border-bottom:0}
.item b{color:var(--ink)}
.img-grid{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.img-grid .box{
  width:82px;height:82px;
  border-radius:11px;
  overflow:hidden;
  position:relative;
  background:var(--surface-2);
  border:1px solid var(--line);
}
.img-grid .box img{width:100%;height:100%;object-fit:cover}
.img-grid .box .rm{
  position:absolute;top:5px;right:5px;
  display:grid;place-items:center;
  width:23px;height:23px;
  color:#fff;background:rgba(25,35,29,.78);
  border:0;border-radius:50%;
  font-size:15px;cursor:pointer;
}

/* Tableau de bord : navigation latérale sur grand écran */
#view-dash{
  display:grid;
  grid-template-columns:245px minmax(0,1fr);
  grid-template-areas:"shophead shophead" "sidebar workspace";
  align-items:start;
  gap:0 28px;
  width:100%;
  max-width:1600px;
  margin:0 auto;
}
#view-dash>.row:first-child{
  grid-area:shophead;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:16px 22px;
  margin:0 0 22px!important;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
}
#shopName{display:inline-block;font-size:16px;font-weight:800;letter-spacing:-.2px}
#shopEmail{display:inline-block;margin-top:2px;font-size:12px}
#btnLogout{min-height:36px;padding:8px 14px}
.nav{
  grid-area:sidebar;
  position:sticky;
  top:18px;
  display:flex;
  flex-direction:column;
  flex-wrap:nowrap;
  gap:5px;
  padding:12px;
  margin:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
}
.nav button{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  flex:0 0 auto;
  width:100%;
  min-height:44px;
  padding:10px 13px;
  color:#53635a;
  background:transparent;
  border:0;
  border-radius:9px;
  font-size:13px;
  font-weight:680;
  text-align:left;
}
.nav button:before{
  content:"";
  display:block;
  width:7px;height:7px;
  margin-right:11px;
  border-radius:50%;
  background:#bdc9c1;
}
.nav button:hover{color:var(--brand-dark);background:#f4f8f5}
.nav button.on{
  color:var(--brand-dark);
  background:var(--brand-soft);
  box-shadow:inset 3px 0 0 var(--brand);
}
.nav button.on:before{background:var(--brand)}
#view-dash>.card{
  grid-column:2;
  grid-row:2;
  min-width:0;
  margin:0;
  padding:clamp(22px,2.3vw,34px);
  border-radius:15px;
  box-shadow:var(--shadow);
}
#tab-home h3:before{content:"Vue d’ensemble";display:block;margin-bottom:5px;color:var(--brand);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
#dashStats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  font-size:0;
}
#dashStats b{
  display:block;
  margin-top:8px;
  color:var(--brand-dark);
  font-size:30px;
  line-height:1.15;
}
#dashStats br{display:none}
#dashStats{color:transparent}
#dashStats b:after{display:block;color:var(--muted);font-size:11px;font-weight:650;margin-top:7px}
#dashStats b:nth-of-type(1):after{content:"Produits"}
#dashStats b:nth-of-type(2):after{content:"Commandes"}
#dashStats b:nth-of-type(3):after{content:"Conversations"}

/* Formulaires dynamiques, zones imbriquées et contenus */
#view-dash [style*="background:#111"],
#view-dash [style*="background: #111"]{
  background:#f7faf8!important;
  color:var(--ink)!important;
}
#view-dash [style*="border:1px solid #333"],
#view-dash [style*="border: 1px solid #333"]{
  border-color:var(--line)!important;
}
#view-dash [style*="border-top:1px solid #333"]{border-color:var(--line)!important}
#view-dash [style*="color:#eee"],
#view-dash [style*="color: #eee"]{color:var(--ink)!important}
#view-dash [style*="color:#888"],
#view-dash [style*="color: #888"]{color:var(--muted)!important}
#view-dash [style*="border:1px dashed #333"]{border-color:#d8e4dc!important}
#view-dash h3{scroll-margin-top:20px}
#view-dash .item [style*="background:#111"]{border:1px solid var(--line);border-radius:10px!important}
#view-dash video{display:block;max-width:100%;border-radius:12px}
#view-dash select option{background:#fff;color:var(--ink)}
#view-dash input:disabled{background:#eef2ef;color:#87938c}

/* Messages et bulles */
.msg-bubble{
  width:fit-content;
  max-width:85%;
  padding:10px 14px;
  margin:7px 0;
  border-radius:15px;
  font-size:13px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.msg-me{margin-left:auto;color:#fff;background:var(--brand);border-bottom-right-radius:5px}
.msg-them{color:var(--ink);background:#edf2ee;border:1px solid var(--line);border-bottom-left-radius:5px}
#chatBox{max-height:50vh;overflow-y:auto;padding:10px}
#view-chat{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;
  background:#f5f8f6;
}
#view-chat
.hidden{display:none!important}
#loginLogo:before{display:none}
#loginBrand{display:block;width:150px;height:auto;max-height:90px;object-fit:contain;margin:0 auto 14px}
.product-settings{border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0;background:#fbfdfb}
.product-settings>summary{cursor:pointer;font-weight:800;color:var(--brand-dark);padding:4px}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}.settings-grid label{margin:5px 0 4px}.settings-grid input,.settings-grid select{margin-bottom:5px}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chart-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;min-width:0}
.chart-card canvas{width:100%;height:220px}
@media(max-width:700px){.settings-grid,.chart-grid{grid-template-columns:1fr}}

.chat-header{
  display:flex;align-items:center;gap:12px;
  padding:14px max(18px,calc((100vw - 1100px)/2));
  background:#fff;
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 12px rgba(20,48,35,.04);
  flex-shrink:0;
}
.chat-header .ch-back{
  width:38px;height:38px;flex-shrink:0;
  display:grid;place-items:center;
  color:var(--brand-dark);background:var(--brand-soft);
  border:0;border-radius:11px;font-size:19px;
}
.chat-header .ch-ava{
  width:42px;height:42px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;background:var(--brand);
  border-radius:13px;font-size:15px;font-weight:800;overflow:hidden;
}
.chat-header .ch-ava img{width:100%;height:100%;object-fit:cover}
.chat-header .ch-title{flex:1;min-width:0;color:var(--ink);font-size:15px;font-weight:800}
.chat-header .ch-sub{color:var(--muted);font-size:11px}
.chat-body{
  flex:1;overflow-y:auto;
  width:min(100%,1100px);
  margin:0 auto;padding:24px clamp(16px,4vw,44px);
  display:flex;flex-direction:column;
}
.chat-body .msg-bubble{max-width:min(78%,680px)}
.chat-bar{
  flex-shrink:0;
  display:flex;align-items:center;gap:10px;
  padding:14px max(18px,calc((100vw - 1100px)/2)) calc(14px + env(safe-area-inset-bottom,0px));
  background:#fff;border-top:1px solid var(--line);
}
.chat-bar input{
  flex:1;min-width:0;min-height:46px;
  margin:0;padding:11px 17px;
  color:var(--ink);background:#f7faf8;
  border:1px solid var(--line);border-radius:24px;font-size:14px;
}
.chat-bar button{
  min-height:44px;padding:0 22px;
  color:#fff;background:var(--brand);border:0;border-radius:22px;
  font-size:13px;font-weight:750;
}
.chat-empty{color:var(--muted);text-align:center;font-size:13px;padding:30px 0}

/* Alertes et statuts */
.err,.ok{line-height:1.5}
#view-dash [style*="background:#FCD34D22"]{background:#fff8e8!important;border-color:#f0d9a8!important}
#view-dash [style*="background:#00A85422"]{background:var(--brand-soft)!important}
#view-dash [style*="background:#3B82F622"]{background:#edf4ff!important}
#view-dash [style*="color:#00A854"]{color:var(--brand)!important}

/* Tablettes et petits ordinateurs */
@media(max-width:1050px){
  #app.wrap{padding:22px 20px 36px}
  #view-dash{grid-template-columns:205px minmax(0,1fr);gap:0 18px}
  #view-dash>.card{padding:22px}
  .nav{padding:9px}
  .nav button{font-size:12px;padding:9px 10px}
}
@media(min-width:701px) and (max-width:900px){
  #view-dash{grid-template-columns:1fr;grid-template-areas:"shophead" "sidebar" "workspace";gap:14px}
  .nav{
    position:relative;top:auto;
    flex-direction:row;flex-wrap:nowrap;
    overflow-x:auto;scrollbar-width:thin;
    padding:8px;
  }
  .nav button{width:auto;min-width:max-content;justify-content:center;padding:10px 13px}
  .nav button:before{display:none}
  #view-dash>.card{grid-column:1;grid-row:3}
  #dashStats{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* Mobile : navigation compacte et interface tactile */
@media(max-width:700px){
  body{font-size:13px}
  #app.wrap{padding:16px 12px calc(24px + env(safe-area-inset-bottom,0px))}
  .logo{font-size:22px;margin-top:4px}
  .logo:before{width:34px;height:34px;border-radius:10px}
  .sub{font-size:10px;margin-bottom:19px}
  #view-login.card{margin:34px auto;padding:24px 20px;border-radius:18px}
  #view-login h3{font-size:20px;margin-bottom:19px}
  .card{padding:17px 15px;margin-bottom:12px;border-radius:14px}
  .card h3{font-size:17px;margin-bottom:14px}
  input,select,textarea{min-height:44px;font-size:16px;padding:11px 12px}
  button.p{min-height:45px}
  #view-dash{
    display:flex;flex-direction:column;gap:0;
    width:100%;
  }
  #view-dash>.row:first-child{
    width:100%;
    min-height:64px;
    padding:12px 13px;
    margin:0 0 12px!important;
    border-radius:12px;
  }
  #shopName{font-size:14px}
  #shopEmail{font-size:10px;overflow-wrap:anywhere}
  #btnLogout{font-size:11px;min-height:34px;padding:7px 10px}
  .nav{
    position:sticky;top:0;z-index:20;
    display:flex;flex-direction:row;flex-wrap:nowrap;
    width:calc(100% + 24px);
    margin:0 -12px 12px;
    padding:8px 12px;
    gap:6px;
    overflow-x:auto;
    overflow-y:hidden;
    background:rgba(255,255,255,.96);
    border:0;border-bottom:1px solid var(--line);
    border-radius:0;
    box-shadow:0 4px 12px rgba(20,48,35,.04);
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .nav::-webkit-scrollbar{display:none}
  .nav button{
    flex:0 0 auto;
    width:auto;min-width:max-content;
    min-height:37px;
    padding:8px 12px;
    justify-content:center;
    color:#59685f;
    background:#f4f7f5;
    border:1px solid transparent;
    border-radius:8px;
    font-size:11px;
  }
  .nav button:before{display:none}
  .nav button.on{color:#fff;background:var(--brand);box-shadow:none}
  #view-dash>.card{width:100%;padding:17px 14px;margin:0;border-radius:13px}
  #dashStats{grid-template-columns:1fr;gap:8px}
  #dashStats b{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 14px;margin:0;
    color:var(--brand-dark);background:var(--brand-pale);
    border:1px solid #e1f0e7;border-radius:10px;
    font-size:23px;
  }
  #dashStats b:after{margin:0;font-size:11px}
  #view-dash .row{gap:7px}
  #view-dash .item{padding:12px 0}
  #view-dash [style*="display:flex"]{min-width:0}
  #view-dash [style*="width:70px"]{max-width:70px}
  #view-dash .filebtn{min-height:40px}
  .img-grid .box{width:72px;height:72px}
  .chat-header{padding:10px 12px}
  .chat-body{padding:14px 12px}
  .chat-body .msg-bubble{max-width:88%}
  .chat-bar{padding:9px 10px calc(9px + env(safe-area-inset-bottom,0px))}
  .chat-bar input{font-size:16px;min-height:44px}
  .chat-bar button{min-height:42px;padding:0 15px}
}
@media(max-width:380px){
  #app.wrap{padding-left:9px;padding-right:9px}
  #view-dash>.row:first-child{gap:6px;padding:10px}
  #btnLogout{padding:6px 8px}
  .nav{width:calc(100% + 18px);margin-left:-9px;margin-right:-9px;padding-left:9px;padding-right:9px}
  #view-dash>.card{padding:14px 11px}
  .card h3{font-size:16px}
  .chat-bar button{padding:0 12px}
}
/* Respect des préférences de mouvement */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}

</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="logo" id="loginLogo"><img id="loginBrand" src="logo.png" alt="IDUS"/></div>
  <div class="sub">Espace vendeur</div>

  <!-- LOGIN -->

function fixBrokenImg(el){
  if(!el||!el.src||el.dataset.fixed)return;
  el.dataset.fixed='1';
  var src=el.src;
  fetch(src,{mode:'cors'}).then(function(r){return r.blob()}).then(function(b){
    if(!b||!b.size)return;
    var t='image/jpeg';
    if(/\.png/i.test(src))t='image/png';
    else if(/\.webp/i.test(src))t='image/webp';
    else if(/\.gif/i.test(src))t='image/gif';
    el.src=URL.createObjectURL(new Blob([b],{type:t}));
  }).catch(function(){});
}

/* ================== UPLOAD ================== */
function compressImage(file,maxW,q){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',q));
      };
      img.onerror=reject;
      img.src=r.result;
    };
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

async function uploadToR2(fileOrBlob,filename,mime){
  const user = auth.currentUser;
  if(!user) throw new Error('Connexion requise pour envoyer un fichier');

  const token = await user.getIdToken();

  const fd = new FormData();
  const f = (fileOrBlob instanceof File)
    ? fileOrBlob
    : new File([fileOrBlob],filename||'img.jpg',{
        type:mime||'image/jpeg'
      });

  fd.append('file',f,f.name);

  const res = await fetch(MEDIA_WORKER+'/upload',{
    method:'POST',
    headers:{
      Authorization:'Bearer '+token
    },
    body:fd
  });

  const data = await res.json().catch(()=>({}));

  if(!res.ok){
    throw new Error(data.error||'Erreur upload HTTP '+res.status);
  }

  if(!data.url){
    throw new Error('URL du fichier introuvable');
  }

  return data;
}

async function uploadImg(dataUrl){
  const res0 = await fetch(dataUrl);
  const blob = await res0.blob();

  const file = new File(
    [blob],
    'img_'+Date.now()+'.jpg',
    {type:'image/jpeg'}
  );

  const remote = await uploadToR2(
    file,
    file.name,
    'image/jpeg'
  );

  return remote.url;
}

async function uploadBlobFile(file,nameHint){
  if(file.type && file.type.startsWith('image/')){
    const dataUrl = await compressImage(file,480,0.45);
    return {
      url:await uploadImg(dataUrl),
      key:''
    };
  }

  const remote = await uploadToR2(
    file,
    nameHint||file.name||'file.bin',
    file.type||'video/mp4'
  );

  return {
    url:remote.url,
    key:remote.key||''
  };
}

async function uploadVideoFile(file){
  if(!file||!file.type.startsWith('video/')){
    throw new Error('Fichier video requis');
  }

  const dur = await new Promise((resolve,reject)=>{
    const v = document.createElement('video');
    v.preload = 'metadata';

    v.onloadedmetadata = ()=>{
      URL.revokeObjectURL(v.src);
      resolve(v.duration||0);
    };

    v.onerror = ()=>{
      reject(new Error('Lecture video impossible'));
    };

    v.src = URL.createObjectURL(file);
  });

  if(dur>90) throw new Error('Max 1 min 30');
  if(file.size>20*1024*1024) throw new Error('Max 20 Mo');

  const up = await uploadBlobFile(
    file,
    file.name||'video.mp4'
  );

  return {
    url:up.url,
    key:up.key||'',
    size:file.size
  };
}

async function deleteRemoteVideo(key){
  if(!key) return;

  const user = auth.currentUser;
  if(!user) throw new Error('Connexion requise');

  const token = await user.getIdToken();

  const res = await fetch(
    MEDIA_WORKER+'/video/'+encodeURIComponent(key),
    {
      method:'DELETE',
      headers:{
        Authorization:'Bearer '+token
      }
    }
  );

  const data = await res.json().catch(()=>({}));

  if(!res.ok){
    throw new Error(data.error||'Suppression vidéo impossible');
  }

  return true;
}

function renderChiffreAffaires(){
 const el=$('tab-ca');if(!el)return;
 const orders=readLocal('orders',[]).filter(o=>!['cancelled','canceled'].includes(o.status));
 const prods=new Map(readLocal('products',products||[]).map(p=>[p.id,p]));
 let ca=0,cost=0,qty=0;
 orders.forEach(o=>(o.items||[]).forEach(it=>{const n=Number(it.qty)||1,price=Number(it.price)||0,p=prods.get(it.productId||it.id)||Array.from(prods.values()).find(x=>x.name&&x.name===it.name)||{};ca+=price*n;cost+=Number(it.purchasePrice??p.purchasePrice??0)*n;qty+=n;}));
 const monthly={};orders.forEach(o=>{const d=o.createdAt&&o.createdAt.seconds?new Date(o.createdAt.seconds*1000):null;if(d){const k=d.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});monthly[k]=(monthly[k]||0)+(Number(o.total)||0);}});
 const labels=Object.keys(monthly).slice(-8),vals=labels.map(k=>monthly[k]),profit=ca-cost;
 el.innerHTML='<h3>Chiffre d’affaires</h3><p class="muted">Estimations basées sur les commandes et les prix d’achat renseignés.</p><div class="chart-grid">'
 +'<div class="chart-card"><span class="muted">Chiffre d’affaires</span><h3>'+formatPrice(ca)+' F</h3></div>'
 +'<div class="chart-card"><span class="muted">Coût d’achat estimé</span><h3>'+formatPrice(cost)+' F</h3></div>'
 +'<div class="chart-card"><span class="muted">Bénéfice brut estimé</span><h3 style="color:'+(profit>=0?'var(--brand)':'var(--danger)')+'">'+formatPrice(profit)+' F</h3></div>'
 +'<div class="chart-card"><span class="muted">Articles vendus</span><h3>'+qty+'</h3></div></div>'
 +'<div class="chart-card" style="margin-top:14px"><b>Évolution mensuelle</b><canvas id="caChart" width="900" height="260"></canvas></div>'
 +'<p class="muted" style="margin-top:10px">Le bénéfice est brut : les frais de livraison, publicité, emballage, remboursements et autres charges ne sont pas déduits. Renseigne le prix d’achat dans les fiches produits pour améliorer le calcul.</p>';
 const c=$('caChart'),ctx=c.getContext('2d'),w=c.width,h=c.height,pad=40,mx=Math.max(1,...vals);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#dce7e0';
 for(let i=0;i<5;i++){let y=pad+(h-pad*1.5)*i/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-15,y);ctx.stroke();}
 if(vals.length){ctx.strokeStyle='#087f5b';ctx.lineWidth=4;ctx.beginPath();vals.forEach((v,i)=>{let x=pad+(w-pad*1.5)*(vals.length===1?.5:i/(vals.length-1)),y=h-pad-(h-pad*1.5)*v/mx;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();vals.forEach((v,i)=>{let x=pad+(w-pad*1.5)*(vals.length===1?.5:i/(vals.length-1)),y=h-pad-(h-pad*1.5)*v/mx;ctx.fillStyle='#087f5b';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#52635a';ctx.font='14px sans-serif';ctx.fillText(labels[i],x-20,h-10);});}
 else{ctx.fillStyle='#718078';ctx.font='16px sans-serif';ctx.fillText('Aucune vente datée à afficher',pad,h/2);}
}

async function openChat(cid){
  chatCurrentConvId=cid;
  const view=$('view-chat');
  const body=$('chatBody');
  const title=$('chatTitle');
  const sub=$('chatSub');
  const ava=$('chatAva');

  // Affichage immédiat de l'historique déjà consulté sur cet appareil.
  let cachedChat=[];try{cachedChat=JSON.parse(localStorage.getItem('idus_chat_'+cid)||'[]');}catch(e){}
  body.innerHTML=cachedChat.length?cachedChat.map(m=>{
    if(m.productCard){const pc=m.productCard||{};return '<div class="msg-bubble '+(m.from==='boutique'?'msg-me':'msg-them')+'">📦 '+esc(pc.name||'Produit')+' · '+formatPrice(pc.price||0)+' F</div>';}
    return '<div class="msg-bubble '+(m.from==='boutique'?'msg-me':'msg-them')+'">'+esc(m.text||'')+'</div>';
  }).join(''):'<div class="chat-empty">Chargement…</div>';
  title.textContent='Client';
  sub.textContent='';
  ava.textContent='C';
  ava.innerHTML='C';
  view.classList.remove('hidden');

  // Charge les infos de la conversation
  try{
    const cdoc=await getDoc(doc(db,'conversations',cid));
    if(cdoc.exists()){
      const c=cdoc.data();
      const nm=c.customerName||c.customerEmail||'Client';
      title.textContent=nm;
      sub.textContent=c.customerEmail||'';
      const initials=nm.charAt(0).toUpperCase();
      ava.innerHTML=esc(initials);
    }
  }catch(e){}

  // Si un ancien onSnapshot traîne, on le coupe
  if(unsubChat){try{unsubChat();}catch(e){}unsubChat=null;}

  // Écoute en temps réel
  // Écoute en temps réel
  unsubChat=onSnapshot(
    query(collection(db,'conversations',cid,'messages'),orderBy('createdAt','asc')),
    snap=>{
      if(chatCurrentConvId!==cid)return; // sécurité si l'utilisateur a changé de chat
      const cachedMessages=snap.docs.map(d=>({id:d.id,...d.data()}));
      try{localStorage.setItem('idus_chat_'+cid,JSON.stringify(cachedMessages));}catch(e){}
      if(snap.empty){
        body.innerHTML='<div class="chat-empty">Aucun message pour le moment.</div>';
        return;
      }
      body.innerHTML=snap.docs.map(d=>{
        const m=d.data();
        const me=m.from==='boutique';

        // === CAS 1 : message avec cadre produit ===
        if(m.productCard){
          const pc=m.productCard;
          const img=pc.image||'';
          const name=pc.name||'';
          const desc=pc.desc||'';
          const price=pc.price||0;
          const pid=pc.productId||pc.id||'';
          return '<div style="text-align:'+(me?'right':'left')+';margin:8px 0">'
            +'<div class="chat-prod-card" data-pid="'+esc(pid)+'" style="display:inline-block;width:200px;background:#111;border:2px solid #00A854;border-radius:12px;overflow:hidden;text-align:left;cursor:pointer">'
            +(img?'<img src="'+esc(img)+'" style="width:100%;aspect-ratio:1;object-fit:cover;background:#222;display:block" onerror="fixBrokenImg(this)"/>':'<div style="width:100%;aspect-ratio:1;background:#222"></div>')
            +'<div style="padding:8px 10px 10px">'
            +'<div style="font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(name)+'</div>'
            +(desc?'<div style="font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">'+esc(desc)+'</div>':'')
            +'<div style="font-size:14px;font-weight:800;color:#E02E24;margin-top:6px">'+formatPrice(price)+' F</div>'
            +'<div style="font-size:10px;color:#00A854;margin-top:4px;font-weight:700">Voir le produit ›</div>'
            +'</div></div></div>';
        }

        // === CAS 2 : message texte normal ===
        if(!m.text)return'';
        return '<div class="msg-bubble '+(me?'msg-me':'msg-them')+'">'+esc(m.text||'')+'</div>';
      }).join('');

      // === Attache les clics sur les cadres produit ===
      body.querySelectorAll('.chat-prod-card').forEach(card=>{
        card.addEventListener('click',()=>{
          const pid=card.getAttribute('data-pid');
          if(pid)openProductFromChat(pid);
        });
      });

      body.scrollTop=body.scrollHeight;
    },
    err=>{
      body.innerHTML='<div class="chat-empty" style="color:#ef4444">'+esc(err.message)+'</div>';
    }
  );

  // Envoi
  $('chatSendBtn').onclick=async()=>{
    const input=$('chatInput');
    const text=input.value.trim();
    if(!text||!chatCurrentConvId)return;
    input.value='';
    try{
      await addDoc(collection(db,'conversations',chatCurrentConvId,'messages'),{
        from:'boutique',
        text,
        createdAt:serverTimestamp()
      });
      await updateDoc(doc(db,'conversations',chatCurrentConvId),{
        lastMessage:text,
        updatedAt:serverTimestamp()
      });
    }catch(e){alert(e.message);}
  };

  // Entrée = envoyer
  $('chatInput').onkeydown=(e)=>{
    if(e.key==='Enter'){e.preventDefault();$('chatSendBtn').click();}
  };

  // focus input
  setTimeout(()=>{const i=$('chatInput');if(i)i.focus();},100);
}

async function saveTrackingStatusAndNotify(orderId, newStatus, extraData, eventInfo){
  const orderRef = doc(db, 'orders', orderId);
  const notificationRef = doc(collection(db, 'notifications'));
  const eventRef = doc(collection(db, 'orders', orderId, 'trackingEvents'));

  let notificationCreated = false;

  await runTransaction(db, async function(tx){
    const snap = await tx.get(orderRef);

    if(!snap.exists()){
      throw new Error('Commande introuvable');
    }

    const order = snap.data();

    // Vérification de propriété de la commande
    if(order.boutiqueId !== boutiqueId){
      throw new Error('Cette commande ne dépend pas de votre boutique');
    }

    const previousStatus = order.trackingStatus || '';
    const changed = !!newStatus && newStatus !== previousStatus;

    // Mise à jour des informations de suivi
    tx.update(orderRef, Object.assign({}, extraData || {}, {
      trackingStatus: newStatus || previousStatus,
      updatedAt: serverTimestamp()
    }));

    if(changed){
      if(!order.userId){
        throw new Error('Cette commande ne possède pas de compte client associé');
      }

    const message = 'Votre commande est maintenant : ' + newStatus;

      // Historique de suivi
      tx.set(eventRef, {
        status: newStatus,
        previousStatus: previousStatus,
        location: (eventInfo && eventInfo.location) || '',
        description: (eventInfo && eventInfo.description) ||
          'Mise à jour du statut par la boutique',
        timestamp: serverTimestamp()
      });

      // Notification individuelle du client
      tx.set(notificationRef, {
        userId: order.userId,
        orderId: orderId,
        orderNumber: order.orderNumber || orderId,
        boutiqueId: boutiqueId,
        boutiqueName: boutique.name || order.boutiqueName || 'Boutique',
        type: 'tracking_status',
        title: order.orderNumber || orderId,
        message: message,
        previousStatus: previousStatus,
        status: newStatus,
        read: false,
        createdAt: serverTimestamp()
      });

      notificationCreated = true;

    }else if(eventInfo && (eventInfo.location || eventInfo.description)){
      // Un complément d'information sans changement de statut
      // peut être conservé dans l'historique, sans notification.
      tx.set(eventRef, {
        status: newStatus || previousStatus,
        location: eventInfo.location || '',
        description: eventInfo.description || '',
        timestamp: serverTimestamp()
      });
    }
  });

  return notificationCreated;
}

  'Commande confirmée',
  'En préparation',
  'Emballée',
  'Expédiée',
  'En transit',
  'Arrivée au pays de destination',
  'En cours de dédouanement',
  'Dédouanée',
  'Arrivée au centre de tri local',
  'En cours de livraison',
  'Arrivée au point relais',
  'Livrée',
  'Retournée',
  'Annulée'
];

async function generateTrackingOrderNumber(){
  // 8 chiffres aléatoires, sans suite logique, jamais 2 fois le même
  for(let i=0;i<10;i++){
    let num='';
    for(let j=0;j<8;j++)num+=Math.floor(Math.random()*10);
    if(num[0]==='0')num='1'+num.slice(1); // évite de commencer par 0
    const full='IDA'+num;
    try{
      const s=await getDocs(query(collection(db,'orders'),where('trackingOrderNumber','==',full)));
      if(s.empty)return full;
    }catch(e){return full;}
  }
  return 'IDA'+Date.now().toString().slice(-8);
}

async function renderSuivi(){
  const el=$('tab-suivi');
  el.innerHTML='<h3>Suivi livraison</h3><p class="muted" style="margin-bottom:12px">Gérez le suivi de chaque commande.</p><div id="suiviList"><p class="muted">Chargement…</p></div>';
  try{
    const s=await getDocs(query(collection(db,'orders'),where('boutiqueId','==',boutiqueId)));
    const list=s.docs.map(d=>({id:d.id,...d.data()}));writeLocal('orders',list);
    list.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
    if(!list.length){$('suiviList').innerHTML='<p class="muted">Aucune commande</p>';return;}
    $('suiviList').innerHTML=list.map(o=>{
      const num=o.trackingOrderNumber||'— non configuré —';
      const carrier=o.carrier||'—';
      const status=o.trackingStatus||'—';
      return '<div class="item" style="padding:12px 0">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
          +'<b style="font-size:13px">'+esc(o.orderNumber||o.id)+'</b>'
          +'<button type="button" class="s" data-track="'+o.id+'">Configurer</button>'
        +'</div>'
        +'<div class="muted" style="font-size:11px;line-height:1.6">'
          +'📦 Suivi : <b style="color:#00A854">'+esc(num)+'</b><br/>'
          +'🚚 Transporteur : '+esc(carrier)+'<br/>'
          +'📍 Statut : '+esc(status)
        +'</div></div>';
    }).join('');
    el.querySelectorAll('[data-track]').forEach(b=>b.addEventListener('click',()=>openSuiviForm(b.getAttribute('data-track'))));
  }catch(e){$('suiviList').innerHTML='<span class="err">'+esc(e.message)+'</span>';}
}

async function openSuiviForm(orderId){
  const el=$('tab-suivi');
  try{
    const s=await getDoc(doc(db,'orders',orderId));
    if(!s.exists()){alert('Commande introuvable');return;}
    const o={id:s.id,...s.data()};

    // Charge les événements existants
    let events=[];
    try{
      const evs=await getDocs(query(collection(db,'orders',orderId,'trackingEvents'),orderBy('timestamp','desc')));
      events=evs.docs.map(d=>({id:d.id,...d.data()}));
    }catch(e){}

    const curCarrier=o.carrier||'';
    const curStatus=o.trackingStatus||'';
    const curTracking=o.trackingNumber||'';
    const curAddr=o.trackingAddress||((o.customer&&o.customer.address)||'');
    const curRecipient=o.trackingRecipient||((o.customer&&o.customer.name)||'');
    const curNum=o.trackingOrderNumber||'';

    el.innerHTML='<h3>Suivi — '+esc(o.orderNumber||o.id)+'</h3>'
      +'<button type="button" class="s" id="btnSuiviBack">← Retour</button>'
      +'<div style="margin-top:12px;background:#111;padding:12px;border-radius:8px">'
        +'<label>Numéro de suivi IDA</label>'
        +'<input id="sfNum" value="'+esc(curNum)+'" readonly placeholder="Sera généré automatiquement"/>'
        +'<label>Transporteur</label>'
        +'<select id="sfCarrier">'
          +'<option value="">—</option>'
          +CARRIERS_LIST.map(c=>'<option value="'+c+'" '+(curCarrier===c?'selected':'')+'>'+c+'</option>').join('')
        +'</select>'
        +'<label>Numéro de tracking transporteur</label>'
        +'<input id="sfTracking" value="'+esc(curTracking)+'" placeholder="Ex: 777465753021102"/>'
        +'<label>Statut actuel</label>'
        +'<select id="sfStatus">'
          +'<option value="">—</option>'
          +TRACKING_STATUSES.map(st=>'<option value="'+st+'" '+(curStatus===st?'selected':'')+'>'+st+'</option>').join('')
        +'</select>'
        +'<label>Adresse de livraison finale</label>'
        +'<textarea id="sfAddr" rows="2">'+esc(curAddr)+'</textarea>'
        +'<label>Destinataire</label>'
        +'<input id="sfRecipient" value="'+esc(curRecipient)+'"/>'
        +'<button type="button" class="p" id="btnSaveSuivi">Enregistrer les infos</button>'
      +'</div>'
      +'<div style="margin-top:16px">'
        +'<h3 style="font-size:13px">Événements chronologiques</h3>'
        +'<p class="muted" style="font-size:11px;margin-bottom:8px">Choisissez un statut : la date/heure est enregistrée automatiquement.</p>'
        +'<select id="sfEvtStatus">'
          +TRACKING_STATUSES.map(st=>'<option value="'+st+'">'+st+'</option>').join('')
        +'</select>'
        +'<input id="sfEvtLoc" placeholder="Lieu (optionnel) — ex: Kunming, Chine"/>'
        +'<input id="sfEvtDesc" placeholder="Description (optionnel)"/>'
        +'<button type="button" class="p" id="btnAddEvt">+ Ajouter l\'événement</button>'
      +'</div>'
      +'<div id="sfEvtList" style="margin-top:12px"></div>';

    $('btnSuiviBack').addEventListener('click',()=>renderSuivi());

    // Afficher les événements (plus récent en haut)
    function paintEvents(){
      const box=$('sfEvtList');
      if(!events.length){box.innerHTML='<p class="muted">Aucun événement</p>';return;}
      box.innerHTML=events.map(ev=>{
        const d=ev.timestamp&&ev.timestamp.seconds?new Date(ev.timestamp.seconds*1000):null;
        const dateStr=d?d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
        return '<div class="item" style="display:flex;gap:10px;align-items:flex-start">'
          +'<div style="width:8px;height:8px;flex-shrink:0;border-radius:50%;background:#00A854;margin-top:6px"></div>'
          +'<div style="flex:1"><b style="font-size:12px">'+esc(ev.status||'')+'</b>'
            +'<div class="muted" style="font-size:11px">'+dateStr+(ev.location?' · '+esc(ev.location):'')+'</div>'
            +(ev.description?'<div style="font-size:12px">'+esc(ev.description)+'</div>':'')
          +'</div>'
          +'<button type="button" class="s d" data-delve="'+ev.id+'">×</button>'
        +'</div>';
      }).join('');
      box.querySelectorAll('[data-delve]').forEach(b=>{
        b.addEventListener('click',async()=>{
          if(!confirm('Supprimer cet événement ?'))return;
          try{
            await deleteDoc(doc(db,'orders',orderId,'trackingEvents',b.getAttribute('data-delve')));
            events=events.filter(e=>e.id!==b.getAttribute('data-delve'));
            paintEvents();
          }catch(e){alert(e.message);}
        });
      });
    }
    paintEvents();

    // Enregistrer les infos principales
 
$('btnSaveSuivi').addEventListener('click',async()=>{

  let num=$('sfNum').value.trim();

  if(!num){
    num=await generateTrackingOrderNumber();
  }

  const data={
    trackingOrderNumber:num,
    carrier:$('sfCarrier').value||'',
    trackingNumber:$('sfTracking').value.trim(),
    trackingAddress:$('sfAddr').value.trim(),
    trackingRecipient:$('sfRecipient').value.trim()
  };

  const newStatus=$('sfStatus').value||'';

  try{

    await saveTrackingStatusAndNotify(
      orderId,
      newStatus,
      data,
      {
        description:'Statut mis à jour par la boutique'
      }
    );

    $('sfNum').value=num;

    alert('Suivi enregistré et notification traitée ✅');

  }catch(e){
    alert(e.message);
  }

});


    // Ajouter un événement
  
$('btnAddEvt').addEventListener('click',async()=>{

  const st=$('sfEvtStatus').value;
  const location=$('sfEvtLoc').value.trim();
  const description=$('sfEvtDesc').value.trim();

  if(!st){
    alert('Choisis un statut');
    return;
  }

  try{

    await saveTrackingStatusAndNotify(
      orderId,
      st,
      {},
      {
        location:location,
        description:description || 'Mise à jour du suivi',
        forceEvent:true
      }
    );

    // Recharge les événements depuis Firestore
    const evs=await getDocs(
      query(
        collection(db,'orders',orderId,'trackingEvents'),
        orderBy('timestamp','desc')
      )
    );

    events=evs.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    $('sfEvtLoc').value='';
    $('sfEvtDesc').value='';

    paintEvents();

    alert('Événement enregistré ✅');

  }catch(e){
    alert(e.message);
  }

});

  }catch(e){
    alert('Erreur ouverture du suivi : '+e.message);
  }
}

/* ================== AUTH STATE ================== */  
onAuthStateChanged(auth,async(u)=>{
  if(!u){showLogin();return;}
  if(!u.emailVerified){showLogin();return;}
  const email=(u.email||'').toLowerCase().trim();
  let cached=null;try{cached=JSON.parse(localStorage.getItem('idus_boutique_email_'+email)||'null');}catch(e){}
  if(cached&&cached.id){
    boutique=cached;boutiqueId=cached.id;enterDash();
  }
  try{
    const fresh=await findBoutiqueByEmail(email);
    if(!fresh){if(!cached)showLogin();return;}
    boutique=fresh;boutiqueId=fresh.id;
    try{localStorage.setItem('idus_boutique_'+fresh.id,JSON.stringify(fresh));localStorage.setItem('idus_boutique_email_'+email,JSON.stringify(fresh));}catch(e){}
    if(!cached)enterDash();else{$('shopName').textContent=fresh.name||'Boutique';}
  }catch(e){if(!cached)showLogin();}
});
