name: Restore full admin.html
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write complete admin.html
        run: |
          python3 - <<'EOF'
          import base64
          from pathlib import Path
          b64 = open('.github/workflows/admin-payload.b64').read().strip() if False else '''PLACEHOLDER_B64'''
          Path('admin.html').write_bytes(base64.b64decode(b64))
          print('written', Path('admin.html').stat().st_size)
          EOF
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add admin.html
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m 'Restore COMPLETE admin.html with login + all panels'
          git push
