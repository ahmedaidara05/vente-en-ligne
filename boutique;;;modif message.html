<style>
:root{--g:#00A854;--bg:#0f0f1a;--card:#1a1a2e;--text:#eee;--muted:#888;--danger:#ef4444;--border:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.logo{text-align:center;font-size:28px;font-weight:800;color:var(--g);margin:24px 0 8px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.card{background:var(--card);padding:16px;border-radius:12px;margin-bottom:12px}
.card h3{color:var(--g);margin-bottom:12px;font-size:15px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:12px;margin-bottom:10px;border-radius:8px;border:1px solid var(--border);background:#111;color:#fff;font-size:14px}
button.p{width:100%;padding:12px;background:var(--g);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:4px}
button.s{padding:8px 12px;background:#222;color:#fff;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;margin:2px}
button.d{color:var(--danger);border-color:var(--danger)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.nav button{flex:1;min-width:70px;padding:10px 6px;background:var(--card);color:#fff;border:none;border-radius:8px;font-size:11px;cursor:pointer}
.nav button.on{background:var(--g)}
.item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.err{color:var(--danger);font-size:13px;margin:8px 0}
.ok{color:var(--g);font-size:13px}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#222}
.filebtn{display:inline-block;padding:10px 14px;background:var(--g);color:#fff;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.filebtn input{display:none}
.hidden{display:none!important}
.msg-bubble{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:85%;font-size:13px;word-wrap:break-word}
.msg-me{background:var(--g);margin-left:auto;color:#fff}
.msg-them{background:#333;color:#eee}
#chatBox{max-height:50vh;overflow-y:auto;padding:8px}
.img-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.img-grid .box{width:72px;height:72px;border-radius:8px;overflow:hidden;position:relative;background:#222;border:1px solid var(--border)}
.img-grid .box img{width:100%;height:100%;object-fit:cover}
.img-grid .box .rm{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer}

/* === CHAT PLEIN ÉCRAN (page séparée) === */
#view-chat{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  display:flex;flex-direction:column;
}
#view-chat.hidden{display:none!important}
.chat-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.chat-header .ch-back{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:#222;color:#fff;border:1px solid var(--border);
  border-radius:50%;font-size:18px;cursor:pointer;
}
.chat-header .ch-ava{
  width:38px;height:38px;flex-shrink:0;border-radius:50%;

  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;overflow:hidden;
}
.chat-header .ch-ava img{width:100%;height:100%;object-fit:cover}
.chat-header .ch-title{

}
.chat-header .ch-sub{

.chat-body{
  flex:1;overflow-y:auto;
  padding:14px;
  display:flex;flex-direction:column;
}
.chat-body .msg-bubble{max-width:80%}
.chat-bar{
  flex-shrink:0;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--card);
  border-top:1px solid var(--border);
  display:flex;gap:8px;align-items:center;
}
.chat-bar input{
  flex:1;margin:0;
  padding:10px 14px;
  border-radius:20px;
  background:#111;
  border:1px solid var(--border);
  color:#fff;font-size:14px;

.chat-bar button{
  height:40px;padding:0 18px;
  background:var(--g);color:#fff;border:none;
  border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;
}
.chat-empty{
  color:var(--muted);text-align:center;
  font-size:13px;padding:20px 0;
}
</style>

function fixBrokenImg(el){
  if(!el||!el.src||el.dataset.fixed)return;
  el.dataset.fixed='1';
  var src=el.src;
  fetch(src,{mode:'cors'}).then(function(r){return r.blob()}).then(function(b){
    if(!b||!b.size)return;
    var t='image/jpeg';
    if(/\.png/i.test(src))t='image/png';
    else if(/\.webp/i.test(src))t='image/webp';
    else if(/\.gif/i.test(src))t='image/gif';
    el.src=URL.createObjectURL(new Blob([b],{type:t}));
  }).catch(function(){});
}

  var t=e.target;
  if(t&&t.tagName==='IMG')fixBrokenImg(t);
},true);

/* ================== UPLOAD ================== */
function compressImage(file,maxW,q){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',q));
      };
      img.onerror=reject;
      img.src=r.result;
    };
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
async function uploadToR2(fileOrBlob,filename,mime){
  try{
    const fd=new FormData();
    const f=(fileOrBlob instanceof File)?fileOrBlob:new File([fileOrBlob],filename||'img.jpg',{type:mime||'image/jpeg'});
    fd.append('file',f,f.name);
    const res=await fetch(MEDIA_WORKER+'/upload',{method:'POST',body:fd});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!data.url)throw new Error('no url');
    return data.url;
  }catch(e){return null;}
}
async function uploadImg(dataUrl){
  const res0=await fetch(dataUrl);
  const blob=await res0.blob();
  const file=new File([blob],'img_'+Date.now()+'.jpg',{type:'image/jpeg'});
  const remote=await uploadToR2(file, file.name, 'image/jpeg');
  if(!remote) throw new Error('Upload R2 échoué — réessaie');
  return remote;
}
async function uploadBlobFile(file,nameHint){
  if(file.type&&file.type.startsWith('image/')){
    const dataUrl=await compressImage(file,480,0.45);
    return {url:await uploadImg(dataUrl),key:''};
  }
  const remote=await uploadToR2(file,nameHint||file.name||'file.bin',file.type||'video/mp4');
  if(remote)return{url:remote,key:''};
  throw new Error('Upload échoué');
}
async function uploadVideoFile(file){
  if(!file||!file.type.startsWith('video/'))throw new Error('Fichier video requis');
  const dur=await new Promise((resolve,reject)=>{
    const v=document.createElement('video');
    v.preload='metadata';
    v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);resolve(v.duration||0);};
    v.onerror=()=>reject(new Error('Lecture video impossible'));
    v.src=URL.createObjectURL(file);
  });
  if(dur>90)throw new Error('Max 1 min 30');
  if(file.size>20*1024*1024)throw new Error('Max 20 Mo');
  const up=await uploadBlobFile(file,file.name||'video.mp4');
  return {url:up.url,key:up.key||'',size:file.size};
}
async function deleteRemoteVideo(key){
  if(!key)return;
  try{await fetch(MEDIA_WORKER+'/file/'+encodeURIComponent(key),{method:'DELETE'});}catch(e){}
  try{await fetch(MEDIA_WORKER+'/video/'+encodeURIComponent(key),{method:'DELETE'});}catch(e){}
}

function openProdForm(id){

  const el=$('tab-produits');
  const delivs=['Moins de 24h','2 jours','3 jours','5 jours','2 semaines','3 semaines','1 mois','2 mois','3 mois'];

  // === Valeurs par défaut transport ===
  var tMode = (p&&p.transportMode)||'avion';
  var avionPaid = (p&&p.avionPaid===true);
  var bateauPaid = (p&&p.bateauPaid===true);
  var avionFee = (p&&p.avionFee)||0;
  var bateauFee = (p&&p.bateauFee)||0;

  el.innerHTML='<h3>'+(p?'Modifier':'Nouveau')+' produit</h3>'

      pickupToHomeFee:pickupToHomePaid?(parseFloat($('pPickupFee').value)||0):0,

async function renderCommandes(){
  const el=$('tab-commandes');

    const s=await getDocs(query(collection(db,'orders'),where('boutiqueId','==',boutiqueId)));
    const list=s.docs.map(d=>({id:d.id,...d.data()}));
    list.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
    if(!list.length){$('ordList').innerHTML='<p class="muted">Aucune commande</p>';return;}

    $('ordList').innerHTML=list.map(o=>{
      const date=o.createdAt&&o.createdAt.seconds
        ?new Date(o.createdAt.seconds*1000).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})
        :'—';
      const c=o.customer||{};
      const items=(o.items||[]).map(it=>{
        const v=Object.keys(it.variants||{}).map(k=>k+': '+it.variants[k]).join(', ');
        return '<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #333">'
          +(it.image?'<img src="'+esc(it.image)+'" style="width:38px;height:38px;object-fit:cover;border-radius:6px;background:#222" onerror="fixBrokenImg(this)"/>':'')
          +'<div style="flex:1;min-width:0"><b style="font-size:12px">'+esc(it.name||'')+'</b>'
          +(v?'<br/><span class="muted" style="font-size:11px">'+esc(v)+'</span>':'')
          +'<br/><span style="color:#E02E24;font-size:11px;font-weight:700">'+formatPrice(it.price)+' F × '+(it.qty||1)+'</span></div>'
        +'</div>';
      }).join('');
      const statusColors={pending:'#FCD34D',paid:'#00A854',shipped:'#3B82F6',cancelled:'#EF4444'};
      const statusLabels={pending:'En attente',paid:'Payée',shipped:'Expédiée',cancelled:'Annulée'};
      const stColor=statusColors[o.status]||'#888';
      const stLabel=statusLabels[o.status]||o.status||'—';

      return '<div class="item" style="padding:12px 0">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
          +'<b style="font-size:13px">'+esc(o.orderNumber||o.id)+'</b>'
          +'<span style="font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:'+stColor+'22;color:'+stColor+'">'+esc(stLabel)+'</span>'
        +'</div>'
        +'<div class="muted" style="font-size:11px;margin-bottom:8px">'+date+'</div>'

async function openChat(cid){
  chatCurrentConvId=cid;
  const view=$('view-chat');
  const body=$('chatBody');
  const title=$('chatTitle');
  const sub=$('chatSub');
  const ava=$('chatAva');

  // reset UI
  body.innerHTML='<div class="chat-empty">Chargement…</div>';
  title.textContent='Client';
  sub.textContent='';
  ava.textContent='C';
  ava.innerHTML='C';
  view.classList.remove('hidden');

  // Charge les infos de la conversation
  try{
    const cdoc=await getDoc(doc(db,'conversations',cid));
    if(cdoc.exists()){
      const c=cdoc.data();
      const nm=c.customerName||c.customerEmail||'Client';
      title.textContent=nm;
      sub.textContent=c.customerEmail||'';
      const initials=nm.charAt(0).toUpperCase();
      ava.innerHTML=esc(initials);
    }
  }catch(e){}

  // Si un ancien onSnapshot traîne, on le coupe
  if(unsubChat){try{unsubChat();}catch(e){}unsubChat=null;}

  // Écoute en temps réel
  // Écoute en temps réel
  unsubChat=onSnapshot(
    query(collection(db,'conversations',cid,'messages'),orderBy('createdAt','asc')),
    snap=>{
      if(chatCurrentConvId!==cid)return; // sécurité si l'utilisateur a changé de chat
      if(snap.empty){
        body.innerHTML='<div class="chat-empty">Aucun message pour le moment.</div>';
        return;
      }
      body.innerHTML=snap.docs.map(d=>{
        const m=d.data();
        const me=m.from==='boutique';

        // === CAS 1 : message avec cadre produit ===
        if(m.productCard){
          const pc=m.productCard;
          const img=pc.image||'';
          const name=pc.name||'';
          const desc=pc.desc||'';
          const price=pc.price||0;
          const pid=pc.productId||pc.id||'';
          return '<div style="text-align:'+(me?'right':'left')+';margin:8px 0">'
            +'<div class="chat-prod-card" data-pid="'+esc(pid)+'" style="display:inline-block;width:200px;background:#111;border:2px solid #00A854;border-radius:12px;overflow:hidden;text-align:left;cursor:pointer">'
            +(img?'<img src="'+esc(img)+'" style="width:100%;aspect-ratio:1;object-fit:cover;background:#222;display:block" onerror="fixBrokenImg(this)"/>':'<div style="width:100%;aspect-ratio:1;background:#222"></div>')
            +'<div style="padding:8px 10px 10px">'
            +'<div style="font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(name)+'</div>'
            +(desc?'<div style="font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">'+esc(desc)+'</div>':'')
            +'<div style="font-size:14px;font-weight:800;color:#E02E24;margin-top:6px">'+formatPrice(price)+' F</div>'
            +'<div style="font-size:10px;color:#00A854;margin-top:4px;font-weight:700">Voir le produit ›</div>'
            +'</div></div></div>';
        }

        // === CAS 2 : message texte normal ===
        if(!m.text)return'';
        return '<div class="msg-bubble '+(me?'msg-me':'msg-them')+'">'+esc(m.text||'')+'</div>';
      }).join('');

      // === Attache les clics sur les cadres produit ===
      body.querySelectorAll('.chat-prod-card').forEach(card=>{
        card.addEventListener('click',()=>{
          const pid=card.getAttribute('data-pid');
          if(pid)openProductFromChat(pid);
        });
      });

      body.scrollTop=body.scrollHeight;
    },
    err=>{
      body.innerHTML='<div class="chat-empty" style="color:#ef4444">'+esc(err.message)+'</div>';
    }
  );

  // Envoi
  $('chatSendBtn').onclick=async()=>{
    const input=$('chatInput');
    const text=input.value.trim();
    if(!text||!chatCurrentConvId)return;
    input.value='';
    try{
      await addDoc(collection(db,'conversations',chatCurrentConvId,'messages'),{
        from:'boutique',
        text,
        createdAt:serverTimestamp()
      });
      await updateDoc(doc(db,'conversations',chatCurrentConvId),{
        lastMessage:text,
        updatedAt:serverTimestamp()
      });
    }catch(e){alert(e.message);}
  };

  // Entrée = envoyer
  $('chatInput').onkeydown=(e)=>{
    if(e.key==='Enter'){e.preventDefault();$('chatSendBtn').click();}
  };

  // focus input
  setTimeout(()=>{const i=$('chatInput');if(i)i.focus();},100);
}

const CARRIERS_LIST=['DHL','FedEx','UPS','STO Express','La Poste','China Post','Cainiao','Colis Privé','SF Express','YunExpress','4PX','Autre'];

async function saveTrackingStatusAndNotify(orderId, newStatus, extraData, eventInfo){
  const orderRef = doc(db, 'orders', orderId);
  const notificationRef = doc(collection(db, 'notifications'));
  const eventRef = doc(collection(db, 'orders', orderId, 'trackingEvents'));

  let notificationCreated = false;

  await runTransaction(db, async function(tx){
    const snap = await tx.get(orderRef);

    if(!snap.exists()){
      throw new Error('Commande introuvable');
    }

    const order = snap.data();

    // Vérification de propriété de la commande
    if(order.boutiqueId !== boutiqueId){
      throw new Error('Cette commande ne dépend pas de votre boutique');
    }

    const previousStatus = order.trackingStatus || '';
    const changed = !!newStatus && newStatus !== previousStatus;

    // Mise à jour des informations de suivi
    tx.update(orderRef, Object.assign({}, extraData || {}, {
      trackingStatus: newStatus || previousStatus,
      updatedAt: serverTimestamp()
    }));

    if(changed){
      if(!order.userId){
        throw new Error('Cette commande ne possède pas de compte client associé');
      }

      const message = 'Votre commande ' +
        (order.orderNumber || orderId) +
        ' est maintenant : ' + newStatus;

      // Historique de suivi
      tx.set(eventRef, {
        status: newStatus,
        previousStatus: previousStatus,
        location: (eventInfo && eventInfo.location) || '',
        description: (eventInfo && eventInfo.description) ||
          'Mise à jour du statut par la boutique',
        timestamp: serverTimestamp()
      });

      // Notification individuelle du client
      tx.set(notificationRef, {
        userId: order.userId,
        orderId: orderId,
        orderNumber: order.orderNumber || orderId,
        boutiqueId: boutiqueId,
        boutiqueName: boutique.name || order.boutiqueName || 'Boutique',
        type: 'tracking_status',
        title: 'Mise à jour de votre commande',
        message: message,
        previousStatus: previousStatus,
        status: newStatus,
        read: false,
        createdAt: serverTimestamp()
      });

      notificationCreated = true;

    }else if(eventInfo && (eventInfo.location || eventInfo.description)){
      // Un complément d'information sans changement de statut
      // peut être conservé dans l'historique, sans notification.
      tx.set(eventRef, {
        status: newStatus || previousStatus,
        location: eventInfo.location || '',
        description: eventInfo.description || '',
        timestamp: serverTimestamp()
      });
    }
  });

  return notificationCreated;
}

async function generateTrackingOrderNumber(){
  // 8 chiffres aléatoires, sans suite logique, jamais 2 fois le même
  for(let i=0;i<10;i++){
    let num='';
    for(let j=0;j<8;j++)num+=Math.floor(Math.random()*10);
    if(num[0]==='0')num='1'+num.slice(1); // évite de commencer par 0
    const full='IDA'+num;
    try{
      const s=await getDocs(query(collection(db,'orders'),where('trackingOrderNumber','==',full)));
      if(s.empty)return full;
    }catch(e){return full;}
  }
  return 'IDA'+Date.now().toString().slice(-8);
}

      +'<div style="margin-top:16px">'
        +'<h3 style="font-size:13px">Événements chronologiques</h3>'
        +'<p class="muted" style="font-size:11px;margin-bottom:8px">Choisissez un statut : la date/heure est enregistrée automatiquement.</p>'
        +'<select id="sfEvtStatus">'
          +TRACKING_STATUSES.map(st=>'<option value="'+st+'">'+st+'</option>').join('')
        +'</select>'
        +'<input id="sfEvtLoc" placeholder="Lieu (optionnel) — ex: Kunming, Chine"/>'
        +'<input id="sfEvtDesc" placeholder="Description (optionnel)"/>'
        +'<button type="button" class="p" id="btnAddEvt">+ Ajouter l\'événement</button>'
      +'</div>'
      +'<div id="sfEvtList" style="margin-top:12px"></div>';

    $('btnSuiviBack').addEventListener('click',()=>renderSuivi());

    // Afficher les événements (plus récent en haut)
    function paintEvents(){
      const box=$('sfEvtList');
      if(!events.length){box.innerHTML='<p class="muted">Aucun événement</p>';return;}
      box.innerHTML=events.map(ev=>{
        const d=ev.timestamp&&ev.timestamp.seconds?new Date(ev.timestamp.seconds*1000):null;
        const dateStr=d?d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
        return '<div class="item" style="display:flex;gap:10px;align-items:flex-start">'
          +'<div style="width:8px;height:8px;flex-shrink:0;border-radius:50%;background:#00A854;margin-top:6px"></div>'
          +'<div style="flex:1"><b style="font-size:12px">'+esc(ev.status||'')+'</b>'
            +'<div class="muted" style="font-size:11px">'+dateStr+(ev.location?' · '+esc(ev.location):'')+'</div>'
            +(ev.description?'<div style="font-size:12px">'+esc(ev.description)+'</div>':'')
          +'</div>'
          +'<button type="button" class="s d" data-delve="'+ev.id+'">×</button>'
        +'</div>';
      }).join('');
      box.querySelectorAll('[data-delve]').forEach(b=>{
        b.addEventListener('click',async()=>{
          if(!confirm('Supprimer cet événement ?'))return;
          try{
            await deleteDoc(doc(db,'orders',orderId,'trackingEvents',b.getAttribute('data-delve')));
            events=events.filter(e=>e.id!==b.getAttribute('data-delve'));
            paintEvents();
          }catch(e){alert(e.message);}
        });
      });
    }
    paintEvents();

    // Enregistrer les infos principales
 
$('btnSaveSuivi').addEventListener('click',async()=>{

  let num=$('sfNum').value.trim();

  if(!num){
    num=await generateTrackingOrderNumber();
  }

  const data={
    trackingOrderNumber:num,
    carrier:$('sfCarrier').value||'',
    trackingNumber:$('sfTracking').value.trim(),
    trackingAddress:$('sfAddr').value.trim(),
    trackingRecipient:$('sfRecipient').value.trim()
  };

  const newStatus=$('sfStatus').value||'';

  try{

    await saveTrackingStatusAndNotify(
      orderId,
      newStatus,
      data,
      {
        description:'Statut mis à jour par la boutique'
      }
    );

    $('sfNum').value=num;

    alert('Suivi enregistré et notification traitée ✅');

  }catch(e){
    alert(e.message);
  }

});


    // Ajouter un événement
  
$('btnAddEvt').addEventListener('click',async()=>{

  const st=$('sfEvtStatus').value;
  const location=$('sfEvtLoc').value.trim();
  const description=$('sfEvtDesc').value.trim();

  if(!st){
    alert('Choisis un statut');
    return;
  }

  try{

    await saveTrackingStatusAndNotify(
      orderId,
      st,
      {},
      {
        location:location,
        description:description || 'Mise à jour du suivi',
        forceEvent:true
      }
    );

    // Recharge les événements depuis Firestore
    const evs=await getDocs(
      query(
        collection(db,'orders',orderId,'trackingEvents'),
        orderBy('timestamp','desc')
      )
    );

    events=evs.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    $('sfEvtLoc').value='';
    $('sfEvtDesc').value='';

    paintEvents();

    alert('Événement enregistré ✅');

  }catch(e){
    alert(e.message);
  }

});

  }catch(e){
    alert('Erreur ouverture du suivi : '+e.message);
  }
}

/* ================== AUTH STATE ================== */  
onAuthStateChanged(auth,async(u)=>{
  if(!u){showLogin();return;}
  try{
    const b=await findBoutiqueByEmail(u.email||'');
    if(!b){showLogin();return;}
    if(!u.emailVerified){showLogin();return;}
    boutique=b;boutiqueId=b.id;
    enterDash();
  }catch(e){showLogin();}
});

/* ================== FERMETURE PROPRE ================== */
window.addEventListener('beforeunload',()=>{
  if(unsubChat){try{unsubChat();}catch(e){}}
});
</script>
