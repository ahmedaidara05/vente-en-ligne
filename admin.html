<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#00A854"/>
<title>IDUS Admin</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--accent:#00A854;--text:#eee;--muted:#888;--danger:#ef4444;--border:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.top h2{font-size:16px;color:var(--accent)}
.nav{display:flex;gap:6px;padding:10px;flex-wrap:wrap;background:#151525}
.nav button{padding:8px 12px;font-size:12px;background:var(--card);color:#fff;border:none;border-radius:8px;cursor:pointer}
.nav button.on{background:var(--accent)}
.panel{display:none;padding:14px;padding-bottom:40px}.panel.on{display:block}
.card{background:var(--card);padding:14px;border-radius:10px;margin-bottom:12px}
.card h3{margin-bottom:10px;color:var(--accent);font-size:15px}
input,select,textarea{width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);background:#111;color:#fff;font-size:14px}
button.primary{padding:10px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}
button.sm{padding:6px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:#222;color:#fff;cursor:pointer;margin:2px}
button.danger{color:var(--danger);border-color:var(--danger)}
.item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.muted{color:var(--muted);font-size:12px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#222}
.img-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.img-grid .box{width:72px;height:72px;border-radius:8px;overflow:hidden;position:relative;background:#222;border:1px solid var(--border)}
.img-grid .box img{width:100%;height:100%;object-fit:cover}
.img-grid .box .rm{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer}
.err{color:var(--danger);font-size:13px;margin:8px 0}
.filebtn{display:inline-block;padding:10px 14px;background:var(--accent);color:#fff;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.filebtn input{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="top"><h2>IDUS Admin</h2><span class="muted">Accès libre</span></div>
  <div class="nav">
    <button type="button" class="on" data-p="dash">Dashboard</button>
    <button type="button" data-p="products">Produits</button>
    <button type="button" data-p="orders">Commandes</button>
    <button type="button" data-p="categories">Catégories</button>
    <button type="button" data-p="add">+ Produit</button>
  </div>
  <div id="panel-dash" class="panel on"><div class="card"><h3>Dashboard</h3><p id="stats">…</p></div></div>
  <div id="panel-products" class="panel"><div class="card">
    <div class="row">
      <input id="prodSearch" placeholder="Rechercher…" style="flex:1"/>
      <select id="prodCat"><option value="">Toutes cat.</option></select>
      <select id="prodSort"><option value="new">Récents</option><option value="pa">Prix ↑</option><option value="pd">Prix ↓</option></select>
    </div>
    <div id="prodList"></div>
  </div></div>
  <div id="panel-orders" class="panel"><div class="card"><h3>Commandes</h3><div id="orderList"></div></div></div>
  <div id="panel-categories" class="panel"><div class="card"><h3>Catégories</h3>
    <div id="catList"></div>
    <div class="row" style="margin-top:12px">
      <input id="newCat" placeholder="Nouvelle catégorie" style="flex:1"/>
      <button type="button" class="primary" id="btnAddCat">Ajouter</button>
    </div>
    <p id="catErr" class="err" style="display:none"></p>
  </div></div>
  <div id="panel-add" class="panel"></div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { getStorage, ref, uploadString, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';
const firebaseConfig={apiKey:"AIzaSyDkKvnL5_pHGraCFMcfXvueywwujCIG8SE",authDomain:"idus-a87a6.firebaseapp.com",projectId:"idus-a87a6",storageBucket:"idus-a87a6.firebasestorage.app",messagingSenderId:"284785552985",appId:"1:284785552985:web:4cb12a71465a0e167bcb48",measurementId:"G-M0EKXCDV3R"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);let storage=null;try{storage=getStorage(app);}catch(e){}
let products=[],categories=[],editGroups=[],editImages=[],editId=null;
function esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML;}
function show(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.getAttribute('data-p')===id));const panel=document.getElementById('panel-'+id);if(panel)panel.classList.add('on');if(id==='dash')loadStats();if(id==='products')loadProducts();if(id==='orders')loadOrders();if(id==='categories')loadCats();if(id==='add'){if(!editId){editGroups=[];editImages=[];}openForm();}}
document.querySelectorAll('.nav button').forEach(btn=>{btn.addEventListener('click',()=>{const id=btn.getAttribute('data-p');if(id==='add')editId=null;show(id);});});
async function loadStats(){try{const[ps,os,cs]=await Promise.all([getDocs(collection(db,'products')),getDocs(collection(db,'orders')),getDocs(collection(db,'categories'))]);document.getElementById('stats').innerHTML='Produits: <b>'+ps.size+'</b><br>Commandes: <b>'+os.size+'</b><br>Catégories: <b>'+cs.size+'</b>';}catch(e){document.getElementById('stats').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}
async function loadCats(){const listEl=document.getElementById('catList');const errEl=document.getElementById('catErr');if(errEl)errEl.style.display='none';try{const s=await getDocs(collection(db,'categories'));categories=s.docs.map(d=>({id:d.id,...d.data()}));listEl.innerHTML=categories.map(c=>'<div class="item">'+esc(c.name)+' <button type="button" class="sm danger" data-del-cat="'+c.id+'">Suppr</button></div>').join('')||'<div class="muted">Aucune</div>';listEl.querySelectorAll('[data-del-cat]').forEach(b=>b.addEventListener('click',()=>delCat(b.getAttribute('data-del-cat'))));const sel=document.getElementById('prodCat');if(sel){const cur=sel.value;sel.innerHTML='<option value="">Toutes cat.</option>'+categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');sel.value=cur;}}catch(e){listEl.innerHTML='<div class="err">'+esc(e.message)+'</div>';}}
async function addCat(){const input=document.getElementById('newCat');const errEl=document.getElementById('catErr');const name=(input&&input.value||'').trim();if(!name){if(errEl){errEl.textContent='Entre un nom';errEl.style.display='block';}return;}try{await addDoc(collection(db,'categories'),{name,order:categories.length,createdAt:serverTimestamp()});input.value='';await loadCats();alert('Catégorie créée');}catch(e){if(errEl){errEl.textContent=e.message;errEl.style.display='block';}alert(e.message);}}
document.getElementById('btnAddCat').addEventListener('click',addCat);
async function delCat(id){if(!confirm('Supprimer?'))return;try{await deleteDoc(doc(db,'categories',id));await loadCats();}catch(e){alert(e.message);}}
async function loadProducts(){try{const s=await getDocs(collection(db,'products'));products=s.docs.map(d=>({id:d.id,...d.data()}));await loadCats();renderProdList();}catch(e){document.getElementById('prodList').innerHTML='<div class="err">'+esc(e.message)+'</div>';}}
function renderProdList(){const q=(document.getElementById('prodSearch')?.value||'').toLowerCase();const cat=document.getElementById('prodCat')?.value||'';const sort=document.getElementById('prodSort')?.value||'new';let list=products.slice();if(q)list=list.filter(p=>((p.name||'')+' '+(p.description||'')).toLowerCase().includes(q));if(cat)list=list.filter(p=>p.categoryId===cat);if(sort==='pa')list.sort((a,b)=>(a.price||0)-(b.price||0));if(sort==='pd')list.sort((a,b)=>(b.price||0)-(a.price||0));const cn=id=>(categories.find(c=>c.id===id)||{}).name||'—';document.getElementById('prodList').innerHTML=list.map(p=>{const img=(p.images&&p.images[0])||'';return '<div class="item"><div class="row">'+(img?'<img class="thumb" src="'+esc(img)+'" onerror="this.style.display=\'none\'"/>':'')+'<div style="flex:1"><b>'+esc(p.name)+'</b><br/>'+(p.price||0)+' F · stock '+(p.stock??0)+' · '+esc(cn(p.categoryId))+((p.variantGroups&&p.variantGroups.length)?' · '+p.variantGroups.length+' variante(s)':'')+'</div></div><button type="button" class="sm" data-edit="'+p.id+'">Modifier</button> <button type="button" class="sm danger" data-del="'+p.id+'">Supprimer</button></div>';}).join('')||'<div class="muted">Aucun produit</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editProd(b.getAttribute('data-edit'))));document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>delProd(b.getAttribute('data-del'))));}
document.getElementById('prodSearch').addEventListener('input',renderProdList);document.getElementById('prodCat').addEventListener('change',renderProdList);document.getElementById('prodSort').addEventListener('change',renderProdList);
async function delProd(id){if(!confirm('Supprimer?'))return;try{await deleteDoc(doc(db,'products',id));await loadProducts();}catch(e){alert(e.message);}}
function editProd(id){const p=products.find(x=>x.id===id);if(!p)return;editId=id;editGroups=JSON.parse(JSON.stringify(p.variantGroups||[]));editImages=(p.images&&p.images.length)?p.images.slice():[];show('add');setTimeout(()=>{const n=document.getElementById('pName');if(!n)return;n.value=p.name||'';document.getElementById('pPrice').value=p.price||0;document.getElementById('pPromo').value=p.promoPrice||'';document.getElementById('pStock').value=p.stock??0;const ss=document.getElementById('pShowStock');if(ss)ss.checked=p.showStock!==false;const dl=document.getElementById('pDelivery');if(dl)dl.value=p.deliveryTime||'2 jours';document.getElementById('pDesc').value=p.description||'';document.getElementById('pCat').value=p.categoryId||'';document.getElementById('pPub').checked=p.published!==false;renderImgs();renderVars();},80);}
function openForm(){if(!categories.length)loadCats().then(fillForm);else fillForm();}
function fillForm(){const catOpts=categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');document.getElementById('panel-add').innerHTML='<div class="card"><h3>'+(editId?'Modifier':'Nouveau')+' produit</h3><label>Nom *</label><input id="pName"/><div class="row"><div style="flex:1"><label>Prix de base *</label><input id="pPrice" type="number" min="0"/></div><div style="flex:1"><label>Prix promo</label><input id="pPromo" type="number" min="0"/></div></div><label>Stock</label><input id="pStock" type="number" value="10" min="0"/><label><input type="checkbox" id="pShowStock" checked/> Afficher le stock sur l\'app</label><label>Délai de livraison</label><select id="pDelivery"><option value="Moins de 24h">Moins de 24h</option><option value="2 jours">2 jours</option><option value="3 jours">3 jours</option><option value="5 jours">5 jours</option><option value="2 semaines">2 semaines</option><option value="3 semaines">3 semaines</option><option value="1 mois">1 mois</option><option value="2 mois">2 mois</option><option value="3 mois">3 mois</option></select><label>Catégorie</label><select id="pCat"><option value="">— Choisir —</option>'+catOpts+'</select><label>Description</label><textarea id="pDesc" rows="2"></textarea><label>Images produit (galerie uniquement, max 20)</label><div id="imgList" class="img-grid"></div><label class="filebtn">+ Ajouter depuis la galerie<input type="file" id="fileImg" accept="image/*" multiple/></label><p class="muted" id="imgCount">0 / 20 images</p><label style="margin-top:12px">Variantes</label><div id="varList" style="background:#111;padding:10px;border-radius:8px;margin:6px 0"></div><button type="button" class="sm" id="btnAddGroup">+ Groupe de variantes</button><p class="muted" style="margin:8px 0">Chaque option peut avoir une image (galerie).</p><label><input type="checkbox" id="pPub" checked/> Publié</label><div style="margin-top:12px"><button type="button" class="primary" id="btnSaveProd">Enregistrer</button></div><p id="saveErr" class="err" style="display:none"></p></div>';document.getElementById('fileImg').addEventListener('change',onGalleryPick);document.getElementById('btnAddGroup').addEventListener('click',()=>{editGroups.push({name:'',options:[{label:'',priceDelta:0,image:''}]});renderVars();});document.getElementById('btnSaveProd').addEventListener('click',saveProd);renderImgs();renderVars();}
function renderImgs(){const el=document.getElementById('imgList');const cnt=document.getElementById('imgCount');if(!el)return;el.innerHTML=editImages.map((u,i)=>'<div class="box"><img src="'+esc(u)+'" onerror="this.parentElement.style.opacity=.3"/><button type="button" class="rm" data-rm="'+i+'">×</button></div>').join('');if(cnt)cnt.textContent=editImages.length+' / 20 images';el.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{editImages.splice(+b.getAttribute('data-rm'),1);renderImgs();}));}
function compressImage(file,maxW,quality){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality));};img.onerror=reject;img.src=reader.result;};reader.onerror=reject;reader.readAsDataURL(file);});}
async function uploadImage(dataUrl){if(storage){try{const path='products/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';const r=ref(storage,path);await uploadString(r,dataUrl,'data_url');return await getDownloadURL(r);}catch(e){console.warn('Storage fail',e);}}return dataUrl;}
async function onGalleryPick(e){const files=Array.from(e.target.files||[]);if(!files.length)return;const cnt=document.getElementById('imgCount');for(const file of files){if(editImages.length>=20){alert('Maximum 20 images');break;}if(cnt)cnt.textContent='Chargement image…';try{const dataUrl=await compressImage(file,900,0.7);let url=dataUrl;try{url=await uploadImage(dataUrl);}catch(err){url=dataUrl;}if(!url)url=dataUrl;editImages.push(url);renderImgs();}catch(err){alert('Erreur image: '+err.message);}}e.target.value='';renderImgs();}
function renderVars(){const el=document.getElementById('varList');if(!el)return;if(!editGroups.length){el.innerHTML='<p class="muted">Aucun groupe</p>';return;}el.innerHTML=editGroups.map((g,gi)=>'<div style="border:1px solid #333;padding:8px;border-radius:8px;margin-bottom:8px"><div class="row"><input placeholder="Nom groupe" value="'+esc(g.name)+'" style="flex:1;font-weight:600" data-gn="'+gi+'"/><button type="button" class="sm danger" data-rm-g="'+gi+'">Suppr</button></div>'+(g.options||[]).map((o,oi)=>'<div style="border-top:1px solid #222;padding-top:8px;margin-top:8px"><div class="row"><input placeholder="Option" value="'+esc(o.label||'')+'" style="flex:1" data-ol="'+gi+'-'+oi+'"/><input type="number" placeholder="+prix" value="'+(o.priceDelta||0)+'" style="width:80px" data-op="'+gi+'-'+oi+'"/><button type="button" class="sm" data-rm-o="'+gi+'-'+oi+'">×</button></div>'+(o.image?'<div class="row"><img class="thumb" src="'+esc(o.image)+'"/><button type="button" class="sm danger" data-clr-oi="'+gi+'-'+oi+'">Retirer</button></div>':'')+'<label class="filebtn" style="font-size:11px;padding:6px 10px;margin-top:4px">Image option<input type="file" accept="image/*" data-opt-file="'+gi+'-'+oi+'"/></label></div>').join('')+'<button type="button" class="sm" data-add-o="'+gi+'" style="margin-top:6px">+ Option</button></div>').join('');el.querySelectorAll('[data-gn]').forEach(inp=>inp.addEventListener('change',()=>{editGroups[+inp.getAttribute('data-gn')].name=inp.value;}));el.querySelectorAll('[data-rm-g]').forEach(b=>b.addEventListener('click',()=>{editGroups.splice(+b.getAttribute('data-rm-g'),1);renderVars();}));el.querySelectorAll('[data-ol]').forEach(inp=>{const[gi,oi]=inp.getAttribute('data-ol').split('-').map(Number);inp.addEventListener('change',()=>{editGroups[gi].options[oi].label=inp.value;});});el.querySelectorAll('[data-op]').forEach(inp=>{const[gi,oi]=inp.getAttribute('data-op').split('-').map(Number);inp.addEventListener('change',()=>{editGroups[gi].options[oi].priceDelta=parseFloat(inp.value)||0;});});el.querySelectorAll('[data-rm-o]').forEach(b=>{const[gi,oi]=b.getAttribute('data-rm-o').split('-').map(Number);b.addEventListener('click',()=>{editGroups[gi].options.splice(oi,1);renderVars();});});el.querySelectorAll('[data-clr-oi]').forEach(b=>{const[gi,oi]=b.getAttribute('data-clr-oi').split('-').map(Number);b.addEventListener('click',()=>{editGroups[gi].options[oi].image='';renderVars();});});el.querySelectorAll('[data-add-o]').forEach(b=>b.addEventListener('click',()=>{editGroups[+b.getAttribute('data-add-o')].options.push({label:'',priceDelta:0,image:''});renderVars();}));el.querySelectorAll('[data-opt-file]').forEach(inp=>{inp.addEventListener('change',async(e)=>{const[gi,oi]=inp.getAttribute('data-opt-file').split('-').map(Number);const file=e.target.files&&e.target.files[0];if(!file)return;try{const dataUrl=await compressImage(file,600,0.7);editGroups[gi].options[oi].image=await uploadImage(dataUrl);renderVars();}catch(err){alert(err.message);}});});}
async function saveProd(){const errEl=document.getElementById('saveErr');const name=document.getElementById('pName').value.trim();const price=parseFloat(document.getElementById('pPrice').value)||0;if(!name||price<0){if(errEl){errEl.textContent='Nom et prix requis';errEl.style.display='block';}return;}const images=editImages.filter(Boolean).slice(0,20);const variantGroups=editGroups.filter(g=>g.name&&(g.options||[]).some(o=>o.label)).map(g=>({name:g.name.trim(),options:(g.options||[]).filter(o=>o.label).map(o=>({label:o.label.trim(),priceDelta:parseFloat(o.priceDelta)||0,image:(o.image||'').trim()}))}));const data={name,price,promoPrice:parseFloat(document.getElementById('pPromo').value)||null,stock:parseInt(document.getElementById('pStock').value)||0,showStock:document.getElementById('pShowStock')?document.getElementById('pShowStock').checked:true,deliveryTime:document.getElementById('pDelivery')?document.getElementById('pDelivery').value:'2 jours',description:document.getElementById('pDesc').value.trim(),categoryId:document.getElementById('pCat').value||null,images,variantGroups,published:document.getElementById('pPub').checked,updatedAt:serverTimestamp()};try{if(editId)await updateDoc(doc(db,'products',editId),data);else{data.createdAt=serverTimestamp();data.sold=0;await addDoc(collection(db,'products'),data);}alert('Produit enregistré');editId=null;show('products');}catch(e){if(errEl){errEl.textContent=e.message;errEl.style.display='block';}alert(e.message);}}
async function loadOrders(){try{const s=await getDocs(collection(db,'orders'));const list=s.docs.map(d=>({id:d.id,...d.data()}));document.getElementById('orderList').innerHTML=list.map(o=>{const c=o.customer||{};const client=[c.name,c.phone,c.email,c.address,c.city].filter(Boolean).map(esc).join('<br/>')||'—';const items=(o.items||[]).map(i=>{const v=i.variants?Object.entries(i.variants).map(([k,val])=>k+': '+val).join(', '):'';return i.qty+'× '+esc(i.name)+(v?' ('+esc(v)+')':'')+' — '+(i.price||0)+' F';}).join('<br/>');return '<div class="item"><b>#'+esc(o.orderNumber||o.id.slice(0,8))+'</b> · '+esc(o.status||'pending')+' · <b>'+(o.total||0)+' F</b><br/><span class="muted">Client:</span><br/>'+client+'<br/><span class="muted">Articles:</span><br/>'+(items||'—')+'</div>';}).join('')||'<div class="muted">Aucune commande</div>';}catch(e){document.getElementById('orderList').innerHTML='<div class="err">'+esc(e.message)+'</div>';}}
loadStats();loadCats();
</script>
</body>
</html>
