<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#00A854"/>
<title>IDUS Admin</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--accent:#00A854;--text:#eee;--muted:#888;--danger:#ef4444;--border:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.top h2{font-size:16px;color:var(--accent)}
.nav{display:flex;gap:6px;padding:10px;flex-wrap:wrap;background:#151525}
.nav button{padding:8px 12px;font-size:12px;background:var(--card);color:#fff;border:none;border-radius:8px;cursor:pointer}
.nav button.on{background:var(--accent)}
.panel{display:none;padding:14px;padding-bottom:40px}.panel.on{display:block}
.card{background:var(--card);padding:14px;border-radius:10px;margin-bottom:12px}
.card h3{margin-bottom:10px;color:var(--accent);font-size:15px}
input,select,textarea{width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);background:#111;color:#fff;font-size:14px}
button.primary{padding:10px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}
button.sm{padding:6px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:#222;color:#fff;cursor:pointer;margin:2px}
button.danger{color:var(--danger);border-color:var(--danger)}
.item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.muted{color:var(--muted);font-size:12px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.err{color:var(--danger);font-size:13px;margin:8px 0}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);padding:24px;border-radius:12px;width:100%;max-width:360px}
.login-box h2{color:var(--accent);margin-bottom:6px;font-size:18px}
.login-box .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
#app{display:none}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <h2>IDUS Admin</h2>
    <p class="sub">Connexion réservée. E-mail vérifié requis.</p>
    <label>E-mail</label>
    <input id="admEmail" type="email" autocomplete="username"/>
    <label>Mot de passe</label>
    <input id="admPass" type="password" autocomplete="current-password"/>
    <button type="button" class="primary" id="admLoginBtn" style="width:100%;margin-top:8px">Connexion</button>
    <button type="button" class="sm" id="admResendBtn" style="width:100%;margin-top:8px;display:none">Renvoyer l’e-mail de validation</button>
    <p id="admLoginErr" class="err" style="display:none"></p>
    <p id="admLoginOk" class="muted" style="display:none;color:#00A854"></p>
  </div>
</div>
<div id="app">
<div class="top"><h2>IDUS Admin</h2><span class="muted" id="admUserLabel">—</span> <button type="button" class="sm" id="admLogout">Déconnexion</button></div>
<div class="nav">
<button type="button" class="on" data-p="dash">Dashboard</button>
<button type="button" data-p="products">Produits</button>
<button type="button" data-p="orders">Commandes</button>
<button type="button" data-p="categories">Catégories</button>
<button type="button" data-p="boutiques">Boutiques</button>
<button type="button" data-p="ads">Pubs</button>
</div>
<p class="muted" style="padding:12px">Fichier admin partiel — utilise la version locale complete si besoin. Auth gate actif.</p>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendEmailVerification } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyDkKvnL5_pHGraCFMcfXvueywwujCIG8SE",authDomain:"idus-a87a6.firebaseapp.com",projectId:"idus-a87a6",storageBucket:"idus-a87a6.firebasestorage.app",messagingSenderId:"284785552985",appId:"1:284785552985:web:4cb12a71465a0e167bcb48",measurementId:"G-M0EKXCDV3R"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const auth=getAuth(app);
function showLogin(){document.getElementById('loginScreen').style.display='flex';document.getElementById('app').style.display='none';}
function showApp(user){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';document.getElementById('admUserLabel').textContent=(user.email||'').split('@')[0]+' · admin';}
async function isPlatformAdmin(uid){try{const s=await getDoc(doc(db,'users',uid));if(!s.exists())return false;const r=s.data().role;return r==='superadmin'||r==='admin';}catch(e){return false;}}
function setLoginErr(msg){const el=document.getElementById('admLoginErr');el.style.display=msg?'block':'none';el.textContent=msg||'';}
document.getElementById('admLoginBtn').addEventListener('click',async()=>{const email=document.getElementById('admEmail').value.trim();const pass=document.getElementById('admPass').value;setLoginErr('');if(!email||!pass){setLoginErr('E-mail et mot de passe requis');return;}try{const cred=await signInWithEmailAndPassword(auth,email,pass);await cred.user.reload();if(!cred.user.emailVerified){document.getElementById('admResendBtn').style.display='block';setLoginErr('E-mail non validé. Ouvre le lien reçu, puis reconnecte-toi.');await signOut(auth);return;}const ok=await isPlatformAdmin(cred.user.uid);if(!ok){setLoginErr('Compte non autorisé (rôle admin requis).');await signOut(auth);return;}showApp(cred.user);}catch(e){setLoginErr(e.message||'Connexion impossible');}});
document.getElementById('admResendBtn').addEventListener('click',async()=>{const email=document.getElementById('admEmail').value.trim();const pass=document.getElementById('admPass').value;try{const cred=await signInWithEmailAndPassword(auth,email,pass);await sendEmailVerification(cred.user);await signOut(auth);setLoginErr('');document.getElementById('admLoginOk').style.display='block';document.getElementById('admLoginOk').textContent='E-mail de validation renvoyé.';}catch(e){setLoginErr(e.message);}});
document.getElementById('admLogout').addEventListener('click',async()=>{await signOut(auth);showLogin();});
onAuthStateChanged(auth,async(u)=>{if(!u){showLogin();return;}await u.reload();if(!u.emailVerified){showLogin();document.getElementById('admResendBtn').style.display='block';setLoginErr('Valide ton e-mail via le lien reçu.');return;}const ok=await isPlatformAdmin(u.uid);if(!ok){await signOut(auth);showLogin();setLoginErr('Compte non autorisé.');return;}showApp(u);});
</script>
</body>
</html>
